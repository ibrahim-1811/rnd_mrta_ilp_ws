[workspace]
name = "rnd_mrta_ilp_ws"
version = "0.1.0"
description = "Outcome-aware ILP for explainable grid-aware multi-robot task allocation"
authors = ["Mohammad Ibrahim Memon"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
networkx = "*"
matplotlib = "*"
pyyaml = "*"
tqdm = "*"
pytest = "*"
ruff = "*"
mypy = "*"
swi-prolog = "*"

[tasks]
test = "PYTHONPATH=src/mrta_core python -m pytest -q"
lint = "ruff check ."
format = "ruff format ."
tree = "find . -maxdepth 4 -type f -not -path \"./.git/*\" -not -path \"./.pixi/*\" -not -path \"./.pytest_cache/*\" | sort"