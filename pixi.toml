[workspace]
name = "rnd_mrta_ilp_ws"
version = "0.1.0"
description = "Outcome-aware ILP for explainable grid-aware multi-robot task allocation"
authors = ["Mohammad Ibrahim Memon"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
networkx = "*"
matplotlib = "*"
pyyaml = "*"
tqdm = "*"
pytest = "*"
ruff = "*"
mypy = "*"
swi-prolog = "*"
openpyxl = ">=3.1.5,<4"
# Phase 8 decision/outcome dataset: Parquet is the format of record
# (docs/DECISIONS.md, "Decision and Outcome Dataset").
pyarrow = "*"

[tasks]
test = "PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management python -m pytest src/mrta_core/tests src/simulation_env/test src/task_management/test -q"
lint = "ruff check ."
format = "ruff format ."
tree = "find . -maxdepth 4 -type f -not -path \"./.git/*\" -not -path \"./.pixi/*\" -not -path \"./.pytest_cache/*\" | sort"
