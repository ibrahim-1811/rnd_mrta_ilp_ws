[workspace]
name = "rnd_mrta_ilp_ws"
version = "0.1.0"
description = "Outcome-aware ILP for explainable grid-aware multi-robot task allocation"
authors = ["Mohammad Ibrahim Memon"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = "*"
pandas = "*"
scipy = "*"
networkx = "*"
matplotlib = "*"
pyyaml = "*"
tqdm = "*"
pytest = "*"
ruff = "*"
mypy = "*"
swi-prolog = "*"
openpyxl = ">=3.1.5,<4"
# Phase 8 decision/outcome dataset: Parquet is the format of record
# (docs/DECISIONS.md, "Decision and Outcome Dataset").
pyarrow = "*"
clingo = ">=5.8.2,<6"
setuptools = "<81"

[tasks]
test = "PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management:src/ilp_learning python -m pytest src/mrta_core/tests src/simulation_env/test src/task_management/test src/ilp_learning/test -q"
test-ilp = "PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management:src/ilp_learning python -m pytest src/ilp_learning/test -q -rs"
m3-induction = "PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management:src/ilp_learning python -m ilp_learning.m3_induction"
m3-validation = "PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management:src/ilp_learning python -m ilp_learning.m3_validation"
lint = "ruff check ."
lint-src = "ruff check src"
format = "ruff format ."
tree = "find . -maxdepth 4 -type f -not -path \"./.git/*\" -not -path \"./.pixi/*\" -not -path \"./.pytest_cache/*\" | sort"

[pypi-dependencies]
popper-ilp = { git = "https://github.com/logic-and-learning-lab/Popper.git", rev = "v4.4.0" }
janus-swi = ">=1.5.3, <2"
