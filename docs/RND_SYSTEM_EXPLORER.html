"cells_held_by_others","line":87,"kind":"function","doc":"Cells another robot is standing on or driving into.\n\nIdle and servicing robots never release their cell, so a\nplanner may treat these as static obstacles."},{"name":"check_move","line":98,"kind":"function","doc":"Why this move is unsafe right now, or None if it is safe."},{"name":"occupy","line":123,"kind":"function","doc":"Initial placement of a robot."},{"name":"begin_move","line":141,"kind":"function","doc":"Claim the target and open the edge traversal."},{"name":"begin_moves_batch","line":173,"kind":"function","doc":"Atomically begin multiple simultaneous one-cell moves.\n\n``moves`` contains ``(robot_id, source, target)`` tuples.\n\nThis is the runtime primitive for local synchronous traffic.\nA robot may enter a cell that another approved robot is\nvacating in the same batch.\n\nGuarantees:\n- target cells are unique\n- a target may only be occupied by a robot leaving in this batch\n- direct head-on edge swaps are rejected\n- all sources release before any target is claimed"},{"name":"complete_move","line":295,"kind":"function","doc":"Complete one move.\n\nNormally the source is released on arrival.\n\nA service-entry move may deliberately retain its source.\nThat source is the robot's guaranteed one-cell retreat path\nwhile PICKING or DROPPING."},{"name":"release","line":333,"kind":"function","doc":""},{"name":"close","line":355,"kind":"function","doc":"Close every open interval, for auditing after a run."},{"name":"audit","line":373,"kind":"function","doc":"Re-derive the guarantees from the logged intervals.\n\nOnly intervals that can conflict are compared: two holds of one\ncell, and two moves over one pair of cells in opposite\ndirections. Comparing every logged move with every other move\ntook hours after a 100-robot, 2000-order run, and the run's\nfinal report waited on it. The problems found, and their order,\nare exactly those of that all-pairs scan."},{"name":"overlaps","line":386,"kind":"function","doc":""}],"imports":["dataclasses: dataclass, field","fractions: Fraction","mrta_core.grid: Cell"],"summary":"Time-indexed cell and directed-edge reservations.\n\nRobots hold cells over time intervals rather than over discrete\ntimesteps, because service holds (2.0 s) and moves (2/3 s) do not share\na common tick: two robots can easily be out of phase.\n\nOccupancy model\n---------------\nA robot always holds the cell it stands on. While traversing A -> B it\nholds *both*: it keeps A until it arrives and claims B the moment it\nsets off. Holding both is what stops a third robot slipping into B\nmid-transit, or into A before the mover has cleared it.\n\nThat single rule gives all four required guarantees:\n\n* two robots never share a cell        -- ownership is exclusive\n* two never enter a cell together      -- the first claim wins\n* no A->B / B->A swap                  -- checked against live transits\n* no entering a cell held by a robot that is PICKING, DROPPING,\n  WAITING or IDLE -- a stationary robot never releases its cell\n\nEvery claim and release is also logged, so a finished run can be\naudited independently of the live bookkeeping."},{"path":"src/simulation_env/simulation_env/run_metrics.py","size":9146,"symbols":[{"name":"_trips","line":36,"kind":"function","doc":"Every charging-workflow record of the run, once."},{"name":"run_metrics","line":47,"kind":"function","doc":"The protocol's run-level metrics for a finished run."},{"name":"_share","line":131,"kind":"function","doc":"Waiting as a share of all time robots spent on missions."},{"name":"_battery_metrics","line":143,"kind":"function","doc":""},{"name":"write_metrics","line":212,"kind":"function","doc":""}],"imports":["json: dumps","pathlib: Path","statistics: mean, median","simulation_env.battery_ledger: fleet_summary"],"summary":"Run-level metrics: the numbers an experiment compares, one file per run.\n\ndocs/EXPERIMENT_PROTOCOL.md, \"Core Metrics\", lists what a run is judged\non: MRTA, traffic and battery metrics. The final report prints them;\nthis module gathers the same numbers into one dict so a run directory\ncarries them as ``metrics.json`` beside its decision and outcome tables,\nand an experiment can be plotted without reading terminal output.\n\nRead only. Every value is taken from the finished executor, its engine,\nits battery ledger and its charge records; nothing here feeds back into\na run. Realized outcomes only: decision-time features stay in the\ndecision table (docs/DECISIONS.md, \"Decision-Time Features\").\n\nSchema version 2 (B6a) separates order work from end-of-work recovery\n(docs/DECISIONS.md, \"End of Workload\"). Every version-1 field is kept\nwith its old value; ``makespan_s`` and ``throughput_orders_per_h`` are\nthe engine's end time and are superseded by ``fleet_recovery_time_s``\nand, for order work, ``order_makespan_s`` / ``order_throughput_per_h``.\nThe fields and their units are listed in docs/EXPERIMENT_PROTOCOL.md,\n\"Run Metrics Schema\"."},{"path":"src/simulation_env/simulation_env/stage_parking.py","size":6689,"symbols":[{"name":"StageParking","line":44,"kind":"class","doc":"Claims Stage Zone cells for returning robots, without duplicates."},{"name":"__init__","line":47,"kind":"function","doc":""},{"name":"claims","line":69,"kind":"function","doc":"robot_id -> the Stage Zone it holds."},{"name":"claim_of","line":73,"kind":"function","doc":""},{"name":"holder_of","line":76,"kind":"function","doc":""},{"name":"cell_for","line":79,"kind":"function","doc":"The cell this robot is parking on, if it holds a claim."},{"name":"release","line":86,"kind":"function","doc":"Give a claim back, for a return mission that never planned."},{"name":"free_zones","line":94,"kind":"function","doc":"Bank cells nobody holds and nobody is standing on."},{"name":"route_cost","line":106,"kind":"function","doc":"Directed A* cost from a cell to a bank cell, or None.\n\nUses the production router, so the cost that decides parking is\nthe same number the executor will drive. ``cache`` is the run's\nRouteCache; it only memoizes, so the answer is identical with\nor without it."},{"name":"assign","line":130,"kind":"function","doc":"Claim the cheapest free Stage Zone for each robot.\n\n``robot_cells`` is robot_id -> the cell it is standing on.\n``blocked_cells`` are cells held by robots outside this batch,\nso a bank cell somebody is still standing on is not handed to\nsomebody else.\n\nReturns robot_id -> zone_id for every robot that got one. A\nrobot with no reachable free zone is simply absent, and the\ncaller decides what to do about it."}],"imports":["mrta_core.warehouse_routing: best_path_to_zone, non_transit_cells","simulation_env.fleet: home_bank"],"summary":"Final parking: the Stage Zone bank is a shared fleet resource.\n\nA robot is deployed onto a Stage Zone cell, and that is the only thing\nits spawn cell decides. It does not own that cell. While orders remain\nthe robot stays available from wherever its last retreat left it, and\ntakes more work from there -- it is never sent back to a home cell\nbetween orders.\n\nWhen the fleet runs out of work, each returning robot claims the\n*nearest free* Stage Zone by directed A* cost over the production road\ngraph. Not Manhattan: the warehouse is one-way, so the cheapest bank\ncell is a property of the legal route and frequently is not the\ngeometrically closest one, nor the cell the robot spawned on.\n\nReservation\n-----------\nA zone is claimed when the return mission is assigned, not when the\nrobot arrives, so two robots converging on the same bank cannot pick\nthe same cell. On arrival the claim simply becomes the occupancy. If\nthe nearest free zone is already claimed, the next cheapest reachable\nfree zone is taken instead.\n\nDeterminism\n-----------\nPairing is greedy over the whole batch, ordered by\n\n    (route cost, zone_id, robot_id)\n\nRoute cost is the only scientific quantity in that key. ``zone_id``\nresolves an exact cost tie between two bank cells, and ``robot_id``\nonly ever breaks a tie that both earlier keys left equal. Robot\nidentity therefore carries no parking priority -- it exists so two runs\nof the same workload park identically.\n\nThis is fixed infrastructure. Every MRTA strategy parks through it,\nand parking never touches order ownership."},{"path":"src/simulation_env/simulation_env/work_accounting.py","size":6141,"symbols":[{"name":"counters_of","line":61,"kind":"function","doc":"One robot's cumulative counters at ``now``. Pure."},{"name":"_difference","line":75,"kind":"function","doc":""},{"name":"WorkAccounting","line":80,"kind":"class","doc":"Per-robot phase meter. Fed by the executor, read by run_metrics."},{"name":"register","line":97,"kind":"function","doc":"A robot joins the run, in support until it is given work."},{"name":"_enter","line":103,"kind":"function","doc":"Close the robot's current segment and open ``phase``.\n\nReturns what the closed segment spent."},{"name":"launched","line":124,"kind":"function","doc":""},{"name":"retired","line":127,"kind":"function","doc":"An order mission is fully driven. Returns what it spent."},{"name":"exhaust","line":134,"kind":"function","doc":"No order is pending any more.\n\n``idle`` is robot_id -> counters for every robot holding no\nunfinished order; each starts its recovery now. A robot still\nexecuting or owing an order starts it when that order retires."},{"name":"split","line":147,"kind":"function","doc":"phase -> counter -> run total, with every open segment closed.\n\n``final`` is robot_id -> counters at the end of the run. Pure:\nthe meter itself is not advanced, so it can be read twice."}],"imports":["dataclasses: dataclass, field"],"summary":"Which part of a run was order work, and which was recovery (B6a).\n\ndocs/DECISIONS.md, \"End of Workload\", keeps order work and end-of-work\nrecovery apart: charging or parking after the final order must not\nchange ``order_makespan``. The same separation is needed for distance,\nwaiting and energy, or a strategy whose robots happen to finish far\nfrom the Stage Zone bank is charged for its parking drive.\n\nEvery robot is in exactly one phase at every instant:\n\n    support      not executing an order while orders are still owed:\n                 from the start, between orders, charger trips during\n                 the workload, liveness repositioning\n    productive   executing an order mission, from launch at the\n                 robot's cell to the end of its drop-off retreat\n    recovery     after the workload is exhausted (the last order has\n                 been allocated) and the robot has retired its last\n                 order: final parking, and any charging done then\n\nTransitions happen at three instants only, all of them already\ndecided by the executor:\n\n    order launched                    -> productive\n    order retired, orders still owed  -> support\n    order retired, workload exhausted -> recovery\n    workload exhausted                -> recovery, for every robot not\n                                         holding an unfinished order\n\nMeasurement is the robots' own cumulative counters, the same ones the\nrun totals and the Phase 8 outcome rows read, snapshotted at each\ntransition and differenced. A phase is therefore a partition of the\nrun: support + productive + recovery is each counter's run total, and\nthe productive part is the sum of the per-order outcome rows.\n\nA move or wait in flight at the exhaustion instant is attributed by\nwhen the engine books it: distance when the move starts, travel and\nwaiting time when they close. Robots are stationary at launch and at\nretirement, so per-order values are exact.\n\nObservation only. Nothing here is read back by allocation, routing,\ntraffic, charging or battery feasibility."},{"path":"src/simulation_env/simulation_env/workload_executor.py","size":115941,"symbols":[{"name":"Dispatch","line":80,"kind":"class","doc":"One robot-order assignment as actually dispatched."},{"name":"IneligibleAssignmentError","line":98,"kind":"class","doc":"An allocator returned a robot-order pair the battery forbids.\n\nBattery eligibility is a hard feasibility constraint shared by every\nMRTA strategy. The executor never executes such a pair and never\nquietly hands the order to a different robot instead: that would be\nthe infrastructure making an allocation decision."},{"name":"BatteryEvent","line":109,"kind":"class","doc":"A battery state change the executor acted on. Reporting only."},{"name":"Completion","line":133,"kind":"class","doc":""},{"name":"PerfBudget","line":139,"kind":"class","doc":"Wall-clock accounting for one dispatch, for profiling only.\n\nEvery number here is CPU time, never simulated time. Nothing in\nthis class is read by the allocator, the planner, the clock or any\nmetric: a slower machine produces the same warehouse results with\nlarger numbers printed. That separation is the whole point --\nplanning cost must never leak into the science."},{"name":"Progress","line":209,"kind":"class","doc":"A periodic snapshot of the workload. Read-only reporting.\n\nThe five order counts are the five OrderStatus values, so they\nalways sum to the total. ``deferred_now`` is a *subset* of\n``assigned`` -- assignments whose robot is chosen but which are\nstill waiting for a route -- and must never be added to the\ntotal separately."},{"name":"WorkloadResult","line":254,"kind":"class","doc":""},{"name":"WorkloadExecutor","line":318,"kind":"class","doc":"Drives a whole OrderQueue across a fleet, end to end."},{"name":"battery_event_line","line":2906,"kind":"function","doc":""},{"name":"decision_report_lines","line":2914,"kind":"function","doc":"What shape the allocation decisions had (S0).\n\nThe one number that decides whether a strategy comparison means\nanything: a decision offering a single robot a single order is\nanswered identically by every strategy, so only the choice-bearing\nones can tell two strategies apart.\n\nSee docs/DECISIONS.md, \"Allocation Candidate Window\" and \"Strategy\nDistinctness Gate\"."},{"name":"eligibility_report_lines","line":2977,"kind":"function","doc":"Battery eligibility at decision time, for any front end."},{"name":"charging_report_lines","line":3018,"kind":"function","doc":"Charger and holding reservations, and every REQUEST trip (B3)."},{"name":"__init__","line":161,"kind":"function","doc":""},{"name":"stage","line":167,"kind":"function","doc":"Time one stage. Non-reentrant: the outermost stage wins.\n\nRecovery calls straight through to mission building and fleet\nplanning. Timing both levels would count the same seconds\ntwice and make ``total`` meaningless, so a nested stage is\nabsorbed by the one already running."},{"name":"total","line":190,"kind":"function","doc":""},{"name":"slow","line":193,"kind":"function","doc":""},{"name":"lines","line":196,"kind":"function","doc":""},{"name":"lines","line":234,"kind":"function","doc":""},{"name":"__init__","line":321,"kind":"function","doc":""},{"name":"_set_status","line":541,"kind":"function","doc":""},{"name":"available_robots","line":561,"kind":"function","doc":"Robots standing idle with nothing assigned, in id order.\n\nA robot is available the moment it is IDLE: it has finished its\nretreat into the aisle and is free to take work from where it\nstands. It is not sent home first."},{"name":"_nearest_charger","line":583,"kind":"function","doc":"(charger_id, metres) of the cheapest directed-A* charger leg.\n\nStatic geometry, independent of who is charging, so it is\nmemoized per cell for the whole run."},{"name":"_decision_timing","line":610,"kind":"function","doc":"Speeds and service durations the engine executes with.\n\nThe same for every strategy; a strategy that ignores time ignores\nit. Nothing realized is in it."},{"name":"_battery_context","line":628,"kind":"function","doc":"Decision-time battery view for ``robot_ids``, at this instant."},{"name":"_battery_event","line":642,"kind":"function","doc":""},{"name":"_enter_request","line":663,"kind":"function","doc":"Leave the available fleet for the charging workflow.\n\nThe robot is only marked here. ``_evacuate`` reserves its\nterminal and starts it moving at this same instant, before any\norder is allocated."},{"name":"_evacuate","line":683,"kind":"function","doc":"Send every robot in REQUEST to a reserved non-transit terminal.\n\n1. a FREE charger, cheapest by directed A*\n2. else a FREE holding cell, cheapest by directed A*\n3. else record saturation and take the nearest free Stage Zone\n\nEvery reservation is made before the robot moves. Robots asking\nat the same instant are paired as one batch, so they reserve\ndistinct cells. A CHARGE_DUE robot that got no charger may then\npreempt one (B5). Returns how many robots set off.\n\n``only`` and ``banks`` restrict the pass to named robots and a\nshorter list of banks; with ``preempt=False`` that is the\npreempted-robot path, which must take a holding cell and must\nnot itself preempt anybody."},{"name":"_settle","line":817,"kind":"function","doc":"The robot is on its reserved terminal: occupy it."},{"name":"_begin_charge","line":856,"kind":"function","doc":"Start charging the robot standing on its reserved charger.\n\nThe charge runs to exactly 100% (docs/DECISIONS.md, \"Charge\nTarget\"). The duration is exact rational arithmetic, so the\nsession lands on the target rather than near it."},{"name":"_charge_complete","line":886,"kind":"function","doc":"The robot is full: release the slot and reverse into the aisle.\n\nThe slot goes OCCUPIED -> VACATING *before* the robot moves and\nstays unavailable until the robot has physically cleared the\naccess edge, so an entering and a leaving robot can never meet\non it."},{"name":"_reverse_off_terminal","line":917,"kind":"function","doc":"Drive one cell, off the terminal, back into the aisle it came from.\n\nBuilt here rather than planned: the destination is a bare aisle\ncell, not a zone, and the move is the exact reverse of the entry\nthe topology gate already proves legal. The segment carries no\nexit_cell, so the engine drives it as a plain move and never\ntreats the terminal as a service station.\n\nShared by every exit from a terminal -- a full robot leaving its\ncharger (B4), a preempted one, and a promoted one leaving its\nholding cell (B5) -- so the three cannot drift apart."},{"name":"_assert_terminal_cleared","line":965,"kind":"function","doc":"Refuse to release a slot before the robot has really left it."},{"name":"_rejoin","line":982,"kind":"function","doc":"The robot has cleared the access edge: free the slot, rejoin.\n\nFrom here it is an ordinary robot again. The unchanged B2 gate\nre-tests it at its new SOC on the next dispatch, so it can take\nwork, and nothing about its order history changed. Reached by a\nrobot that charged to 100% (B4) and by a preempted robot that is\nstill energy-eligible (B5)."},{"name":"_queue_order","line":1018,"kind":"function","doc":"Waiting robots in the frozen queue-discipline order.\n\ndocs/DECISIONS.md, \"Charger Queue Discipline\": lowest SOC, then\nearliest charge request, then ``robot_id`` purely as the final\ndeterministic engineering tie-break. It carries no scientific\npriority meaning."},{"name":"_promote","line":1038,"kind":"function","doc":"Give every FREE charger to the robot that has waited best for it.\n\nOne idempotent pass per dispatch, so it fires both when a\ncharger is released and when a robot starts waiting. The pair\n(FREE reachable charger, waiting robot) therefore never survives\na tick, which is what stops a robot sitting in holding, or on a\nStage Zone, while a charger stands empty.\n\nA waiting robot is one in holding or, after saturation, on a\nStage Zone; both wait in one queue (docs/DECISIONS.md, \"Stage\nZone Promotion\"). Robot priority is the frozen queue discipline.\nThe cell each promoted robot gets is its cheapest FREE charger\nby directed A* from the cell it will really set off from --\nnever Manhattan -- among the c"},{"name":"_promotion_start","line":1140,"kind":"function","doc":"Where a waiting robot's charger route begins, and the metres before it.\n\nA holding cell is non-transit and is left by reversing into its\naccess cell, so the charger route starts there, one cell away. A\nStage Zone is left the way every robot leaves one for its first\norder: by the directed A* route from the Stage Zone cell itself."},{"name":"_expire_promises","line":1154,"kind":"function","doc":"Drop a preemption promise its robot can no longer collect.\n\nA promise is owed to a robot on its way to, or already in, a\nholding cell or a fallback Stage Zone. If it ended up somewhere\nelse -- back in the fleet, or already on a charger -- the charger\ngoes back on general offer rather than standing empty for\nnobody."},{"name":"_grant_charger","line":1182,"kind":"function","doc":"Reserve a FREE charger for a waiting robot and start it leaving.\n\nFrom holding, the holding slot goes OCCUPIED -> VACATING before\nthe robot moves and is released only once it physically stands\non its access cell, exactly as a charger is. So an entering and\na leaving robot can never meet on a terminal access edge, and no\nsecond robot can be promoted into the cell being vacated.\n\nFrom a Stage Zone, the robot drives straight off by its charger\nroute, and its Stage Zone claim is handed back. Nobody can be\ngiven that cell while the robot is still on it: a bank cell a\nrobot stands on is never free (StageParking.free_zones)."},{"name":"_leave_holding","line":1234,"kind":"function","doc":"A promoted robot is clear of holding: drive to its charger."},{"name":"_drive_to_charger","line":1263,"kind":"function","doc":"Start the charger trip of a robot promoted out of waiting.\n\nThe waiting trip has ended and the charger trip is a new record,\nso every record still describes exactly one terminal. The\noriginal charge request is carried over rather than restarted,\nwhich is what keeps the queue discipline and the reporting\nhonest about how long the robot really waited."},{"name":"_preempt","line":1316,"kind":"function","doc":"Let a CHARGE_DUE robot take a charger from a higher-SOC robot.\n\ndocs/DECISIONS.md, \"Charger Saturation and Preemption\": only a\nCHARGE_DUE robot may preempt, the victim is the charging robot\nwith the highest SOC, and only if that SOC is strictly above the\nrequester's -- a lower-SOC charging robot is never replaced by a\nhigher-SOC requester. ``victim_soc_ge_80`` is recorded, never\nbranched on: the rule always selects the maximum.\n\nPreemption frees a charger; it does not hand it over. The slot\nstays unavailable until the victim has physically cleared the\naccess edge, and the frozen queue discipline then decides who\ntakes it. The requester is already on its way to a holding cell,\nso it never wai"},{"name":"_select_victim","line":1367,"kind":"function","doc":"The charging robot a requester at this SOC may displace, or None.\n\nThe frozen rule, as one expression: the maximum-SOC charging\nrobot, and only if its SOC is strictly above the requester's.\n``robot_id`` breaks an exact SOC tie and nothing else."},{"name":"_cut_charge","line":1391,"kind":"function","doc":"End one charge session early and send the robot off the charger."},{"name":"_after_preempt","line":1431,"kind":"function","doc":"A preempted robot is clear of the charger: rejoin, or wait.\n\ndocs/DECISIONS.md, \"Preempted Robot\": it rejoins the available\nfleet if it is energy-eligible for work, and otherwise waits in\na dedicated holding cell. \"Energy-eligible for work\" is the\nunchanged CHARGE_NEEDED test, and with no pending work a robot\nis never CHARGE_NEEDED (B2), so it rejoins and parks as usual --\nend-of-work partial charging is G6, in B6.\n\nA robot still at or below the CHARGE_DUE threshold is never fit\nfor work, whatever the pending orders look like: the B2 gate\nwould pull it straight back out of the fleet on the same tick.\nIt waits instead."},{"name":"_wait_in_holding","line":1474,"kind":"function","doc":"A preempted robot with no eligible work waits in a holding cell.\n\nIt takes a holding cell, never the charger it has just given up:\nthat slot is FREE and belongs to the queue discipline now, and\nthe robot that displaced it has a strictly lower SOC. The charge\nrequest itself continues, as a fresh holding trip, so saturation\nfalls back exactly as it does for any other requester."},{"name":"_has_eligible_order","line":1508,"kind":"function","doc":"Is any pending order battery-eligible for this robot?\n\nChecked against every pending order, in FIFO order, stopping at\nthe first eligible one -- never against the allocator's batch\nalone. Scored through the allocator's own shared ``score()``,\nso the route and energy are exactly what allocation would use."},{"name":"_battery_gate","line":1540,"kind":"function","doc":"Take CHARGE_DUE and CHARGE_NEEDED robots out of the pool.\n\nOnly called while pending work exists. With no pending order a\nrobot is never CHARGE_NEEDED; end-of-work recovery is G6."},{"name":"_flag_charge_due","line":1571,"kind":"function","doc":"Raise the due flag on a busy robot the moment SOC \u003c= 10%.\n\nChecked for robots that had an event at this timestamp; their\nSOC only drops in steps at their own moves and services. The\norder carries on regardless."},{"name":"_after_order","line":1594,"kind":"function","doc":"A robot has finished its whole order, retreat included."},{"name":"_check_battery_feasibility","line":1629,"kind":"function","doc":"Re-derive every returned pair's eligibility; refuse any violation.\n\nIndependent of the allocator's own bookkeeping: the energy is\nrecomputed here from the returned route and this executor's SOC."},{"name":"stationary_cells","line":1680,"kind":"function","doc":"Cells held by robots that are standing still.\n\nA robot with no trajectory in flight is not going to move out\nof the way, so it is a wall -- to the static route and to the\nspace-time search alike. Robots that are driving are left out:\ntheir bookings expire, and resolving them is what the traffic\nlayer is for."},{"name":"retry_deferred","line":1703,"kind":"function","doc":"Re-attempt assignments that could not be planned earlier.\n\nOnly assignments whose traffic has moved since they failed are\nretried, and they are retried *together*, as one batch through\nthe fleet planner. The rest keep their pairing and wait:\nre-running the same search against the same occupancy returns\nthe same answer and costs a full horizon to learn it."},{"name":"dispatch","line":1725,"kind":"function","doc":"Offer work to every free robot. Returns how many started."},{"name":"_note_exhausted","line":1744,"kind":"function","doc":"Start end-of-work recovery once no order is pending (B6a).\n\nChecked after the dispatch that allocated the last order, at\nthat same instant. A robot still executing or owing an order\nstarts its recovery when that order retires instead."},{"name":"_close_perf","line":1764,"kind":"function","doc":"Retire the current budget and report it if it was slow."},{"name":"_stage","line":1788,"kind":"function","doc":"Time one stage, when a budget is open."},{"name":"resolve_window","line":1797,"kind":"function","doc":"Width of the candidate window, or None for the legacy rule.\n\nA scientific parameter, so an unrecognised value is an error\nrather than a silent fallback to a default that would change\nevery measured result."},{"name":"_assignable","line":1818,"kind":"function","doc":"Does any (free robot, order) pair in here stand up?\n\nAssignable means reachable and, with a battery, battery-eligible\n-- scored through the allocator's shared ``score()`` so the route\nand energy are exactly what allocation would use. This is a\nfeasibility probe, not a decision: it asks whether a choice\nexists, never which one to take, so the answer is the same for\nevery strategy."},{"name":"_candidate_window","line":1845,"kind":"function","doc":"The orders this allocation decision may choose from.\n\nWidth is the configured window (S0), not the number of free\nrobots: a lone free robot still chooses among the whole window,\nwhich is what gives a strategy anything to decide. The result is\nalways a FIFO prefix of ``pending``.\n\nThe FIFO liveness rule. A strict prefix can hold nothing any\nfree robot can take -- a dear order at the head with the fleet\nlow on charge -- while a feasible order sits just behind it. The\nallocator then returns nothing, recovery parks the robots\nbecause they owe no work, and the run stalls with orders\noutstanding. So when the prefix offers no assignable pair at\nall, the window is extended down the FIFO sequence unt"},{"name":"_quantum_hold","line":1896,"kind":"function","doc":"Should this decision wait for more robots to come free?\n\nThe dispatch quantum (S0b). The candidate window fixes the\n*order* side of a decision; this fixes the *robot* side. Under\ncontinuous dispatch robots come free one at a time -- the\nmeasured median gap on the 100-order workload is 2.0 s -- so\nalmost every decision offers a single robot, and Hungarian and\nMILP reduce to argmin and collapse onto greedy nearest. Holding\na freed robot briefly lets several be allocated together.\n\nThe window is measured from the robot that has been free\nlongest, so a steady trickle of arrivals cannot postpone a\ndecision indefinitely: every robot is dispatched within one\nquantum of becoming free, whatever happe"},{"name":"_arm_quantum","line":1952,"kind":"function","doc":"Ask the engine to tick again when this window closes."},{"name":"_record_candidates","line":1968,"kind":"function","doc":"Write one dataset row per scored (robot, order) pair.\n\nThe candidate set is scored *here*, by the executor, through the\nallocator's shared ``score()`` -- not reported by the strategy.\nA strategy therefore cannot under-report what it was offered,\nand the logged candidate set is identical for every strategy on\nthe same state, which is what makes two strategies comparable at\nall.\n\nEvery row is finalized before any mission is planned and never\nrevisited, so nothing realized can reach it. Only ``selected``\ndepends on the allocator, and a selection is a decision, not an\noutcome.\n\nSee docs/DECISIONS.md, \"Dataset Granularity and Labels\" and\n\"No-Leakage Enforcement\"."},{"name":"_counters","line":2078,"kind":"function","doc":"The robot's cumulative counters now, for WorkAccounting."},{"name":"_record_launch","line":2085,"kind":"function","doc":"Note what one order's outcome row will need from its launch.\n\nPer-order realized cost is the difference of the robot's own\ncumulative counters across the mission. WorkAccounting takes\nthat difference for the run totals (B6a) and hands it to\n_record_outcome, so the outcome rows and the run's productive\ntotals are one calculation, not two. Sound because a robot runs\none order at a time and never charges mid-order, and because\ntravel to a charger or a Stage Zone falls between orders rather\nthan inside one.\n\nSee docs/DECISIONS.md, \"Phase 8 Schema Gaps To Close\"."},{"name":"_record_outcome","line":2117,"kind":"function","doc":"Write one order's realized outcome.\n\n``spent`` is the mission's counter difference, as WorkAccounting\nbooked it to the productive phase."},{"name":"_record_decision","line":2177,"kind":"function","doc":"Record the shape of one allocation decision.\n\n``robots x orders == 1`` is a *forced* decision: there is one\npair and every strategy returns it. Only choice-bearing\ndecisions can distinguish one strategy from another, so they are\ncounted separately and are the denominator the distinctness gate\nuses (docs/DECISIONS.md, \"Strategy Distinctness Gate\")."},{"name":"_dispatch","line":2198,"kind":"function","doc":""},{"name":"_clear_deferred","line":2300,"kind":"function","doc":"This robot no longer owes a deferred plan."},{"name":"_bump_traffic","line":2306,"kind":"function","doc":"Occupancy changed enough to be worth re-planning against."},{"name":"_build_mission","line":2311,"kind":"function","doc":"Build the static mission chosen by the MRTA allocator.\n\nDynamic robot occupancy is deliberately excluded here.\n\nThe static A* layer answers where the mission should travel.\nFleetSimulationEngine and LocalTrafficController decide when\neach cell may actually be entered."},{"name":"launch_batch","line":2335,"kind":"function","doc":"Build and launch one MRTA allocation batch.\n\nThe allocator owns robot-order assignment.\n\nStatic A* builds each MissionPlan. The complete batch is then\nhanded directly to FleetSimulationEngine, where local traffic\narbitration controls execution cell by cell."},{"name":"_send_home","line":2443,"kind":"function","doc":"No work left: park free robots on the nearest free Stage Zone.\n\nThe bank is a shared resource, so the cell is chosen here by\ndirected A* cost and claimed before the mission is handed over.\nTwo robots converging on the same bank therefore cannot pick\nthe same cell, and a robot does not go back to the cell it\nspawned on unless that really is its cheapest free option.\n\nParking routes are static MissionPlans. Dynamic robot\ninteraction is resolved by FleetSimulationEngine and\nLocalTrafficController, exactly like normal order execution."},{"name":"_event","line":2542,"kind":"function","doc":"Watch for the drop-off service that completes an order."},{"name":"_retire","line":2595,"kind":"function","doc":"Retire one finished mission.\n\nFleetSimulationEngine's live ReservationTable already leaves\nthe robot owning the cell where it stopped.\n\nNo trajectory reservations need to be collapsed or rebuilt."},{"name":"snapshot","line":2608,"kind":"function","doc":"Current counts. Pure reporting: changes nothing."},{"name":"_report_progress","line":2649,"kind":"function","doc":"Emit a snapshot every ``progress_interval_s`` simulated seconds."},{"name":"_tick","line":2678,"kind":"function","doc":"After every timestamp: retire finishers, then dispatch."},{"name":"settled_charging","line":2758,"kind":"function","doc":"Robots standing on their reserved charging-workflow terminal."},{"name":"finished","line":2767,"kind":"function","doc":""},{"name":"_recover","line":2784,"kind":"function","doc":"Break a standstill without touching any MRTA pairing.\n\nThe clock has run dry with work still owed. That means every\ndeferred assignment is blocked by a robot standing still, and\nno robot is moving to change that -- the circular wait this\nexecutor used to stall on.\n\nRecovery only ever moves robots that owe nothing:\n\n  1. retry the deferred batch, in case traffic did move\n  2. send idle unassigned robots to their staging cells, which\n     is where they belong at the end anyway and clears the\n     aisles the deferred robots need\n  3. as a last resort, move a robot that is itself deferred out\n     of the lane, so it stops blocking its own neighbours\n\nNo order is re-allocated and no pairing is dr"},{"name":"run","line":2834,"kind":"function","doc":"Execute the whole workload, then bring the fleet home."},{"name":"totals","line":2875,"kind":"function","doc":""},{"name":"phase_totals","line":2889,"kind":"function","doc":"phase -> counter -> run total: order work vs recovery (B6a).\n\nRead only: the open segments are closed on a copy, so this can\nbe called mid-run or more than once."},{"name":"share","line":2936,"kind":"function","doc":""},{"name":"bank_lines","line":3024,"kind":"function","doc":""},{"name":"count","line":3056,"kind":"function","doc":""}],"imports":["contextlib: contextmanager, nullcontext","dataclasses: dataclass, field","fractions: Fraction","time: perf_counter","mrta_core.battery: BatteryDecisionContext, EnergyRequirement, charge_seconds_to_full, travel_energy","mrta_core.order_queue: OrderQueue","mrta_core.orders: OrderStatus","mrta_core.warehouse_map: ZoneType","simulation_env.charging: DESTINATION, LEAVING_CHARGER_STATES, LEAVING_STATES, MOVING_STATES, PREEMPT_RECORD_SOC, SETTLED_STATES, TRAVEL_STATES, WAITING_STATES, ChargeRecord, ChargeState, ChargingSaturationError, ResourceState, TerminalBank","simulation_env.dataset: exact","simulation_env.fleet_engine: EventType, FleetSimulationEngine","simulation_env.grid_robot: GridRobotStatus","simulation_env.stage_parking: StageParking","simulation_env.work_accounting: WorkAccounting, counters_of","task_management.features: DecisionTiming","mrta_core.warehouse_routing: MissionPlan, MissionSegment, RouteCache, nearest_reachable_zone, non_transit_cells, plan_from_cell"],"summary":"Run a whole warehouse workload: FIFO -> allocator -> fleet.\n\nThis is the execution half of the milestone. It owns no allocation\npolicy of its own: it asks ``task_management`` who should take what,\nand then drives the answer through the existing planner, the existing\nreactive local traffic layer and the fleet engine.\n\n    OrderQueue          which orders are eligible   (FIFO, capped at\n                        min(available_robots, pending))\n    BatchAllocationStrategy\n                        which robot takes which of them   (the MRTA\n                        decision, in task_management)\n    plan_from_cell      the static route for the chosen shelf order\n    MapfMissionPlanner  that route as a reservation-safe trajectory\n    FleetSimulationEngine\n                        execution on the one authoritative clock\n\nDispatch is continuous, the way a real fleet works. A robot that\nfinishes does not wait for the other seventeen and does not drive home\nbetween orders: it stays where it stopped, in the aisle, and is offered\nthe next FIFO order on the very next tick. Only when the queue is\nfinally empty does it drive back to its own staging cell.\n\nReservations persist for the whole run. Each new trajectory is planned\nagainst every other robot's live bookings, so a robot dispatched at\nt=93 is routed around the seventeen already in motion."},{"path":"src/simulation_env/test/fixtures/CSV_To_Gazebo_v2.xlsx","size" ne_for, open_floor, straight_plan","test_charger_evacuation: build, low","test_charger_evacuation: config","test_charger_evacuation: warehouse"],"summary":"B4 charging, clearance, reuse and watchdog regressions."},{"path":"src/simulation_env/test/test_b5_queue.py","size":19782,"symbols":[{"name":"trips","line":37,"kind":"function","doc":"Every terminal trip of the run, current and historical, once."},{"name":"test_every_waiting_robot_eventually_reaches_a_charger","line":53,"kind":"function","doc":"The four robots that found no charger do not stay in holding."},{"name":"test_charger_occupancy_never_exceeds_the_bank","line":87,"kind":"function","doc":"Eight chargers, one robot each, at every sampled instant."},{"name":"test_no_robot_ever_holds_two_charger_reservations","line":119,"kind":"function","doc":"One robot, one charger, one holding cell, at every instant."},{"name":"test_no_waiting_robot_is_left_beside_a_free_charger","line":134,"kind":"function","doc":"Liveness: the pair (FREE charger, waiting robot) never survives a tick.\n\nPromotion is one idempotent pass per dispatch, so it fires both when\na charger is released and when a waiting robot arrives in holding.\nThe monitor samples after the executor's dispatch, so this is the\nstate the next instant would start from."},{"name":"test_promotion_happens_in_the_instant_the_charger_frees","line":163,"kind":"function","doc":"Simultaneous release and promotion: no idle gap in between."},{"name":"test_promotion_does_nothing_without_a_waiting_robot","line":184,"kind":"function","doc":"No holding robot: the pass is a no-op and changes no slot."},{"name":"preempting","line":209,"kind":"function","doc":"One charger, one robot on it, one robot that turns CHARGE_DUE later.\n\nrobot_001 is CHARGE_DUE at t=0 and takes the only charger.\nrobot_002 is eligible for the FAR order, crosses 10% while running\nit, and requests at t=56 -- while robot_001 is mid-charge. With the\nfrozen 10% reserve a robot always ends an order above 10% plus its\ncharger leg, so this controlled config sets the reserve to 0 to make\nthe crossing deterministic, exactly as the B2 tests do.\n\n``rate`` sets how much the victim has gained by then: the default\n1%/s leaves it fit for work, and a tenth of that leaves it below the\nCHARGE_DUE threshold, which is the other branch of the frozen\n\"Preempted Robot\" rule."},{"name":"_orders","line":272,"kind":"function","doc":""},{"name":"preempted_rejoins","line":281,"kind":"function","doc":""},{"name":"preempted_waits","line":286,"kind":"function","doc":""},{"name":"test_charge_due_requester_preempts_the_highest_soc_charger","line":290,"kind":"function","doc":""},{"name":"test_a_preempted_session_books_only_the_time_it_charged","line":316,"kind":"function","doc":"SOC bookkeeping: the interval charged, not the one scheduled."},{"name":"test_the_preempted_charger_is_held_for_the_requester","line":336,"kind":"function","doc":"The freed charger goes to the robot it was taken for.\n\nThe victim stands one cell from the charger it gave up with the\nlowest SOC in the bank, so without the promise the queue discipline\nwould hand it straight back and the preemption would achieve\nnothing."},{"name":"test_a_preempted_robot_below_the_threshold_waits_in_holding","line":378,"kind":"function","doc":"Frozen rule: rejoin only if energy-eligible, else holding."},{"name":"test_a_preempted_robot_rejoins_when_it_has_energy_for_work","line":404,"kind":"function","doc":""},{"name":"test_a_lower_soc_charging_robot_is_never_replaced","line":425,"kind":"function","doc":"Only a strictly higher-SOC victim may be displaced.\n\nExercised at the policy seam with the real mid-charge fleet state,\nso the SOCs compared are the executor's own."},{"name":"test_a_charge_needed_robot_never_preempts","line":460,"kind":"function","doc":"Saturation without preemption: only CHARGE_DUE may displace."},{"name":"test_b5_behaviour_is_deterministic","line":484,"kind":"function","doc":""},{"name":"test_a_promised_slot_is_not_on_offer","line":502,"kind":"function","doc":""},{"name":"test_a_slot_cannot_be_promised_twice_or_to_its_own_holder","line":531,"kind":"function","doc":""},{"name":"test_an_uncollectable_promise_is_released","line":555,"kind":"function","doc":"No charger is left standing empty for a robot that cannot come.\n\nEvery promise in these runs is collected, so the invariant to check\nis the end state: nothing outstanding once the run is over."}],"imports":["dataclasses: asdict, replace","fractions: Fraction","pytest","simulation_env.charging: ChargeState, ResourceError, ResourceState, TerminalBank","mrta_core.warehouse_map: ZoneType","test_battery_eligibility: FAR, SHORT, controlled, executor_for","test_charger_evacuation: build, config","test_charger_evacuation: late","test_charger_evacuation: twelve","test_charger_evacuation: warehouse","test_charger_evacuation: TWELVE, run","mrta_core.orders: load_orders_csv"],"summary":"Battery V1 increment B5: queue promotion and charger preemption.\n\nA holding cell is a waiting room, not a destination. When a charger\nbecomes FREE the waiting robots are ordered by lowest SOC, then earliest\ncharge request, then ``robot_id`` purely as an engineering tie-break,\nand the best of them is promoted onto it. When every charger is occupied\nand a CHARGE_DUE robot needs one, the charging robot with the highest\nSOC gives it up -- but only if its SOC is strictly above the\nrequester's, and the charger is then held for that requester until it\ncan physically enter.\n\nFrozen policy: docs/DECISIONS.md, \"Charger Saturation and Preemption\",\n\"Charger Queue Discipline\", \"Preempted Robot\". Nothing here changes\nrouting, traffic, the order schema or the allocator."},{"path":"src/simulation_env/test/test_battery_eligibility.py","size":25764,"symbols":[{"name":"config","line":58,"kind":"function","doc":""},{"name":"warehouse","line":63,"kind":"function","doc":""},{"name":"all_orders","line":68,"kind":"function","doc":""},{"name":"controlled","line":72,"kind":"function","doc":"A test config: fleet size, SOC overrides, reserve. Never shipped."},{"name":"executor_for","line":88,"kind":"function","doc":""},{"name":"requirement_for","line":117,"kind":"function","doc":"Eligibility of one pair, exactly as the executor evaluates it."},{"name":"test_exact_zero_margin_is_eligible_and_executes","line":137,"kind":"function","doc":"A robot holding exactly the required SOC takes the order.\n\nWith nothing else pending afterwards it also shows 11: finishing low\nwith no work left does not make a robot CHARGE_NEEDED."},{"name":"test_negative_margin_is_ineligible","line":175,"kind":"function","doc":"One ten-thousandth of a percent short and the pair is refused."},{"name":"test_closer_but_ineligible_robot_is_skipped","line":206,"kind":"function","doc":""},{"name":"test_charger_distance_is_directed_astar","line":261,"kind":"function","doc":""},{"name":"test_manhattan_cannot_replace_the_charger_route","line":285,"kind":"function","doc":"Between the two estimates, the directed route decides: refused."},{"name":"test_predicted_waiting_is_not_a_term","line":329,"kind":"function","doc":""},{"name":"test_realized_waiting_still_drains_soc","line":354,"kind":"function","doc":""},{"name":"test_busy_robot_crossing_ten_percent_finishes_its_order","line":384,"kind":"function","doc":"SOC falls through 10% mid-order: flag it, finish, then REQUEST.\n\nWith the frozen 10% reserve, eligibility guarantees a robot ends\nevery order above 10% plus its charger leg, so crossing while busy\nneeds realized waiting beyond that margin. To make the crossing\ndeterministic this controlled config sets the reserve to 0."},{"name":"test_charge_needed_scans_all_pending_orders","line":491,"kind":"function","doc":"CHARGE_NEEDED is judged over every pending order, not the batch.\n\nrobot_001 can afford SHORT but not LONG, and LONG sits at the head\nof the queue. It must therefore stay available: an order it can take\nexists, so it is not CHARGE_NEEDED.\n\nRetargeted for S0. This test used to assert that the robot then got\n*nothing* -- ``dispatches == []`` -- because the batch was the FIFO\nhead alone and its only pair was refused. That standstill is the\nstall the FIFO liveness rule removes, so the assertion is now the\nopposite: the window is extended past the unaffordable head and the\nrobot is given the order it can actually run. The B2 behaviour under\ntest, that the CHARGE_NEEDED scan covers all pending orde"},{"name":"test_one_eligible_order_prevents_charge_needed","line":540,"kind":"function","doc":""},{"name":"_MaskBlindAllocator","line":565,"kind":"class","doc":"Scores with battery features but assigns on reachability alone.\n\nIt takes the *dearest* reachable pair, which is the shape a\nmask-unaware allocator fails in: with a wide candidate window\n(S0) the cheapest pair is usually affordable anyway, so a\ncheapest-first blind allocator would accidentally behave itself\nand never exercise the executor's refusal."},{"name":"test_ineligible_assignment_raises","line":607,"kind":"function","doc":""},{"name":"test_repeated_runs_give_identical_eligibility","line":635,"kind":"function","doc":""},{"name":"low_fleet_first_decision","line":679,"kind":"function","doc":"The t=0 decision with every low robot still on its Stage Zone."},{"name":"test_low_fleet_classification","line":694,"kind":"function","doc":""},{"name":"test_low_robot_is_eligible_only_for_short_orders","line":718,"kind":"function","doc":"robot_006 at 14%: some orders fit, the longer ones do not."},{"name":"trace","line":410,"kind":"function","doc":""},{"name":"assign","line":577,"kind":"function","doc":""}],"imports":["dataclasses: asdict, fields, replace","fractions: Fraction","pathlib: Path","pytest","mrta_core.battery: EnergyRequirement, energy_requirement, service_energy, travel_energy","mrta_core.order_queue: OrderQueue","mrta_core.orders: OrderStatus, load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: best_path_to_zone, non_transit_cells","simulation_env.charging: ResourceState","simulation_env.fleet: build_fleet","simulation_env.workload_executor: IneligibleAssignmentError, WorkloadExecutor","task_management.allocation_strategy: NearestAStarAllocator, get_batch_strategy","task_management.features: order_route_cost, route_energy","task_management.allocation_strategy: OrderAssignment"],"summary":"Battery V1 increment B2: eligibility, CHARGE_DUE and CHARGE_NEEDED.\n\nEligibility is a hard feasibility mask on every robot-order pair:\n\n    required = travel(order route) + service + travel(to nearest charger)\n               + reserve\n    eligible = SOC >= required\n\ncomputed from decision-time information only, with the production\ndirected A* router. CHARGE_DUE is SOC \u003c= 10%; CHARGE_NEEDED is SOC above\nthat but no eligible order among ALL pending orders. Either takes a\nrobot into REQUEST; since B3 that sends it to a reserved charger or\nholding cell (tests/test_charger_evacuation.py).\n\nControlled SOCs come from ``battery.initial_soc_overrides``."},{"path":"src/simulation_env/test/test_battery_ledger.py","size":23227,"symbols":[{"name":"config","line":49,"kind":"function","doc":""},{"name":"warehouse","line":54,"kind":"function","doc":""},{"name":"open_floor","line":58,"kind":"function","doc":"Bare floor with no stations. Missions below are hand-built."},{"name":"straight_plan","line":73,"kind":"function","doc":"A one-leg mission along ``path``, ending on no station."},{"name":"engine_for","line":98,"kind":"function","doc":""},{"name":"run_workload","line":111,"kind":"function","doc":""},{"name":"workload","line":133,"kind":"function","doc":"One 100-order run with battery accounting on, shared."},{"name":"test_twenty_metres_of_travel_is_exactly_one_percent","line":144,"kind":"function","doc":"Twenty one-cell moves, nothing else: SOC 100 -> 99 exactly."},{"name":"test_sixty_seconds_of_service_is_exactly_one_percent","line":165,"kind":"function","doc":"Two 60 s services on a real pick-and-drop mission: exactly 2%."},{"name":"test_three_hundred_seconds_of_waiting_is_exactly_one_percent","line":189,"kind":"function","doc":""},{"name":"test_three_hundred_seconds_of_idle_is_exactly_one_percent","line":203,"kind":"function","doc":""},{"name":"test_a_robot_that_never_moves_is_idle_for_the_whole_run","line":215,"kind":"function","doc":"Idle is the engine clock's remainder, not a counter of its own."},{"name":"test_combined_accounting_matches_hand_calculation","line":244,"kind":"function","doc":"Staging -> shelf_001 -> dropoff_001, then 150 s standing still.\n\nOne robot, so it never waits; it moves or serves continuously, so\nuntil the mission ends it is never idle either:\n\n    T   = D * 2/3 s + 2 s pick + 2 s drop\n    SOC = 100 - D/20 - 4/60                 at T\n    SOC = 100 - D/20 - 4/60 - 150/300       at T + 150 s"},{"name":"test_service_and_waiting_match_the_engine_counters","line":286,"kind":"function","doc":"Across a real run, every category agrees with GridRobot's own."},{"name":"test_yield_and_rejoin_moves_are_booked_as_travel","line":309,"kind":"function","doc":"Drive the engine's real yield -> wait -> rejoin sequence.\n\nThe production map cannot produce this any more -- its core is\none-way, so no two robots are ever planned head-on -- but the\nengine still carries the code. Two robots are sent head-on across\nopen floor. robot_002 is on a parking run, so the busy robot_001\nhas right of way both at the conflict and when the corridor\nreopens. Only the choice of side bay is fixed here; everything else\nis the engine's own path."},{"name":"test_final_soc_identity_holds_for_every_robot","line":378,"kind":"function","doc":""},{"name":"test_repeated_runs_give_identical_soc","line":411,"kind":"function","doc":""},{"name":"test_initial_soc_override","line":425,"kind":"function","doc":""},{"name":"test_override_for_a_robot_outsid ast sample of each simulated instant, in time order.\n\nOne instant can take several engine batches (a robot reaches its\ncell on MOVE_COMPLETE; its MISSION_COMPLETE follows at +0 s)."}],"imports":["dataclasses: asdict, replace","fractions: Fraction","pathlib: Path","pytest","mrta_core.order_queue: OrderQueue","mrta_core.orders: OrderStatus, load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: best_path_to_zone, directional_blocked_edges, non_transit_cells","simulation_env.charging: SETTLED_STATES, TRAVEL_STATES, ChargeState, ResourceError, ResourceState, TerminalBank","simulation_env.fleet: build_fleet","simulation_env.grid_robot: GridRobotStatus","simulation_env.workload_executor: WorkloadExecutor","task_management.allocation_strategy: get_batch_strategy"],"summary":"Battery V1 increment B3: REQUEST robots leave the transit network.\n\nOn entering REQUEST a robot reserves, before it moves,\n\n    1. the FREE charger with the cheapest directed A* route, else\n    2. the FREE holding cell with the cheapest directed A* route, else\n    3. (saturation) the nearest free Stage Zone,\n\nand drives there by the production router. B4 charges to full, then\nphysically clears the charger and rejoins. B5 promotes a waiting robot\nout of holding the instant a charger frees, lowest SOC first. Controlled\nSOCs come from ``battery.initial_soc_overrides`` only."},{"path":"src/simulation_env/test/test_charging_bank.py","size":4841,"symbols":[{"name":"warehouse","line":43,"kind":"function","doc":""},{"name":"terminals","line":48,"kind":"function","doc":""},{"name":"cells_of","line":52,"kind":"function","doc":""},{"name":"zone_at","line":56,"kind":"function","doc":""},{"name":"leg","line":60,"kind":"function","doc":"One mission leg, planned exactly as the executor plans it."},{"name":"test_bank_is_one_cell_deep","line":75,"kind":"function","doc":"8 chargers and 14 line":122,"kind":"function","doc":"An instrumented run and a bare run are the same run.\n\nRecording scores the candidate set a second time, through the same\nshared ``score()`` and the same RouteCache. If that second pass\ncould perturb anything -- a cache, a reservation, the clock -- the\ndataset would describe a different system than the baseline does."},{"name":"test_decision_rows_are_identical_when_the_run_is_truncated","line":151,"kind":"function","doc":"The truncation test: stop after the first dispatch and compare.\n\nThis is the leakage proof. If any decision field were populated\nfrom post-decision state -- realized waiting, actual energy, a\ncompletion time -- then the run that stopped immediately and the run\nthat carried on would disagree about decision 0. They cannot\ndisagree if the row was finalized before execution."},{"name":"test_decision_rows_are_identical_when_truncated_mid_run","line":184,"kind":"function","doc":"The same proof part-way through, with the fleet in motion.\n\nDecision 0 happens with every robot parked and idle. A mid-run\ndecision happens while robots are moving, waiting and servicing,\nwhich is where a leaked realized value would actually come from."},{"name":"test_no_realized_column_appears_in_the_decision_table","line":222,"kind":"function","doc":"The decision schema may not name an outcome, by construction."},{"name":"test_every_selected_pair_has_exactly_one_outcome","line":251,"kind":"function","doc":""},{"name":"test_unselected_candidates_are_kept_as_negative_examples","line":275,"kind":"function","doc":"ILP needs the pairs that were available and not taken."},{"name":"test_a_deferral_is_recorded_as_a_decision","line":294,"kind":"function","doc":"A decision where nothing was assignable is still a decision.\n\nDropping it would bias the dataset towards decisions that happened\nto succeed, which is exactly the kind of selection effect that\ninvalidates a learned rule."},{"name":"test_predicted_and_realized_cover_the_same_route","line":318,"kind":"function","doc":"C_static includes the post-drop-off retreat, so realized must too.\n\nThe outcome row is written at retirement, after the retreat is\ndriven, not at the drop-off service. Written at the drop-off, every\norder would read one cell short of its prediction and every\npredicted-vs-realized comparison would carry a constant bias.\n\nEquality here is also an independent check that the router's\nprediction and the executor's realization agree cell for cell, which\nis what makes the comparison meaningful at all."},{"name":"test_realized_values_are_never_negative_and_exclude_other_orders","line":338,"kind":"function","doc":"Counter differencing must attribute to one order, not to a robot."},{"name":"test_completion_time_is_the_drop_off_not_the_retreat","line":361,"kind":"function","doc":"An order is fulfilled when it is dropped off."},{"name":"test_exact_columns_round_trip_through_fraction","line":379,"kind":"function","doc":"float64 is for plotting; the exact string is for reproducing."},{"name":"test_exact_handles_none","line":401,"kind":"function","doc":""},{"name":"test_the_manifest_identifies_the_run","line":405,"kind":"function","doc":""},{"name":"test_the_run_id_changes_when_an_input_changes","line":424,"kind":"function","doc":""},{"name":"test_the_dataset_writes_and_reads_back","line":446,"kind":"function","doc":""},{"name":"exported","line":489,"kind":"function","doc":"One recorded 12-order run, written and exported once."},{"name":"test_csv_carries_every_row_and_column","line":511,"kind":"function","doc":""},{"name":"test_the_export_derives_nothing","line":532,"kind":"function","doc":"Every exported value is a value that was recorded."},{"name":"test_prolog_examples_are_the_selected_pair_against_the_rest","line":548,"kind":"function","doc":""},{"name":"test_every_prolog_example_names_a_declared_candidate","line":566,"kind":"function","doc":"An example whose terms have no facts is unusable to a learner."},{"name":"test_prolog_keeps_counts_as_integers","line":589,"kind":"function","doc":"A count compared as a float reads as though it were measured."},{"name":"test_prolog_asserts_nothing_about_an_identifier","line":614,"kind":"function","doc":"Identifiers are traceability, never a scientific predicate.\n\nNo fact may order robots, expose the numeric part of a robot_id, or\notherwise let a learner key on identity instead of on state."},{"name":"test_a_soc_fact_is_stated_once_per_robot_per_decision","line":648,"kind":"function","doc":"Not once per pair: SOC is a property of the robot at t."},{"name":"test_the_csv_fallback_loses_nothing","line":671,"kind":"function","doc":"A finished run must survive a missing pyarrow.\n\nThe live ROS node runs on the system interpreter, not the pixi\nenvironment, so pyarrow cannot be assumed there. Crashing after a\ncomplete run would throw the whole run away over an optional\ndependency."},{"name":"test_the_exact_columns_survive_the_csv_fallback","line":717,"kind":"function","doc":"The whole point of the exact string is that text cannot lose it."},{"name":"Stop","line":161,"kind":"class","doc":""},{"name":"abort","line":164,"kind":"function","doc":""},{"name":"Stop","line":192,"kind":"class","doc":""},{"name":"abort","line":197,"kind":"function","doc":""},{"name":"run_id","line":425,"kind":"function","doc":""},{"name":"last_argument","line":596,"kind":"function","doc":""},{"name":"no_pyarrow","line":693,"kind":"function","doc":""}],"imports":["pathlib: Path","pytest","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv, select_orders","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.dataset: DECISIONS_FILE, MANIFEST_FILE, OUTCOMES_FILE, SCHEMA_VERSION, RunRecorder, build_manifest, exact","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor","task_management.allocation_strategy: get_batch_strategy","simulation_env.
