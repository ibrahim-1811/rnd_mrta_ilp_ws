function pageQuestions(){return head(10,'The question is larger than a simulator.','The documented goal is effective, inspectable symbolic allocation using geometry and realized outcomes. Numbered questions and hypotheses below are proposed formulations, awaiting researcher approval.')+note('PROPOSED RQ/H formulations. The authoritative contract defines objectives and phase order, but does not freeze this numbered six-question set or outcome-aware labels. No experimental support for these hypotheses is claimed.','warn')+`<div class="card"><div class="eyebrow">DOCUMENTED UMBRELLA QUESTION</div><h2>Can real warehouse geometry and realized outcomes support allocation rules that are effective and explainable?</h2><p>The simulator is the controlled apparatus. The scientific contribution is the learned allocation policy and a defensible evaluation of its behavior.</p>${source('README.md',3)}<br>${source('docs/ROADMAP.md',456)}</div><div class="card spacer">${researchQs.map((q,i)=>`<details ${i===0?'open':''}><summary>RQ${i+1} · ${q[0]} ${tag('Proposed','blue')}</summary><dl class="detail-grid spacer">${[['Motivation',q[0]],['Hypothesis (proposed)',q[1]],['Independent variables',q[2]],['Dependent variables',q[3]],['Baselines',q[4]],['Method / tests',q[5]],['Required data',q[6]],['Interpretation',q[7]],['Validity threats',q[8]]].map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl></details>`).join('')}</div>`+card('Historical presentations are prior work',`<p>The ICAPS talk and older ILP paper describe another workspace and different motion, energy and release assumptions. Their learned rules and results are not reproduced by this repository. They are not evidence of a current warehouse ILP implementation.</p>${source('docs/papers/ICAPS 26 PlanRob Presentation/planrob26_talk.tex',68)}<br>${source('README.md',354)}`,'spacer')}
function pageILP(){let t=D.pilot.w100_teacher_dataset;return head(11,'Learning logic, one verified step at a time.','Inductive Logic Programming searches for symbolic clauses that explain examples under background knowledge and an explicit hypothesis bias. In this project, that policy would choose robot–order assignments.')+`<div class="grid cols3">${card('Implemented data foundation',`<p>Candidate and outcome tables, exact-value companions, teacher labels and raw Prolog export exist.</p>${tag('Source inspected','green')}<p class="spacer"><strong>8,566</strong> decision rows / <strong>300</strong> outcomes in the recorded W100 teacher run.</p>${source('src/simulation_env/simulation_env/dataset_export.py',66)}`)}${card('Verified toy learning environment',`<p>Popper v4.4.0 (commit <code>860cd0de</code>), SWI-Prolog 10.0.0, Clingo 5.8.2, Janus-SWI 1.5.3; setuptools capped below 81.</p>${tag('Recorded smoke test','amber')}<p class="spacer">Toy rules learned: grandparent via two parents; assign via a supplied nearest predicate. One problem per process.</p>${source('docs/CURRENT_PHASE.md',2250)}`)}${card('Warehouse learning remains open',`<p>No learner-side numeric predicate adapter, <code>bias.pl</code>, deployed learned allocator, outcome supervision or explanation engine exists.</p>${tag('Not implemented','blue')}<p class="spacer">Next: reproduce a simple teacher rule before expanding to Single-Teacher, Multi-Teacher and Outcome-Aware.</p>${source('docs/ROADMAP.md',456)}`)}</div>`+flow('Planned warehouse ILP pipeline',['decision dataset','learner predicates','pos / neg + BK','bias.pl','Popper','learned rules','policy execution','new outcomes'],[1,3,5,6])+`<div class="grid cols2 spacer">${card('Actual exported facts and teacher examples',`<p>These are copied from the recorded W100 export. Raw floats and identifier terms are traceability data; choose meaningful learner representations before training.</p><pre>${esc((Array.isArray(t.prolog_facts)?t.prolog_facts.join('\n'):t.prolog_facts)||'')}</pre><pre>${esc((Array.isArray(t.prolog_examples)?t.prolog_examples.join('\n'):t.prolog_examples)||'')}</pre>${source('runs/learn_astar_30r_300o/bk.pl')}<br>${source('runs/learn_astar_30r_300o/exs.pl')}<details><summary>Inspect actual candidate and observed outcome</summary><pre>${esc(JSON.stringify({candidate:t.candidate_examples[0],outcome:t.outcome_example},null,2))}</pre><p>Completed_at marks dropoff; retreat_finished_at marks the mission ledger end. Components include retreat, so realized_duration_s is not their sum. Unselected alternatives have no observed outcome.</p></details>`)}${card('The vocabulary of learning',`<dl class="detail-grid">${[['Fact','A ground assertion exported from one decision state.'],['Background knowledge','Facts and permitted relations available to a learner.'],['Positive','A selected eligible pair for teacher imitation.'],['Negative','An eligible but unselected pair; not a bad realized outcome.'],['Bias','Target arity, allowed body predicates, types, directions, recursion and complexity bounds.'],['Hypothesis','A candidate set of clauses permitted by that bias.'],['Coverage','Which examples a learned hypothesis entails.'],['Policy execution','Turn rule results into legal one-to-one assignments with documented fallback and ties.']].map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl>${source('docs/DECISIONS.md',1411)}`)}</div>`+`<div class="grid cols3 spacer">${card('Single-Teacher',`<p>One teacher’s decision states and selections → symbolic representation → examples and bias → learned imitation policy.</p><div class="formula">State + teacher choice<br>→ symbolic rule</div><p>First research target: fidelity, coverage and complexity on held-out seeds.</p>${tag('Planned','blue')}`)}${card('Multi-Teacher',`<p>Several teachers → context-aware examples → explicit conflict treatment → common or teacher-conditioned rules.</p><div class="formula">Teacher A / B / C<br>→ conflict protocol → rules</div><p>Data mixing and label conflict resolution are not implemented or frozen.</p>${tag('Planned','blue')}`)}${card('Outcome-Aware',`<p>Selected pairs + observed outcomes → frozen valid labels, weights or selection → learned policy → new executions.</p><div class="formula">Observed outcome<br>→ supervision → rules</div><p>Outcomes of unselected assignments are unobserved. Do not invent counterfactual costs.</p>${tag('Not implemented','blue')}`)}</div>`+note('Leakage boundary: a decision record is constructed before mission launch and never revised with future data. Outcomes may supervise later training, but actual future waiting, completion, energy and congestion cannot be predicates of the current live decision. Identifiers are not scientific priorities.')}
function pageRules(){return head(12,'Read a rule. Inspect its reasons.','A small browser-side predicate walkthrough illustrates symbolic explanation. It does not run Popper or Prolog, and the illustrative rule is not a learned warehouse policy.')+`<div class="card"><div class="card-top"><h3>Illustrative assignment clause</h3>${tag('Proposed predicates / illustrative rule','amber')}</div><div class="row"><button class="rule-token head" data-rule-token="head">assign(D,R,O)</button><span class="mono">:-</span><button class="rule-token" data-rule-token="eligible">eligible(D,R,O)</button><span>,</span><button class="rule-token" data-rule-token="nearest">nearest(D,R,O)</button><span>.</span></div><p class="spacer">D = decision context, R = robot, O = order. The head names the suggested assignment. Both body conditions must hold. The exported raw data does not already define these illustrative learner-side predicates.</p><div class="row"><label class="inline"><input id="rule-eligible" type="checkbox" checked>eligible(d1,r2,o4)</label><label class="inline"><input id="rule-nearest" type="checkbox" checked>nearest(d1,r2,o4)</label><button id="rule-evaluate" class="primary">Evaluate conditions</button></div><div id="rule-explanation" class="notice" aria-live="polite"></div></div>`+`<div class="grid cols2 spacer">${card('What this clause would mean',`<p>“For this decision, suggest the robot–order pair if it passes the energy/routing mask and satisfies the supplied nearest relation.”</p><p>A true body does not by itself enforce global one-to-one matching, coverage for every state, tie handling or fallback. A production policy adapter would still need those checks.</p><div id="rule-token-detail" class="notice">Select the head or a body predicate above to inspect its role.</div>`)}${card('Inspect a future actual learned rule',`<p>Choose a local <code>.pl</code> or <code>.txt</code> file to display it safely. It is shown as text, not executed, and its provenance is user-supplied.</ function pageMethodology(){return head(13,'A fair comparison is a designed experiment.','Frozen study settings, explicit failure accounting and paired workload seeds make policy differences interpretable. The main study remains to be run.')+`<div class="grid cols4">${kpi('Conventional matrix','1,200','runs / quantum','8 policies × 5 fleets × 30 seeds','methodology')}${kpi('Future 11-policy matrix','1,650','runs / quantum','Including three future learned policies','methodology')}${kpi('Workload size','2,000','logical orders','Each seed selects one shared workload','methodology')}${kpi('Paired seeds','1–30','','Same workload per strategy / fleet / seed','methodology')}</div>`+flow('Frozen W100 experiment matrix',['8 conventional policies','fleets 10 / 30 / 50 / 70 / 100','seeds 1…30','q0 primary / q3 controlled','separate comparable datasets'])+`<div class="grid cols2 spacer">${card('Controls and outcomes',`<dl class="detail-grid"><dt>Independent</dt><dd>Allocation policy; fleet size; separate dispatch-quantum condition.</dd><dt>Blocking</dt><dd>Workload seed; paired strategies receive the same order file.</dd><dt>Controls</dt><dd>Map, lane graph, traffic, speed 1.5 m/s, service 1 s per visited shelf / dropoff, initial SOC 100%, Battery V1.</dd><dt>Headline</dt><dd><code>order_makespan_s</code>, <code>order_throughput_per_h</code>.</dd><dt>Operational</dt><dd>Productive / support / recovery distance, waiting and energy; full fleet totals; charging and CPU timings.</dd><dt>Legacy</dt><dd><code>makespan_s</code> = fleet settled time. It includes recovery; never label it order makespan.</dd></dl>${source('docs/EXPERIMENT_PROTOCOL.md',81)}`)}${card('Paired estimation',`<div class="formula">Δ<sub>s</sub> = metric(policy,s) − metric(A*,s)<br>95% CI = mean(Δ) ± t<sub>.975,n−1</sub> SD(Δ) / √n</div><p>The implementation uses SciPy Student t quantiles. One pair has no estimable uncertainty. No multiplicity correction or rank test is implemented; min–max bars in plot_experiment g>, traffic scripts 8/8. This task did not rerun simulations or the Python suite. It ran lightweight CLI inspections, graph extraction, focused code-map lint and dedicated HTML/browser checks.</p>${tag('Recorded source tests','amber')} ${tag('Fresh HTML QA','green')}<p class="spacer">Older roadmap “slice 2 not started” and V2-current statements are stale. Current source and latest dated status take precedence.</p>${source('docs/CURRENT_PHASE.md',2228)}`,'spacer')}</div></div>`}

function setupPan(id,w,h){const svg=$('#'+id);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);let state=panStates[id]||{w,h,x:0,y:0,scale:1};Object.assign(state,{w,h});panStates[id]=state;function update(){const group=$('.pan-content',svg);if(group)group.setAttribute('transform',`translate(${state.x} ${state.y}) scale(${state.scale})`)}state.update=update;state.reset=()=>{state.x=0;state.y=0;state.scale=1;update()};state.zoom=(factor)=>{let ns=Math.max(.35,Math.min(5,state.scale*factor));let r=ns/state.scale;state.x=w/2-(w/2-state.x)*r;state.y=h/2-(h/2-state.y)*r;state.scale=ns;update()};if(!svg.dataset.pan){svg.dataset.pan='true';let drag=null;svg.addEventListener('pointerdown',ev=>{if(ev.target.closest('[data-component],[data-mind],[data-mind-toggle],.cell'))return;drag={sx:ev.clientX,sy:ev.clientY,x:state.x,y:state.y};svg.setPointerCapture(ev.pointerId)});svg.addEventListener('pointermove',ev=>{if(!drag)return;const rect=svg.getBoundingClientRect();state.x=drag.x+(ev.clientX-drag.sx)*w/rect.width;state.y=drag.y+(ev.clientY-drag.sy)*h/rect.height;update()});for(const type of ['pointerup','pointercancel'])svg.addEventListener(type,()=>drag=null);svg.addEventListener('wheel',ev=>{ev.preventDefault();state.zoom(ev.deltaY>0?.9:1.1)},{passive:false})}update()}

function parseCSV(raw){let text=raw.replace(/^\uFEFF/,''),rows=[],row=[],field='',quoted=false,closed=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else{quoted=false;closed=true}}else field+=c}else if(c==='"'){if(field!==''||closed)throw Error('Unexpected quote in CSV');quoted=true}else if(c===','){row.push(field);field='';closed=false}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x!==''))rows.push(row);row=[];field='';closed=false}else{if(closed&&!/\s/.test(c))throw Error('Characters after closing CSV quote');if(!closed)field+=c}}if(quoted)throw Error('Unclosed CSV quote');if(field!==''||row.length){row.push(field);if(row.some(x=>x!==''))rows.push(row)}if(!rows.length)throw Error('CSV is empty');const headers=rows.shift().map(h=>h.trim());if(new Set(headers).size!==headers.length||headers.some(h=>!h||['__proto__','constructor','prototype'].includes(h)))throw Error('Duplicate, empty or unsafe CSV headers');return rows.map((r,i)=>{if(r.length!==headers.length)throw Error(`CSV row ${i+2} has ${r.length} fields; expected ${headers.length}`);const obj=Object.create(null);headers.forEach((k,j)=>obj[k]=r[j]);return obj})}
