ols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/CMakeLists.txt","size":1230,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/README.md","size":2590,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/package.xml","size":697,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/src/frame_parser.cpp","size":5634,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/src/frame_parser.hpp","size":1528,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/src/gazebo_fleet_pose_transport.cpp","size":11986,"symbols":[],"imports":[]},{"path":"src/gazebo_fleet_pose_transport/test/test_frame_parser.cpp","size":2866,"symbols":[],"imports":[]},{"path":"src/mrta_core/mrta_core/__init__.py","size":808,"symbols":[],"imports":["grid: GridMap, PathFeatures, PathResult, astar_path, extract_path_features","kinematics: RobotModel, path_energy_percent, path_energy_wh, path_time","models: RobotState, RobotStatus, TaskState","symbolic: PredicateThresholds, as_prolog_facts, robot_task_predicates","world: WorldGrid, load_ascii_obstacles, world_grid_from_ascii"],"summary":""},{"path":"src/mrta_core/mrta_core/battery.py","size":11714,"symbols":[{"name":"exact","line":40,"kind":"function","doc":"A config or clock number as an exact rational.\n\nFractions pass through untouched. Ints and floats are read the way\nthe engine reads configured durations, so a YAML ``12.3`` becomes\n123/10 rather than the nearest binary float."},{"name":"BatteryConfig","line":58,"kind":"class","doc":"The ``battery:`` section of the simulation config."},{"name":"travel_energy","line":156,"kind":"function","doc":"SOC percent spent driving ``distance_m``."},{"name":"service_energy","line":162,"kind":"function","doc":"SOC percent spent on ``seconds`` of pick or drop service."},{"name":"stationary_energy","line":168,"kind":"function","doc":"SOC percent spent standing still, waiting or idle, for ``seconds``."},{"name":"charge_energy","line":187,"kind":"function","doc":"SOC percent gained by charging for ``seconds``. Positive."},{"name":"charge_seconds_to_full","line":193,"kind":"function","doc":"Simulated seconds to take ``current_soc`` to exactly 100%.\n\nExact rational arithmetic, so the duration lands on the target\nrather than near it:\n\n    duration = (100 - SOC) / charging_percent_per_second\n\nA robot already at or above 100% needs no time at all."},{"name":"EnergyRequirement","line":230,"kind":"class","doc":"Decision-time battery features of one robot-order pair.\n\nEverything here is known at the instant of the decision. Nothing is\na realized outcome of executing the order."},{"name":"energy_requirement","line":252,"kind":"function","doc":"The eligibility equation, evaluated exactly."},{"name":"BatteryDecisionContext","line":288,"kind":"class","doc":"What an allocator may know about batteries at one decision.\n\nBuilt by the executor for one decision instant and handed to the\nstrategy. ``soc`` is each offered robot's SOC at that instant.\n``nearest_charger(cell)`` returns ``(charger_id, distance_m)`` of the\ncharger with the cheapest directed-A* route from ``cell``.\n\nEvery strategy computes eligibility through ``requirement()``, so\nall of them obey the same battery feasibility contract. The counters\nrecord how many robot-order pairs were evaluated and how many of\nthose were ineligible, for reporting only."},{"name":"__post_init__","line":74,"kind":"function","doc":""},{"name":"initial_soc_for","line":100,"kind":"function","doc":""},{"name":"from_mapping","line":107,"kind":"function","doc":"Parse the YAML section. Unknown keys are refused.\n\nA misspelt key would otherwise silently fall back to its\ndefault, and the run would drain at a rate nobody asked for."},{"name":"requirement","line":311,"kind":"function","doc":"Eligibility of one robot for one planned order route.\n\n``order_distance_m`` is the whole static route: robot cell,\nevery shelf in the chosen order, the dropoff, and the retreat\nout of it. ``end_cell`` is that post-dropoff retreat cell, the\naisle cell the charger leg starts from -- never the inside of\nthe dropoff."}],"imports":["collections.abc: Callable","dataclasses: dataclass, field","fractions: Fraction"],"summary":"Battery V1: a normalized, deterministic state-of-charge model.\n\nFixed infrastructure, identical for every MRTA strategy. This is not a\nhardware-calibrated electrical model. SOC is a percentage drained by\nthree things and nothing else:\n\n    travel             travel_percent_per_20m          per 20 m driven\n    known service      service_percent_per_60s         per 60 s of pick or drop\n    waiting and idle   waiting_idle_percent_per_300s   per 300 s standing still\n\nIt is raised only by charging (``charging_percent_per_second``), which\nis the NET gain while a robot is physically on a charger: the idle drain\nis not also subtracted over that interval (B4).\n\nThe arithmetic is exact. Distances and durations arrive as the same\n``Fraction`` values the fleet engine's clock uses, so an energy total is\na rational number with no rounding drift, and a threshold such as\nSOC \u003c= 10 can later be decided exactly. Floats appear only in reports.\n\nThis module is pure: no robot state, no clock. The execution ledger\n(``simulation_env.battery_ledger``) books energy with these functions,\nand the allocator's decision-time estimate will use the same ones, so\nthe energy a strategy predicts and the energy a robot is charged cannot\ndrift apart."},{"path":"src/mrta_core/mrta_core/grid.py","size":4862,"symbols":[{"name":"GridMap","line":13,"kind":"class","doc":""},{"name":"PathResult","line":53,"kind":"class","doc":""},{"name":"PathFeatures","line":62,"kind":"class","doc":""},{"name":"manhattan_distance","line":70,"kind":"function","doc":""},{"name":"astar_path","line":74,"kind":"function","doc":""},{"name":"reconstruct_path","line":138,"kind":"function","doc":""},{"name":"extract_path_features","line":159,"kind":"function","doc":""},{"name":"in_bounds","line":25,"kind":"function","doc":""},{"name":"is_free","line":29,"kind":"function","doc":""},{"name":"neighbors","line":32,"kind":"function","doc":""},{"name":"congestion_at","line":48,"kind":"function","doc":""}],"imports":["dataclasses: dataclass, field","heapq: heappop, heappush","math: inf","typing: TypeAlias","mrta_core.models: RobotState, TaskState"],"summary":""},{"path":"src/mrta_core/mrta_core/kinematics.py","size":4442,"symbols":[{"name":"RobotModel","line":32,"kind":"class","doc":""},{"name":"_runs_and_turns","line":76,"kind":"function","doc":"Split a cell path into straight-run cell-counts and count 90 degree turns."},{"name":"path_time","line":100,"kind":"function","doc":""},{"name":"path_energy_j","line":107,"kind":"function","doc":""},{"name":"path_energy_wh","line":114,"kind":"function","doc":""},{"name":"path_energy_percent","line":118,"kind":"function","doc":""},{"name":"straight_time","line":47,"kind":"function","doc":"Trapezoidal-profile time to drive a straight run of ``length`` metres."},{"name":"turn_time","line":60,"kind":"function","doc":""},{"name":"straight_energy_j","line":63,"kind":"function","doc":""},{"name":"turn_energy_j","line":71,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","math: pi, sqrt","mrta_core.grid: Cell"],"summary":"Physics-based robot motion and energy model.\n\nShared single source of truth for travel time and energy so the simulator drains\nthe *same* battery the allocators estimate. A grid path is a sequence of cells; the\nrobot drives straight runs joined by in-place 90 degree turns (4-connected grid).\n\nPer straight run of length L (start and end at rest):\n  * time  : trapezoidal velocity profile with (v_max, a_max)\n  * energy: rolling-resistance work over L, plus idle electronics power over the run\n            time, divided by drivetrain efficiency.\nPer turn:\n  * time  : (pi/2) / omega_max\n  * energy: turn power (+ idle) over the turn time.\n\nEnergies are in joules internally, exposed in watt-hours and as a percentage of\nbattery capacity, so the simulator can keep working in battery-percent.\n\nDefaults model a warehouse AMR (robot + payload), calibrated so a typical task\ndrains a few percent -- battery stays a meaningful, discriminating feature (the\nold system's flat-per-metre model made it nearly constant)."},{"path":"src/mrta_core/mrta_core/map_builder.py","size":15699,"symbols":[{"name":"Layout","line":99,"kind":"class","doc":"A warehouse as plain cells, ready to be written to Excel.\n\n``kinds`` maps every cell to what it is; a cell missing from it is a\nwall. ``arrows`` maps floor cells to the grid steps a robot may\nleave them by."},{"name":"blank_layout","line":127,"kind":"function","doc":"An empty hall: a wall all the way round, floor inside.\n\nNothing is drawn. It is the sheet to start a hand-drawn map from."},{"name":"example_layout","line":145,"kind":"function","doc":"A complete, valid warehouse sized for a fleet of ``robots``.\n\nThe plan, with y running up the page::\n\n    top edge      chargers and holding cells\n    ring road     one-way, anticlockwise, just inside the edge\n    middle        racking units  [up-aisle | shelves | down-aisle]\n                  cut by one or more cross-bands of two rows\n    bottom edge   drop-offs\n    side edges    parking, enough for the whole fleet\n\nWhy it is always valid, without trial and error: the ring road is a\nsingle one-way loop, every aisle and every cross-band row is\none-way from the ring back to the ring, and every station touches\nthe ring or an aisle. So every road cell can reach the ring and be\nreached from it -"},{"name":"layout_of","line":269,"kind":"function","doc":"A loaded map as a Layout, with its effective lanes drawn in.\n\nThe arrows are read from the live routing policy -- whatever the\nmap is actually routed by, built-in or drawn -- so writing the\nresult to Excel produces a self-describing copy of the same map."},{"name":"_excel","line":327,"kind":"function","doc":"Grid cell -> (spreadsheet row, column), y labels running upward."},{"name":"write_layout_xlsx","line":335,"kind":"function","doc":"Write a Layout as a workbook ``load_warehouse_xlsx`` reads back.\n\nThe map is the first, active sheet, framed in orange with X labels\n1..width along the top and bottom and Y labels height..1 down both\nsides, the same frame the V2 workbook uses. A second sheet explains\nthe symbols to whoever edits it."},{"name":"_column_letter","line":422,"kind":"function","doc":""},{"name":"_write_legend","line":428,"kind":"function","doc":""},{"name":"kind","line":112,"kind":"function","doc":""},{"name":"count","line":115,"kind":"function","doc":""},{"name":"lane","line":118,"kind":"function","doc":""},{"name":"solid","line":347,"kind":"function","doc":""}],"imports":["__future__: annotations","dataclasses: dataclass, field","math: ceil","pathlib: Path","mrta_core.grid: Cell","mrta_core.warehouse_map: WarehouseMap, ZoneType","mrta_core.warehouse_map_xlsx: ORANGE_RGB, RED_RGB","mrta_core.warehouse_routing: directional_blocked_edges, non_transit_cells","openpyxl: Workbook","openpyxl.styles: Alignment, Font, PatternFill","openpyxl.utils: get_column_letter","openpyxl.styles: Font, PatternFill"],"summary":"Build, export and write warehouse maps in the Excel format.\n\nThe Excel workbook is the source of truth for a map (see\n``warehouse_map_xlsx``). This module is the other direction: it makes\nworkbooks, so nobody has to start from an empty spreadsheet.\n\n    blank_layout(width, height)   an empty hall: walls round the edge,\n                                  floor inside, nothing drawn yet\n    example_layout(robots)        a complete, valid warehouse sized for\n                                  a given fleet, lanes and all\n    layout_of(warehouse)          any loaded map as a Layout, with the\n                                  lanes it is actually routed by drawn\n                                  in as arrows\n    write_layout_xlsx(layout, p)  a Layout as a workbook the loader\n                                  reads back exactly\n\n``layout_of`` is what turns a map routed by the built-in V2 policy into\none that carries its own arrows, and it is how the drawn-lane format is\nproven complete: V2 exported and loaded back is routed on the identical\nedge set.\n\nDirections inside a Layout are grid steps (dx, dy) with +y pointing up\nthe sheet, which is how the coordinate labels run on every map in this\nrepository."},{"path":"src/mrta_core/mrta_core/map_check.py","size":11087,"symbols":[{"name":"Problem","line":35,"kind":"class","doc":"One thing wrong with the map, and where.\n\nAn ``error`` means robots cannot use the map as drawn. A\n``warning`` means they can, but it carries a risk that grows with\nthe number of robots -- on a map meant for a large fleet, treat a\nwarning as an error."},{"name":"MapReport","line":51,"kind":"class","doc":""},{"name":"_neighbours","line":83,"kind":"function","doc":""},{"name":"_components","line":90,"kind":"function","doc":"Strongly connected components, largest first (Kosaraju)."},{"name":"check_map","line":148,"kind":"function","doc":"Every structural rule a map must meet before robots can use it."},{"name":"errors","line":61,"kind":"function","doc":""},{"name":"warnings","line":65,"kind":"function","doc":""},{"name":"ok","line":69,"kind":"function","doc":"Usable: no errors. Warnings may remain."},{"name":"clean","line":74,"kind":"function","doc":"No errors and no warnings."},{"name":"max_robots","line":78,"kind":"function","doc":"Every robot needs its own parking cell to start on."}],"imports":["__future__: annotations","dataclasses: dataclass, field","mrta_core.grid: Cell","mrta_core.warehouse_map: WarehouseMap, ZoneType","mrta_core.warehouse_routing: HOME_TYPES, directional_blocked_edges, non_transit_cells"],"summary":"Fast structural checks for a warehouse map, in plain language.\n\nBuilt for the person drawing a map: it runs in a second or two, so it\ncan be run after every edit, and every problem it reports names the\ncell and says what to do about it.\n\nIt checks the road network, not the routes. The full acceptance gate,\n``scripts/check_map_topology.py``, additionally plans a route between\nevery pair of stations; that is slow on a large map and belongs at the\nend, once this check is clean.\n\nEverything is computed through the production policy --\n``directional_blocked_edges`` and ``non_transit_cells`` -- so the\nanswer is about the graph robots will actually drive, never a\nrestatement of the rules."},{"path":"src/mrta_core/mrta_core/models.py","size":606,"symbols":[{"name":"RobotStatus","line":5,"kind":"class","doc":""},{"name":"RobotState","line":12,"kind":"class","doc":""},{"name":"TaskState","line":25,"kind":"class","doc":""},{"name":"is_available","line":20,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","enum: Enum"],"summary":""},{"path":"src/mrta_core/mrta_core/order_queue.py","size":4475,"symbols":[{"name":"OrderQueue","line":33,"kind":"class","doc":"Logical orders in CSV sequence, plus the FIFO eligibility rule.\n\nOrdering is deterministic and total: the CSV sequence, and nothing\nelse. Two loads of the same file always produce the same queue."},{"name":"__init__","line":40,"kind":"function","doc":""},{"name":"from_csv","line":56,"kind":"function","doc":"Load a workload CSV into a queue in one step."},{"name":"__len__","line":66,"kind":"function","doc":""},{"name":"__iter__","line":69,"kind":"function","doc":""},{"name":"__contains__","line":72,"kind":"function","doc":""},{"name":"orders","line":76,"kind":"function","doc":"Every order, in FIFO (CSV) sequence, whatever its status."},{"name":"order_ids","line":81,"kind":"function","doc":""},{"name":"line_item_count","line":85,"kind":"function","doc":""},{"name":"order","line":88,"kind":"function","doc":""},{"name":"position","line":91,"kind":"function","doc":"0-based FIFO position of an order in the CSV sequence."},{"name":"pending","line":97,"kind":"function","doc":"Every still-PENDING order, in FIFO sequence.\n\nThe head of this queue is unambiguously 'the oldest waiting\norder', because the sequence is the CSV sequence."},{"name":"eligible","line":108,"kind":"function","doc":"The next ``min(count, pending)`` FIFO orders.\n\nThe prefix primitive the candidate window is built from. It is a\nprefix of :meth:`pending`, so a later order is never offered\nwhile an earlier one is still waiting.\n\n``count`` is a window width, not a robot count. The executor may\nwiden it past the width it first asked for when the prefix holds\nno assignable pair at all -- see the FIFO liveness rule -- but\nthe result is always still a prefix."},{"name":"reset","line":129,"kind":"function","doc":"Return every order to PENDING and clear its assignment."}],"imports":["pathlib: Path","mrta_core.orders: Order, OrderStatus, load_orders_csv"],"summary":"The deterministic FIFO warehouse workload.\n\nEvery order is known at startup and every order starts PENDING, so\nthere is nothing to gate on a clock. What the workload decides is\nnarrower and purely structural: *which* orders an allocator is allowed\nto look at right now.\n\nThe rule is FIFO on the CSV sequence. Given a window width W and M\norders still PENDING::\n\n    eligible_count = min(W, M)\n\nand the eligible set is exactly the next ``eligible_count`` PENDING\norders in CSV sequence. Nothing later is ever skipped: an order can\nonly leave the queue by leaving PENDING, which happens when an\nallocator claims it.\n\nChoosing W is the caller's decision, not this layer's. It used to be\nthe number of available robots, which collapsed almost every decision\nto one robot and one order; it is now set from the configured\nallocation window (docs/DECISIONS.md, \"Allocation Candidate Window\").\n\nDeliberately absent: allocation. This layer says *which orders are on\nthe table*; deciding which available robot takes which of them is the\nMRTA decision and belongs to the allocator."},{"path":"src/mrta_core/mrta_core/orders.py","size":7265,"symbols":[{"name":"OrderStatus","line":29,"kind":"class","doc":"Lifecycle of an order inside shared memory."},{"name":"OrderItem","line":40,"kind":"class","doc":""},{"name":"Order","line":47,"kind":"class","doc":""},{"name":"_station_problem","line":73,"kind":"function","doc":"Why ``zone_id`` is not a usable station of ``expected`` type.\n\nExistence alone is not enough: ``dropoff_id=shelf_004`` names a\nreal zone and would route a robot to racking to drop a parcel.\nReturns None when the id is valid."},{"name":"load_orders_csv","line":95,"kind":"function","doc":"Load orders, grouping rows by ``order_id``.\n\nThe returned tuple is the FIFO workload sequence: logical orders in\nthe sequence their first row appears in the CSV. Reading the same\nfile twice always yields the same sequence.\n\nWhen ``warehouse`` is given, every shelf_id and dropoff_id is\nchecked against the map so a typo fails at load time rather than\nhalfway through a mission."},{"name":"select_orders","line":207,"kind":"function","doc":"The first ``limit`` logical orders of the workload; 0 means all.\n\nThe one rule for a shorter run, shared by the headless runner\n(``--orders N``) and the ROS node (``order_limit:=N``), so both\nexecute exactly the same orders. An order is the unit: its line\nitems -- one CSV row each -- are never split, so a limit counts\norders, not rows. A limit above the number of orders takes them\nall. The order file itself is never rewritten."},{"name":"describe_order_selection","line":226,"kind":"function","doc":"One line saying which orders a run executes, and why.\n\nPrinted identically by the headless runner and the ROS node."},{"name":"shelf_ids","line":59,"kind":"function","doc":"Shelves to visit, in CSV row order."}],"imports":["csv","dataclasses: dataclass","enum: Enum","pathlib: Path","mrta_core.warehouse_map: ZoneType"],"summary":"Customer orders loaded from CSV.\n\nPure data plus a focused loader with no ROS dependency\n(which owns order state) and ``simulation_env`` (which executes it) can\nshare one definition.\n\nOne CSV row is one order line item. Rows sharing an ``order_id`` form a\nsingle logical order and must agree on dropoff.\n\nThe workload is deterministic and fully known at startup: every order\nexists from the moment the CSV is read and every order starts PENDING.\nThere is no release schedule and no deadline -- which orders an\nallocator may see is a FIFO question, answered by\n:class:`mrta_core.order_queue.OrderQueue`, not a clock question.\n\nDeliberately absent: priority, release_time, deadline, robot\nassignment, paths and charging. Assignment happens at runtime;\nrouting belongs to the planner."},{"path":"src/mrta_core/mrta_core/sim_config.py","size":7777,"symbols":[{"name":"SimConfig","line":19,"kind":"class","doc":""},{"name":"_resolve","line":91,"kind":"function","doc":"Find a file named in the config, relative to the config itself."},{"name":"resolve_map_path","line":114,"kind":"function","doc":"The map a config names, without loading the rest of the config.\n\n``load_sim_config`` needs the order file to exist. Generating that\nfile is exactly what needs to know the map first, so this resolves\nthe map alone, by the same rule ``load_sim_config`` uses."},{"name":"load_sim_config","line":136,"kind":"function","doc":""},{"name":"rewrite_scenario","line":225,"kind":"function","doc":"The config text with its map and fleet size switched to a new map.\n\nOnly the ``warehouse.map`` and ``fleet.robot_count`` lines change;\nevery comment and every other setting is kept exactly. Used when a\nnew map becomes the current one, so the one config always describes\nthe map the one world was built from."},{"name":"wall_for","line":53,"kind":"function","doc":"Wall-clock seconds to spend showing ``sim_seconds``.\n\nPlayback only. This never feeds back into simulation time."},{"name":"robot_id","line":66,"kind":"function","doc":"Deterministic robot id, 1-based: robot_001."},{"name":"window_width","line":70,"kind":"function","doc":"Resolve ``allocation_window`` to a width, or None for legacy.\n\n``fleet_size`` is the frozen default: the allocator may choose\namong as many orders as the fleet has robots, however many of\nthem happen to be free at that instant. ``legacy`` restores the\npre-S0 ``min(available_robots, pending)`` rule and exists only\nso the frozen pre-S0 baselines stay reproducible.\n\nSee docs/DECISIONS.md, \"Allocation Candidate Window\"."},{"name":"section","line":145,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","pathlib: Path","yaml","mrta_core.battery: BatteryConfig","re"],"summary":"Central simulation configuration.\n\nOne YAML file is authoritative for map, fleet, battery, service\ndurations, orders and Gazebo. Kept here in ``mrta_core`` -- plain\nPython, no ROS --\nso the workload and simulation components read the same file\nthrough the same code instead of each carrying its own constants."},{"path":"src/mrta_core/mrta_core/symbolic.py","size":4023,"symbols":[{"name":"PredicateThresholds","line":9,"kind":"class","doc":""},{"name":"robot_state_predicates","line":25,"kind":"function","doc":""},{"name":"task_state_predicates","line":54,"kind":"function","doc":""},{"name":"path_feature_predicates","line":67,"kind":"function","doc":""},{"name":"robot_task_predicates","line":108,"kind":"function","doc":""},{"name":"as_prolog_facts","line":129,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","math: isinf","mrta_core.grid: PathFeatures","mrta_core.models: RobotState, RobotStatus, TaskState"],"summary":""},{"path":"src/mrta_core/mrta_core/warehouse_map.py","size":7272,"symbols":[{"name":"ZoneType","line":26,"kind":"class","doc":"Operational meaning of a warehouse cell."},{"name":"WarehouseZone","line":41,"kind":"class","doc":"Named semantic zone occupying one or more traversable cells."},{"name":"WarehouseMap","line":57,"kind":"class","doc":"Warehouse map with independent occupancy and semantic layers."},{"name":"__post_init__","line":48,"kind":"function","doc":""},{"name":"__post_init__","line":84,"kind":"function","doc":""},{"name":"is_traversable","line":158,"kind":"function","doc":"Check only the occupancy layer."},{"name":"zone_at","line":162,"kind":"function","doc":"Return semantic zone containing the cell."},{"name":"zone_type_at","line":170,"kind":"function","doc":"Unlabelled traversable cells are NORMAL."},{"name":"zone_by_id","line":179,"kind":"function","doc":"Find a zone using its warehouse ID."},{"name":"zones_of_type","line":183,"kind":"function","doc":""},{"name":"cells_of_types","line":190,"kind":"function","doc":"Every cell of every zone whose type is in ``types``."}],"imports":["dataclasses: dataclass, field","enum: Enum","mrta_core.grid: Cell","mrta_core.world: WorldGrid"],"summary":"Layered warehouse map model.\n\nNavigation and warehouse semantics are intentionally separate.\n\nWorldGrid.obstacles answers whether a cell is traversable.\nWarehouseZone answers what a traversable cell means operationally.\n\nOnly obstacle cells are non-traversable.\nSemantic cells such as shelves, pickup points, drop-off points,\ncharging stations, charge-queue holding cells, staging areas, and\nwaiting areas remain valid robot positions.\n\nCHARGE_QUEUE is the dedicated holding bank beside the chargers: where\na robot waits for a charging slot, and where a preempted robot goes\nwhen it is not energy-eligible to rejoin the fleet. It is deliberately\ncharging-specific rather than a generic task queue."},{"path":"src/mrta_core/mrta_core/warehouse_map_io.py","size":5798,"symbols":[{"name":"_normalise","line":52,"kind":"function","doc":"Normalize spreadsheet labels."},{"name":"load_warehouse_csv","line":57,"kind":"function","doc":""}],"imports":["csv","pathlib: Path","mrta_core.warehouse_map: WarehouseMap, WarehouseZone, ZoneType","mrta_core.world: WorldGrid"],"summary":"Load a human-readable warehouse map from CSV."},{"path":"src/mrta_core/mrta_core/warehouse_map_xlsx.py","size":21914,"symbols":[{"name":"_parse_arrows","line":119,"kind":"function","doc":"The screen directions in a cell, or None if it is not arrows.\n\nSpaces and commas between arrows are allowed, so ``> ^`` and\n``>,^`` read the same as ``>^``."},{"name":"_normalise","line":190,"kind":"function","doc":""},{"name":"_zone_type","line":199,"kind":"function","doc":""},{"name":"_fill_rgb","line":203,"kind":"function","doc":""},{"name":"_is_red","line":217,"kind":"function","doc":""},{"name":"_is_orange","line":223,"kind":"function","doc":""},{"name":"_coordinate_label","line":229,"kind":"function","doc":"Read a warehouse coordinate label written in a border cell."},{"name":"XlsxCoordinateFrame","line":261,"kind":"class","doc":"Authoritative mapping from spreadsheet cells to grid cells.\n\n``excel_col_to_x`` and ``excel_row_to_y`` hold the one-based\nwarehouse coordinates read from the orange border, so every\nconversion is traceable back to a label a human typed."},{"name":"_contiguous","line":309,"kind":"function","doc":""},{"name":"_read_axis_labels","line":318,"kind":"function","doc":"Read coordinate labels for one axis of the border.\n\n``interior`` holds the warehouse rows or columns being labelled.\n``axis_lines`` holds the fully orange border lines to read from.\nEvery border line that carries a label must agree."},{"name":"detect_coordinate_frame","line":396,"kind":"function","doc":"Discover the warehouse coordinate frame from the orange border."},{"name":"read_xlsx_coordinate_frame","line":484,"kind":"function","doc":"Load only the coordinate frame, for inspection and validation."},{"name":"load_warehouse_xlsx","line":509,"kind":"function","doc":""},{"name":"contains","line":276,"kind":"function","doc":"Is this spreadsheet cell inside the warehouse interior?"},{"name":"warehouse_coord","line":280,"kind":"function","doc":"Spreadsheet cell -> one-based warehouse (X, Y)."},{"name":"to_grid","line":291,"kind":"function","doc":"Spreadsheet cell -> zero-based WorldGrid cell."}],"imports":["dataclasses: dataclass","pathlib: Path","openpyxl: load_workbook","mrta_core.grid: Cell","mrta_core.warehouse_map: WarehouseMap, WarehouseZone, ZoneType","mrta_core.world: WorldGrid"],"summary":"Load a warehouse map directly from an Excel XLSX layout.\n\nThe Excel workbook is the human-editable source of truth.\n\nCoordinate frame\n----------------\nThe workbook carries an explicit orange coordinate border.\n\n    Orange cells:\n        coordinate axes and origin annotation\n\n    Axis row:\n        warehouse X labels, 1 .. width\n\n    Axis column:\n        warehouse Y labels, 1 .. height\n        displayed top-down as height .. 1\n\nThe warehouse interior is the rectangle enclosed by that border.\nIts size comes from the coordinate labels, never from the extent\nof the drawn content.\n\n    grid_x = warehouse_x - 1\n    grid_y = warehouse_y - 1\n\nSo warehouse (1, 1) is WorldGrid (0, 0), which Gazebo renders at\ncell centre (0.5, 0.5).\n\nCell rules\n----------\nOrange cells:\n    coordinate labels, never part of the warehouse\n\nRed cells:\n    blocked / non-traversable\n\nBlank white cells:\n    normal traversable floor\n\nMerged semantic regions:\n    SHELVES\n    CHARGING\n    DROP ZONE\n    COLLECTION ZONE\n\nor single cells, with a full label or a one-letter code:\n    S  shelf          D  drop-off       C  charger\n    H  holding        P  parking (Stage Zone)\n\nEvery cell of a merged semantic region becomes its own\nsingle-cell WarehouseZone, so each shelf, charging bay, drop-off\npoint and collection point is individually addressable.\n\nIDs are numbered flat across the whole warehouse, in spreadsheet\nregion order, then by ascending (x, y) within a region:\n\n    shelf_001 .. shelf_072\n    charging_001 .. charging_016\n    charge_queue_001 .. charge_queue_00N\n\nAll semantic zone cells remain traversable.\n\nTraffic lanes (optional)\n------------------------\nA floor cell may carry arrows saying which way a robot may leave it:\n\n    >  or  →    toward the next column to the right\n    \u003c  or  ←    toward the previous column to the left\n    ^  or  ↑    toward the row above\n    v  or  ↓    toward the row below\n\nA junction carries several, for example ``>^``. Arrows are read as they\nlook on screen and converted through the coordinate labels, so they\nstay correct whichever way the axes are numbered.\n\nIf a map carries no arrows at all, it is routed by the built-in V2 lane\npolicy, which is how V1 and V2 maps keep working unchanged. If it\ncarries any, its arrows are the whole policy: a floor cell without an\narrow is a dead end, and the topology gate will say so.\n\nArrows run between floor cells only. Stations are never drawn into:\na robot enters and leaves any station from a neighbouring road by the\nfixed terminal rules, on every map alike."},{"path":"src/mrta_core/mrta_core/warehouse_routing.py","size":37982,"symbols":[{"name":"MissionSegment","line":39,"kind":"class","doc":""},{"name":"MissionPlan","line":54,"kind":"class","doc":""},{"name":"station_cells","line":62,"kind":"function","doc":"Every cell claimed by a semantic station."},{"name":"non_transit_types","line":120,"kind":"function","doc":"Cell types that are leg endpoints but never transit space.\n\nHome cells are deliberately not service types. Robots start and\npark there, but no pick/drop service or retreat is attached to a\nhome cell.\n\n``charging_apron`` overrides the migration gate, so the topology\nvalidator can score the target policy against the live one without\ngrowing a second copy of the lane rules."},{"name":"frontage_band","line":331,"kind":"function","doc":"Rows the home bank occupies, and therefore the frontage band.\n\nThe frontage circulation rules exist to stop robots meeting\nhead-on directly in front of the parking bank, so the band they\npolice has to be exactly the rows that bank spans. Deriving it\nfrom the map means adding home cells for more robots cannot\nsilently leave the new rows ungoverned -- which strands the\nfrontage lanes at x=1, x=2 and x=15 on those rows.\n\nFalls back to the module constants for a map with no home bank."},{"name":"_open_band","line":372,"kind":"function","doc":"The open band containing ``y``, or None inside a shelf block."},{"name":"_directional_edge_allowed","line":382,"kind":"function","doc":"Whether one geometric grid edge obeys warehouse traffic flow."},{"name":"_cached_directional_blocked_edges","line":594,"kind":"function","doc":"Build the fixed directed-edge restriction set once per layout."},{"name":"_drawn_edge_allowed","line":637,"kind":"function","doc":"Whether one grid edge is legal on a map that draws its own lanes.\n\nThe terminal rules are the same, word for word, as in\n``_directional_edge_allowed``: they are what makes a terminal a\nterminal, and they must not depend on who drew the map. Only the\nfloor-to-floor answer changes -- it comes from the map's arrows\ninstead of the built-in V2 rows and columns."},{"name":"_cached_drawn_blocked_edges","line":670,"kind":"function","doc":"The blocked-edge set for a map that draws its own lanes."},{"name":"directional_blocked_edges","line":713,"kind":"function","doc":"Directed edges forbidden by the warehouse lane policy.\n\nEvery consumer of the lane policy -- A*, the RMF nav graph, the\ntraffic controller, the topology gate -- reads it through this one\nfunction, so the two sources below can never disagree about which\nway a road runs:\n\n    the map draws lanes    its own arrows are the policy, so any\n                           layout routes without a code change\n    the map draws none     the built-in V2 policy below, unchanged\n\n``terminal_cells`` defaults to the live non-transit policy. The\ntopology validator passes an explicit set so it can score a\ncandidate policy through this exact function rather than\nreimplementing the lane rules."},{"name":"service_cells","line":758,"kind":"function","doc":"Every cell occupied by racking or a drop chute."},{"name":"non_transit_cells","line":767,"kind":"function","doc":"Cells excluded from intermediate static routing.\n\nnavigation_grid() removes the current leg's start and goal from\nthe blocked set, so a robot may still leave its own home cell and\nenter its own home destination."},{"name":"traversable_lane_edges","line":784,"kind":"function","doc":"Every directed edge a robot may actually drive.\n\nTerminals are leg endpoints, never intermediates. For A* that takes\ntwo rules working together: ``navigation_grid()`` blocks every\nterminal except the current leg's own start and goal, and the lane\npolicy itself forbids every terminal -> terminal edge, so even two\nadjacent endpoints are joined through the aisle, never directly.\n\nA static graph has no per-leg context, so it is handed the edge set\nwith both rules already resolved and endpoint access intact:\n\n    aisle    -> terminal    kept, a robot drives in to be served\n    terminal -> aisle       kept, the retreat after service\n    terminal -> terminal    dropped, that is the shortcut\n    ais"},{"name":"is_service_zone","line":863,"kind":"function","doc":""},{"name":"navigation_grid","line":872,"kind":"function","doc":"Planning view: ``occupied`` blocks, except this leg's endpoints.\n\n``terminal_cells`` defaults to the live non-transit policy and\nexists so the topology validator can plan against a candidate\npolicy using this same function."},{"name":"best_path_to_zone","line":907,"kind":"function","doc":"Find cheapest path from one cell to any cell in a zone."},{"name":"nearest_reachable_zone","line":945,"kind":"function","doc":"The zone with the cheapest directed-A* route from ``start_cell``.\n\nReturns ``(zone_id, distance_m)``, or None when no zone in\n``zone_ids`` is reachable. Planned exactly as a mission leg is, so\none-way aisles count: the geometrically closest zone is often not\nthe nearest one. An exact distance tie goes to the lower zone_id."},{"name":"RouteCache","line":993,"kind":"class","doc":"Memoized static legs for one warehouse and one occupancy view.\n\nCosting a batch of robot-order pairs asks for the same leg over and\nover: ``shelf_015 -> dropoff_016`` is identical no matter which\nrobot is being scored or which shelf permutation asked for it. Only\nthe opening leg, from a robot's own cell, is ever unique.\n\nA dispatch of 18 robots against 18 three-shelf orders is ~7800 A*\nsearches without this and a few hundred with it. The cache is a\npure memo -- same inputs, same PathResult -- so it changes cost and\ntiming, never the route chosen.\n\nSafe to keep for a whole run: the map and the service-cell rule do\nnot change while robots drive."},{"name":"plan_return_to_zone","line":1063,"kind":"function","doc":"One-leg plan from wherever a robot is back to a zone.\n\nUsed for parking. The robot is mid-aisle rather than on a station,\nso this takes a cell instead of a starting zone id."},{"name":"plan_from_cell","line":1109,"kind":"function","doc":"Plan a sequential mission from a bare cell through named zones.\n\nThis is the one leg-walking implementation. A robot mid-aisle is\nthe normal case once it has retreated from a station, so the start\nis a cell, not a zone.\n\n``services_block`` keeps robots out of shelves and drop zones\nthey are not visiting, and makes each such visit end with a\none-cell retreat into the aisle. Set it False only to measure\nthe unobstructed open-floor baseline.\n\nRetreat steps are included in ``path``, ``total_distance_m`` and\n``total_cost``, because the robot really drives them.\n\n``extra_blocked`` adds cells that are occupied right now -- most\nimportantly the cells stationary robots are standing on. A robot\nthat h"},{"name":"plan_zone_mission","line":1245,"kind":"function","doc":"Plan a mission that starts parked on ``zone_ids[0]``.\n\nThin wrapper over :func:`plan_from_cell`: it only resolves the\nfirst zone to its deterministic start cell."},{"name":"free","line":825,"kind":"function","doc":""},{"name":"__init__","line":1012,"kind":"function","doc":""},{"name":"leg","line":1025,"kind":"function","doc":"``best_path_to_zone`` with the answer remembered."},{"name":"stats","line":1055,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","functools: lru_cache","mrta_core.grid: Cell, GridMap, astar_path","mrta_core.warehouse_map: WarehouseMap, ZoneType"],"summary":"Static warehouse routing: the one grid-aware path layer.\n\nShelf, drop-off, Stage Zone, charging and charge-queue (holding) cells\nare terminals, not transit space. A robot may enter one only as the\nfinal cell of the leg that targets it, and never as a shortcut. Every\nother terminal is blocked for the whole leg, and no leg ever moves\ndirectly from one terminal to another, so a route never crosses\nracking, a drop chute, the home bank or the charging bank.\n\nHaving served a shelf or drop-off the robot reverses exactly one cell,\nback to the aisle cell it approached from. The next leg starts from\nthat aisle cell, not from inside the station. That retreat is a real\nmovement and is counted in the mission distance and cost.\n\nThe rule lives here, in the planner, not in the map. WarehouseMap's\noccupancy layer stays exactly what it always was -- the red cells --\nand the shelf restriction is a planning-time view laid on top.\n\nThis module sits in ``mrta_core`` because two layers need exactly the\nsame static answer and must never disagree:\n\n  * ``task_management`` predicts route cost when allocating,\n  * ``simulation_env`` executes the route it planned.\n\nOne A* (``mrta_core.grid.astar_path``), one free-cell rule\n(``service_cells`` + ``navigation_grid``), used by both. Allocation\ncost and executed mission are therefore the same computation, which is\nwhat makes the predicted-vs-realized comparison meaningful later."},{"path":"src/mrta_core/mrta_core/world.py","size":3768,"symbols":[{"name":"WorldGrid","line":16,"kind":"class","doc":""},{"name":"load_ascii_obstacles","line":89,"kind":"function","doc":"Load an ASCII obstacle map. ``#`` = obstacle, anything else = free.\n\nThe first text line is the TOP of the map (highest y), so the file reads the\nway the warehouse looks from above. Returns ``(width, height, obstacles)``."},{"name":"world_grid_from_ascii","line":111,"kind":"function","doc":""},{"name":"from_bounds","line":25,"kind":"function","doc":""},{"name":"square","line":46,"kind":"function","doc":"Grid centred on x=0, with y starting at 0 (drop-off convention)."},{"name":"to_cell","line":56,"kind":"function","doc":""},{"name":"to_world","line":63,"kind":"function","doc":""},{"name":"grid_map","line":70,"kind":"function","doc":""},{"name":"with_obstacles","line":78,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","math: ceil","mrta_core.grid: Cell, GridMap"],"summary":"World \u003c-> grid coordinate mapping.\n\nThe simulator and the ILP feature-extraction layer must agree on exactly one grid.\n``WorldGrid`` is that single source of truth: it converts continuous world coordinates\n(metres, as stored in the shelf database) to integer grid cells and back, and builds\nthe :class:`~mrta_core.grid.GridMap` that A* runs on."},{"path":"src/mrta_core/mrta_core/world_view.py","size":1884,"symbols":[{"name":"grid_to_world","line":33,"kind":"function","doc":"Grid cell -> world XY of that cell's centre."},{"name":"world_to_grid","line":49,"kind":"function","doc":"World XY -> the grid cell whose centre is nearest.\n\nExact inverse of :func:`grid_to_world` for any point at a cell\ncentre, which is where robots and station tiles are placed."}],"imports":["mrta_core.grid: Cell"],"summary":"Grid \u003c-> world coordinate transform.\n\nOne definition, because three layers must place the same cell at the\nsame metric point and can never be allowed to disagree:\n\n  * ``simulation_env`` renders the Gazebo world and drives live robot\n    poses,\n  * ``rmf_grid_traffic`` places RMF navigation-graph vertices,\n  * anything reading a pose back has to recover the cell.\n\nThe convention is a direct identity on the cell index:\n\n    world_x = origin_x + grid_x * resolution\n    world_y = origin_y + grid_y * resolution\n\nso with the default 1 m cells and a zero origin, grid cell ``(5, 15)``\nis world point ``(5.0, 15.0)``. A pose read out of Gazebo *is* the\ncell, with no offset to undo.\n\nThe cell's tile therefore spans ``x - 0.5 .. x + 0.5``: cell centres\nland on integers and tile edges on half-integers. That is the\ndeliberate trade for having the two coordinate systems be the same\nnumbers.\n\nThis module sits in ``mrta_core`` for the same reason\n``warehouse_routing`` does: it is shared truth, not the property of any\none consumer."},{"path":"src/mrta_core/package.xml","size":723,"symbols":[],"imports":[]},{"path":"src/mrta_core/resource/mrta_core","size":0,"symbols":[],"imports":[]},{"path":"src/mrta_core/setup.cfg","size":87,"symbols":[],"imports":[]},{"path":"src/mrta_core/setup.py","size":722,"symbols":[],"imports":["setuptools: find_packages, setup"],"summary":""},{"path":"src/mrta_core/tests/conftest.py","size":2114,"symbols":[{"name":"_stations","line":37,"kind":"function","doc":"(zone_id, zone_type) for every station, in a stable sequence."},{"name":"warehouse","line":51,"kind":"function","doc":"A map carrying the real warehouse's station ids, one cell each."},{"name":"csv_from_rows","line":78,"kind":"function","doc":"Write ``rows`` under the active schema and return the path."},{"name":"write","line":81,"kind":"function","doc":""}],"imports":["pathlib: Path","pytest","mrta_core.warehouse_map: WarehouseMap, WarehouseZone, ZoneType","mrta_core.world: WorldGrid"],"summary":"Shared fixtures for the order workload tests.\n\nThe tests use a synthetic map rather than the production XLSX so they\nstay fast and dependency-free, but its station ids are exactly the\nones the real warehouse defines: shelf_001..shelf_072,\ndropoff_001..dropoff_040 and staging_001..staging_018. Validation\nagainst the real map is covered by scripts/smoke_orders.py."},{"path":"src/mrta_core/tests/test_battery.py","size":5816,"symbols":[{"name":"test_twenty_metres_of_travel_is_exactly_one_percent","line":27,"kind":"function","doc":""},{"name":"test_sixty_seconds_of_service_is_exactly_one_percent","line":33,"kind":"function","doc":""},{"name":"test_three_hundred_seconds_standing_still_is_exactly_one_percent","line":38,"kind":"function","doc":"Waiting and idle drain through the same function and rate."},{"name":"test_rates_follow_the_config","line":45,"kind":"function","doc":""},{"name":"test_defaults_are_the_frozen_design","line":58,"kind":"function","doc":""},{"name":"test_yaml_numbers_are_read_exactly","line":74,"kind":"function","doc":"A decimal from YAML is the decimal, not the nearest binary float."},{"name":"test_per_robot_override","line":83,"kind":"function","doc":""},{"name":"test_bad_config_is_refused","line":104,"kind":"function","doc":""},{"name":"test_old_fleet_key_is_refused","line":109,"kind":"function","doc":"Initial SOC has one home now; the old key must not be ignored."},{"name":"test_one_second_of_charging_is_exactly_one_percent","line":125,"kind":"function","doc":""},{"name":"test_charge_energy_is_linear_and_exact","line":129,"kind":"function","doc":""},{"name":"test_the_frozen_example_is_twenty_nine_seconds","line":134,"kind":"function","doc":"71% at 1%/s charges for exactly 29 simulated seconds."},{"name":"test_duration_always_lands_exactly_on_full","line":146,"kind":"function","doc":""},{"name":"test_a_full_battery_needs_no_time","line":152,"kind":"function","doc":""},{"name":"test_a_negative_soc_still_charges_to_full","line":157,"kind":"function","doc":"Over-drained is allowed by the model, so it must be handled."},{"name":"test_the_rate_follows_the_config","line":166,"kind":"function","doc":""},{"name":"test_a_fractional_rate_stays_exact","line":173,"kind":"function","doc":"A configured 0.3 %/s must not drift into binary floats."},{"name":"replace_rate","line":186,"kind":"function","doc":""}],"imports":["fractions: Fraction","pytest","mrta_core.battery: FULL_SOC_PERCENT, BatteryConfig, charge_energy, charge_seconds_to_full, exact, service_energy, stationary_energy, travel_energy","mrta_core.sim_config: load_sim_config","dataclasses: replace"],"summary":"Battery V1 model: exact energy arithmetic and a strict config.\n\nPure: no engine, no map. The ledger and engine integration are covered\nin simulation_env/test/test_battery_ledger.py."},{"path":"src/mrta_core/tests/test_grid.py","size":2012,"symbols":[{"name":"test_astar_finds_direct_path_without_obstacles","line":7,"kind":"function","doc":""},{"name":"test_astar_avoids_obstacle","line":17,"kind":"function","doc":""},{"name":"test_astar_reports_unreachable_goal","line":31,"kind":"function","doc":""},{"name":"test_path_features_from_robot_to_task_pickup","line":45,"kind":"function","doc":""},{"name":"test_congestion_increases_path_cost","line":81,"kind":"function","doc":""}],"imports":["math: inf","mrta_core.grid: GridMap, astar_path, extract_path_features","mrta_core.models: RobotState, RobotStatus, TaskState"],"summary":""},{"path":"src/mrta_core/tests/test_kinematics.py","size":1888,"symbols":[{"name":"straight_path","line":11,"kind":"function","doc":""},{"name":"test_runs_and_turns_straight_line","line":15,"kind":"function","doc":""},{"name":"test_runs_and_turns_l_shape","line":21,"kind":"function","doc":""},{"name":"test_straight_time_trapezoid_matches_hand_calc","line":29,"kind":"function","doc":""},{"name":"test_straight_time_triangular_when_short","line":36,"kind":"function","doc":""},{"name":"test_turn_adds_time","line":43,"kind":"function","doc":""},{"name":"test_energy_percent_is_meaningful_but_bounded","line":50,"kind":"function","doc":""},{"name":"test_longer_path_costs_more_energy","line":57,"kind":"function","doc":""},{"name":"test_turn_time_default_is_quarter_turn","line":64,"kind":"function","doc":""}],"imports":["math: pi","mrta_core.kinematics: RobotModel, _runs_and_turns, path_energy_percent, path_time"],"summary":""},{"path":"src/mrta_core/tests/test_map_lanes.py","size":14570,"symbols":[{"name":"v2","line":53,"kind":"function","doc":""},{"name":"corridor","line":58,"kind":"function","doc":"The smallest legal drawn map: a one-way loop with two stations.\n\n5 x 5, walls round the edge, a 3 x 3 interior::\n\n    y=3   \u003c \u003c v\n    y=2   ^ S v      S shelf at (2, 2), D drop-off below the loop\n    y=1   ^ > >\n          D at (2, 0) is on the edge, under the loop's bottom row"},{"name":"load","line":94,"kind":"function","doc":""},{"name":"test_v2_drawn_as_arrows_is_routed_identically","line":103,"kind":"function","doc":"The strongest test of the format there is.\n\nV2's lane policy is intricate -- frontage lanes that exist only on\nthe rows the home bank spans, westbound rungs inside shelf blocks,\nshelf columns that are northbound but never cross a block. If the\narrow format could not express any of that, this would fail."},{"name":"test_a_map_without_arrows_keeps_the_built_in_policy","line":121,"kind":"function","doc":"Backward compatibility: nothing drawn, nothing changes."},{"name":"test_arrows_are_read_as_screen_directions","line":151,"kind":"function","doc":""},{"name":"test_anything_else_is_not_an_arrow","line":156,"kind":"function","doc":""},{"name":"test_up_on_the_sheet_is_north_in_the_grid","line":160,"kind":"function","doc":"The sheet's Y labels run upward, so the up arrow is +y."},{"name":"test_one_letter_codes_load_as_stations","line":172,"kind":"function","doc":""},{"name":"test_an_arrow_into_a_wall_is_refused","line":190,"kind":"function","doc":""},{"name":"test_an_arrow_into_a_station_is_refused","line":198,"kind":"function","doc":""},{"name":"test_unknown_cell_text_is_refused_with_both_vocabularies","line":206,"kind":"function","doc":""},{"name":"test_a_lane_touching_a_station_is_refused_by_the_map_itself","line":219,"kind":"function","doc":"The st still drive into a station and reverse back out."},{"name":"test_transit_lanes_are_left_alone","line":139,"kind":"function","doc":"The rule removes terminal chains and nothing else."},{"name":"test_chargers_and_holding_cells_are_terminals","line":178,"kind":"function","doc":"The live policy treats the charging apron like any other bank.\n\nA charger and its neighbouring holding cell are both terminals: no\nlane joins them directly, and each keeps its two-way service\nconnection to the aisle cell beside it."}],"imports":["mrta_core.warehouse_map: WarehouseMap, WarehouseZone, ZoneType","mrta_core.warehouse_routing: NON_TRANSIT_TYPES, directional_blocked_edges, non_transit_cells, plan_from_cell, traversable_lane_edges","mrta_core.world: WorldGrid"],"summary":"Terminals are leg endpoints, never transit, for A* and RMF alike.\n\n``directional_blocked_edges()`` answers which way an aisle runs, and\nforbids every terminal -> terminal edge. ``navigation_grid()``\nseparately blocks every terminal except the current leg's own start\nand goal. A* gets both rules; a static graph gets the edge set from\n``traversable_lane_edges()``, which resolves them without the per-leg\ncontext. These tests pin the contract the RMF nav graph generator,\nthe verifier and the executor all depend on."},{"path":"src/mrta_core/tests/test_world.py","size":1939,"symbols":[{"name":"test_from_bounds_dimensions","line":5,"kind":"function","doc":""},{"name":"test_round_trip_cell_world","line":11,"kind":"function","doc":""},{"name":"test_to_cell_clamps_out_of_bounds","line":19,"kind":"function","doc":""},{"name":"test_grid_map_carries_obstacles","line":25,"kind":"function","doc":""},{"name":"test_astar_routes_around_obstacle_wall","line":32,"kind":"function","doc":""},{"name":"test_ascii_obstacle_loader","line":43,"kind":"function","doc":""}],"imports":["mrta_core.grid: astar_path","mrta_core.world: WorldGrid, load_ascii_obstacles, world_grid_from_ascii"],"summary":""},{"path":"src/rmf_grid_traffic/CMakeLists.txt","size":1211,"symbols":[],"imports":[]},{"path":"src/rmf_grid_traffic/config/warehouse_nav_graph.yaml","size":349608,"symbols":[],"imports":[]},{"path":"src/rmf_grid_traffic/package.xml","size":732,"symbols":[],"imports":[]},{"path":"src/rmf_grid_traffic/scripts/generate_nav_graph.py","size":8096,"symbols":[{"name":"main","line":50,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","collections: Counter","pathlib: Path","yaml","mrta_core.sim_config: load_sim_config","mrta_core.world_view: grid_to_world","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: non_transit_cells, traversable_lane_edges"],"summary":"Generate an Open-RMF navigation graph from the warehouse XLSX.\n\nThe XLSX remains the single source of truth for geometry, and\n``mrta_core.warehouse_routing`` remains the single source of truth for\ntraffic direction. This script only joins the two; it decides nothing.\n\nRMF vertices are placed at the same cell centres used by Gazebo, via\nthe one shared transform in ``mrta_core.world_view``:\n\n    world_x = origin_x + grid_x * resolution\n    world_y = origin_y + grid_y * resolution\n\nLanes come from the directed lane policy, not from raw adjacency, via\n``traversable_lane_edges()``. That resolves both halves of the policy:\n\n  * a one-way aisle yields exactly one lane\n  * a shelf, dropoff or staging service edge yields both, because a\n    robot has to drive in and reverse back out\n  * a terminal-to-terminal edge yields none, because terminals are leg\n    endpoints and never a route across the station bank\n\nThis is what keeps Gazebo a mirror of the scientific engine rather than\na second planner with its own opinion. Emitting both directions\nunconditionally, as this script once did, put every head-on back into\nRMF that the one-way core was built to remove. Emitting the terminal\nchain, as it did until the baseline freeze, let a static RMF route walk\nthe length of the home bank -- a shortcut the scientific planner never\ntakes, because ``navigation_grid()`` blocks terminals per leg."},{"path":"src/rmf_grid_traffic/scripts/local_headway_demo.py","size":5083,"symbols":[{"name":"Robot","line":21,"kind":"class","doc":""},{"name":"distance_m","line":53,"kind":"function","doc":""},{"name":"render","line":59,"kind":"function","doc":""},{"name":"main","line":105,"kind":"function","doc":""},{"name":"position","line":28,"kind":"function","doc":""},{"name":"finished","line":32,"kind":"function","doc":""},{"name":"next_position","line":36,"kind":"function","doc":""},{"name":"remaining_distance","line":42,"kind":"function","doc":""},{"name":"move","line":45,"kind":"function","doc":""},{"name":"wait","line":49,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","math","time","dataclasses: dataclass"],"summary":""},{"path":"src/rmf_grid_traffic/scripts/local_traffic_demo.py","size":5204,"symbols":[{"name":"Robot","line":18,"kind":"class","doc":""},{"name":"priority_key","line":52,"kind":"function","doc":"Smaller tuple wins.\n\n1. Busy robot beats idle robot.\n2. Smaller remaining distance wins.\n3. Smaller robot_id breaks an exact tie."},{"name":"choose_winner","line":67,"kind":"function","doc":""},{"name":"render","line":71,"kind":"function","doc":""},{"name":"main","line":130,"kind":"function","doc":""},{"name":"position","line":26,"kind":"function","doc":""},{"name":"finished","line":30,"kind":"function","doc":""},{"name":"next_position","line":34,"kind":"function","doc":""},{"name":"remaining_distance","line":41,"kind":"function","doc":""},{"name":"move","line":44,"kind":"function","doc":""},{"name":"wait","line":48,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","time","dataclasses: dataclass"],"summary":""},{"path":"src/rmf_grid_traffic/scripts/local_yield_demo.py","size":9136,"symbols":[{"name":"Robot","line":25,"kind":"class","doc":""},{"name":"priority_key","line":77,"kind":"function","doc":"S kind":"function","doc":""},{"name":"main","line":510,"kind":"function","doc":""},{"name":"position","line":86,"kind":"function","doc":""},{"name":"finished","line":90,"kind":"function","doc":""},{"name":"next_position","line":94,"kind":"function","doc":""},{"name":"after_next_position","line":101,"kind":"function","doc":""},{"name":"remaining_distance","line":108,"kind":"function","doc":""},{"name":"move","line":111,"kind":"function","doc":""},{"name":"wait","line":115,"kind":"function","doc":""},{"name":"leaves","line":382,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","sys","time","collections: Counter","dataclasses: dataclass","itertools: combinations","pathlib: Path","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: HOME_TYPES, RouteCache"],"summary":"Two-robot playback of a real synchronous traffic conflict.\n\nSearches a bounded, deterministic set of Stage Zone -> shelf legs on\nthe current research map for two robots that, dispatched at the same\ninstant on their production directed A* routes, are scheduled into the\nsame cell at the same timestep. The chosen pair is then played back\nthrough a two-robot local arbitration to show who gets right-of-way\nand who waits.\n\nNormal transit aisles are one-way (docs/DECISIONS.md). The structural\nhead-on edge swap this demo was first written to show therefore cannot\noccur on transit any more, and searching for it finds nothing. The\nsearch now targets the conflicts the one-way model really produces.\nEach is a vertex contention -- two robots scheduled into one cell at\none timestep -- named by the shape of the lanes around that cell:\n\n  MERGE         the robots arrive on two different incoming lanes and\n                leave on the same outgoing lane\n  INTERSECTION  the robots arrive on two perpendicular incoming lanes\n                and leave on different lanes: the paths cross\n  VERTEX        any other same-cell, same-timestep shape\n\nA head-on EDGE_SWAP is still detected but never displayed: on one-way\ntransit it must not appear, so finding one is reported as a warning.\n\nRoutes are the production legs (``RouteCache``: directed A*, every\nterminal except the leg's own endpoints blocked), the same computation\nthe allocator costs and the engine executes. Manhattan distance is not\nused as route cost anywhere here.\n\nThis is a visualisation, not a validator. Head-on and yield behaviour\nis asserted by check_local_headon_resolution.py,\ncheck_engine_headon_yield.py and check_local_yield_selector.py."},{"path":"src/rmf_grid_traffic/scripts/verify_nav_graph.py","size":7025,"symbols":[{"name":"main","line":46,"kind":"function","doc":""},{"name":"reach","line":137,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","collections: deque","pathlib: Path","yaml","mrta_core.sim_config: load_sim_config","mrta_core.world_view: world_to_grid","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: non_transit_cells, traversable_lane_edges"],"summary":"Verify the RMF nav graph is an exact mirror of the lane policy.\n\nGazebo and RMF must not hold an opinion about traffic direction. This\ncheck re-derives the expected lane set from\n``mrta_core.warehouse_routing`` and compares it, edge by edge, with the\nlanes actually written into the YAML.\n\nIt fails on any disagreement in either direction:\n\n  * a lane RMF has that the planner forbids\n    -> a robot could drive the wrong way in Gazebo\n  * a lane the planner allows that RMF lacks\n    -> RMF could not follow a route the engine legitimately planned\n\nIt also re-checks strong connectivity on the RMF graph itself, so a\ngraph that is one-way but cut into pieces cannot pass, and it checks\nthe half of the lane policy a static graph cannot apply for itself:\nterminals are leg endpoints, never intermediates. A lane joining two\nterminal cells is a route across the station bank -- along the home\nbank, or down a shelf column -- that the scientific planner never\ntakes, because ``navigation_grid()`` blocks terminals per leg.\n\nExpected lanes therefore come from ``traversable_lane_edges()``, the\nsame function the generator writes from, so the two cannot drift."},{"path":"src/rmf_grid_traffic/src/graph_check.cpp","size":2065,"symbols":[],"imports":[]},{"path":"src/rmf_grid_traffic/src/route_check.cpp","size":5922,"symbols":[],"imports":[]},{"path":"src/rmf_grid_traffic/src/two_robot_check.cpp","size":9789,"symbols":[],"imports":[]},{"path":"src/robot_interfaces/CMakeLists.txt","size":601,"symbols":[],"imports":[]},{"path":"src/robot_interfaces/msg/FleetStatus.msg","size":1197,"symbols":[],"imports":[]},{"path":"src/robot_interfaces/msg/RobotState.msg","size":812,"symbols":[],"imports":[]},{"path":"src/robot_interfaces/msg/RobotStateArray.msg","size":239,"symbols":[],"imports":[]},{"path":"src/robot_interfaces/package.xml","size":830,"symbols":[],"imports":[]},{"path":"src/simulation_env/config/README.md","size":2254,"symbols":[],"imports":[]},{"path":"src/simulation_env/config/orders.csv","size":149299,"symbols":[],"imports":[]},{"path":"src/simulation_env/config/warehouse.yaml","size":5918,"symbols":[],"imports":[]},{"path":"src/simulation_env/launch/gazebo.launch.py","size":3050,"symbols":[{"name":"_source_tree","line":27,"kind":"function","doc":"src/simulation_env in this workspace, if the package was built here."},{"name":"start_gazebo","line":36,"kind":"function","doc":"Stop any Gazebo of this world, write the fleet world, start Gazebo."},{"name":"generate_launch_description","line":61,"kind":"function","doc":""}],"imports":["os","ament_index_python.packages: get_package_share_directory","launch: LaunchDescription","launch.actions: DeclareLaunchArgument, ExecuteProcess, OpaqueFunction","simulation_env.gazebo_world: stop_gazebo, world_file_for, write_fleet_world"],"summary":"Gazebo with the warehouse and the fleet parked on its start cells.\n\nTerminal 1 of a demo: start this once and keep it open, then start runs\nin terminal 2 with ``warehouse_sim.launch.py start_gazebo:=false``. The\nrobots are visible straight away, standing on their start cells; a run\nmakes them move.\n\n    ros2 launch simulation_env gazebo.launch.py robots:=100\n\nStarting it again first stops the Gazebo already running this world, so\nthere is only ever one. ``robots:=0`` (the default) takes the fleet size\nfrom the config. ``headless:=true`` runs the server with no window.\n\nThe world is the one world file for the config, plus the robots, written\nto a temporary copy on every start (simulation_env/gazebo_world.py)."},{"path":"src/simulation_env/launch/warehouse_sim.launch.py","size":7865,"symbols":[{"name":"_source_tree","line":43,"kind":"function","doc":"src/simulation_env in this workspace, if the package was built here.\n\ninstall/simulation_env/share/simulation_env is four levels below the\nworkspace root. Reading the config and the world from the source\ntree means build_scenario.py's output is used straight away, with no\ncolcon rebuild in between."},{"name":"generate_launch_description","line":58,"kind":"function","doc":""}],"imports":["os","ament_index_python.packages: get_package_share_directory","launch: LaunchDescription","launch.actions: DeclareLaunchArgument, IncludeLaunchDescription","launch.conditions: IfCondition","launch.launch_description_sources: PythonLaunchDescriptionSource","launch.substitutions: LaunchConfiguration","launch_ros.actions: Node"],"summary":"Warehouse workload simulation: fleet execution and Gazebo.\n\nOne config file drives the system: map, fleet size, order file, speed\nand Gazebo world name all come from it. The fleet node runs the\nselected MRTA workload; Gazebo remains visualization only.\n\nThe world file is derived from ``gazebo.world_name`` in the config, so\npointing ``config_file`` at a different scenario automatically picks up\nthat scenario's world instead of silently reusing the default one --\nwhich is how a ten-robot config used to end up rendered in an\neighteen-robot world.\n\nOne config, one map, one world. Build them for a map with::\n\n    python3 src/simulation_env/scripts/build_scenario.py --map \u003cmap.xlsx>\n\nThe world file holds the warehouse only. Gazebo is started by\ngazebo.launch.py (included here unless start_gazebo:=false), which\nstops any Gazebo already running this world and loads the world with\nthe run's robots (robots:=N) parked on their start cells, so they are\nvisible at once. The fleet node finds them there and makes them move.\nThe config and the world are read from the source tree when the\nworkspace has one, so a rebuilt map is used without a colcon rebuild.\n\nTwo terminals, Gazebo kept open between runs:\n\n    ros2 launch simulation_env gazebo.launch.py robots:=100\n    ros2 launch simulation_env warehouse_sim.launch.py         start_gazebo:=false orders:=true robots:=100"},{"path":"src/simulation_env/maps/README.md","size":1394,"symbols":[],"imports":[]},{"path":"src/simulation_env/maps/W100.xlsx","size":14443,"symbols":[],"imports":[]},{"path":"src/simulation_env/maps/my_map.xlsx","size":14444,"symbols":[],"imports":[]},{"path":"src/simulation_env/maps/my_map_20.xlsx","size":8230,"symbols":[],"imports":[]},{"path":"src/simulation_env/maps/my_map_60.xlsx","size":15232,"symbols":[],"imports":[]},{"path":"src/simulation_env/package.xml","size":752,"symbols":[],"imports":[]},{"path":"src/simulation_env/resource/simulation_env","size":0,"symbols":[],"imports":[]},{"path":"src/simulation_env/scripts/README.md","size":3007,"symbols":[],"imports":[]},{"path":"src/simulation_env/scripts/build_scenario.py","size":8002,"symbols":[{"name":"run","line":54,"kind":"function","doc":"Run one generation step, failing loudly."},{"name":"check_map","line":70,"kind":"function","doc":"The drawing check; stop before touching the config on any error."},{"name":"main","line":84,"kind":"function","doc":""},{"name":"resolve_orders_target","line":255,"kind":"function","doc":"Where the config's orders.file points, without requiring it to exist."}],"imports":["argparse","subprocess","sys","pathlib: Path","mrta_core.sim_config: load_sim_config, rewrite_scenario","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: home_bank","yaml"],"summary":"Build everything for the current map: config, orders, Gazebo world.\n\nOne map, one config, one world. Switching to a new map is one command:\n\n    build_scenario.py --map src/simulation_env/maps/\u003cyour map>.xlsx\n\nwhich, in order:\n\n    1. checks the map (map_tool check) and stops on any error\n    2. rewrites the one config, src/simulation_env/config/warehouse.yaml:\n       warehouse.map -> the new map, fleet.robot_count -> its parking cells\n    3. regenerates config/orders.csv from the new map's own stations\n    4. rebuilds the one Gazebo world, worlds/warehouse.world (the\n       warehouse only; robots are created when a run starts)\n    5. rebuilds the RMF nav graph from the map's lanes and verifies it\n\nWithout --map it rebuilds the world and nav graph for the map the\nconfig already names (for example after editing that map in Excel; add\n--orders to regenerate the orders too).\n\n    build_scenario.py\n    build_scenario.py --map src/simulation_env/maps/W100.xlsx --orders 2000"},{"path":"src/simulation_env/scripts/check_18_robot_traffic_stress.py","size":13142,"symbols":[{"name":"synchronous_conflict_score","line":24,"kind":"function","doc":"Static score used only to select a difficult test scenario.\n\nThis does not control execution.\n\nScore:\n  +1 simultaneous same-cell request\n  +2 direct opposite-edge request\n\nThe real FleetSimulationEngine remains the authority."}],"imports":["dataclasses: replace","itertools: combinations","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: plan_from_cell","simulation_env.fleet: home_bank, build_fleet, home_stations","simulation_env.fleet_engine: FleetSimulationEngine"],"summary":""},{"path":"src/simulation_env/scripts/check_b4_charging.py","size":14617,"symbols":[{"name":"low","line":63,"kind":"function","doc":""},{"name":"run","line":91,"kind":"function","doc":""},{"name":"trips_of","line":184,"kind":"function","doc":""},{"name":"check","line":192,"kind":"function","doc":""},{"name":"main","line":411,"kind":"function","doc":""},{"name":"on_tick","line":119,"kind":"function","doc":""}],"imports":["sys","dataclasses: replace","fractions: Fraction","pathlib: Path","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.charging: ChargeState, ResourceState","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor, battery_event_line, charging_report_lines","task_management.allocation_strategy: get_batch_strategy"],"summary":"Battery V1 B4: charge to 100%, leave the charger, rejoin the fleet.\n\nHeadless demonstration on the V2 map with controlled initial SOCs. B3\nproved a CHARGE_DUE robot reaches a reserved terminal; this proves the\nrest of the cycle:\n\n  single    one robot at 9% on a short workload. It charges once and\n            then completes further orders -- the end-to-end proof that\n            a charged robot is genuinely back in the fleet.\n  four      robot_001..004 at 9%: four parallel charges, four rejoins.\n  twelve    robot_001..012 at 9%: 8 charge and rejoin, 4 stay in\n            holding (promotion is B5, not B4).\n  recycle   robot A at 9%, robot B at 18%, one usable charger. B works\n            first, then requests and occupies the same charger after\n            A has charged, cleared the access edge and rejoined.\n  slow      one robot at 9%, six orders, charging at 0.1%/s. Its finite\n            931-second dwell must not trigger the progress watchdog.\n  contested the twelve fleet on the full workload, where departures\n            have to merge into aisles busy with order traffic.\n\nChecked in every scenario:\n\n    SOC rises only inside a charge session, at the net configured rate\n    every session lands on exactly 100% (exact rational arithmetic)\n    no order is dispatched to a robot between its request and its rejoin\n    a slot is OCCUPIED for the whole charge, VACATING while the robot\n        reverses out, and FREE only once it stands on the aisle cell\n    two robots never overlap on one charger cell\n    every charged robot ends back in the fleet, parked or working\n    no yield, no reservation violation, no SOC below 0\n\nUsage:\n    PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management \\\n        python src/simulation_env/scripts/check_b4_charging.py"},{"path":"src/simulation_env/scripts/check_b5_queue.py","size":15266,"symbols":[{"name":"low","line":73,"kind":"function","doc":""},{"name":"run","line":101,"kind":"function","doc":""},{"name":"trips","line":206,"kind":"function","doc":"Every terminal trip of the run, current and historical, once."},{"name":"check","line":217,"kind":"function","doc":""},{"name":"main","line":432,"kind":"function","doc":""},{"name":"on_tick","line":135,"kind":"function","doc":""}],"imports":["sys","dataclasses: replace","fractions: Fraction","pathlib: Path","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.charging: ChargeState, ResourceState","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor, battery_event_line, charging_report_lines","task_management.allocation_strategy: get_batch_strategy"],"summary":"Battery V1 B5: holding promotion and charger preemption.\n\nHeadless demonstration on the V2 map with controlled initial SOCs. B4\nproved a robot charges to 100%, leaves and rejoins; this proves the two\npolicies that decide *who* gets a charger:\n\n  twelve    robot_001..012 at 9%: 8 take the chargers, 4 wait in\n            holding, and all 4 are promoted onto chargers as they free\n            up. The acceptance scenario: 12 robots, 8 chargers, 14\n            holding cells.\n  late      8 at 9% fill the chargers; robot_009 (14%) later turns\n            CHARGE_NEEDED with every charger OCCUPIED. A CHARGE_NEEDED\n            robot never preempts -- it waits and is promoted.\n  preempt   robot_001 at 9% takes the only usable charger; robot_002\n            (11.5%, reserve 0) crosses 10% while running an order and\n            requests mid-charge. It preempts, and the victim -- fit for\n            work on its partial charge -- rejoins the fleet.\n  preempt_wait\n            the same at 0.1%/s, so the victim is still below the\n            CHARGE_DUE threshold when it is cut short. It is not fit for\n            work, so it waits in a holding cell instead, and the charger\n            it gave up goes to the robot that displaced it.\n  contested the twelve fleet on the full 100-order workload, where\n            promotions have to merge into aisles busy with order work.\n\nChecked in every scenario:\n\n    charger occupancy never exceeds the bank, one robot per cell\n    no robot ever holds two charger or two holding reservations\n    no robot waits in holding while a charger stands free and unpromised\n    every promotion goes to the lowest-SOC waiting robot of that instant\n    a promoted robot leaves its holding cell only after being promoted,\n        and the cell is released only once it stands on the aisle cell\n    only a CHARGE_DUE robot preempts, only the highest-SOC charging\n        robot is displaced, and only if its SOC is strictly higher\n    a preempted session books exactly the time it charged\n    a preempted robot rejoins only if it is fit for work, else it waits\n    the charger freed by a preemption is held for the requester\n    no yield, no reservation violation, no SOC below 0\n    every order still completes\n\nUsage:\n    PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management \\\n        python src/simulation_env/scripts/check_b5_queue.py"},{"path":"src/simulation_env/scripts/check_batch_reservations.py","size":2470,"symbols":[],"imports":["fractions: Fraction","simulation_env.reservations: ReservationTable"],"summary":""},{"path":"src/simulation_env/scripts/check_battery_eligibility.py","size":10418,"symbols":[{"name":"executor","line":61,"kind":"function","doc":""},{"name":"score_all","line":84,"kind":"function","doc":"Every pending order, scored for one robot right now."},{"name":"show_requirement","line":97,"kind":"function","doc":""},{"name":"main","line":123,"kind":"function","doc":""},{"name":"check","line":130,"kind":"function","doc":""}],"imports":["dataclasses: replace","fractions: Fraction","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor, battery_event_line, eligibility_report_lines","task_management.allocation_strategy: get_batch_strategy"],"summary":"Battery V1 B2: show that energy eligibility actually binds.\n\nControlled test only. Six robots are given low initial SOC through\n``battery.initial_soc_overrides``; the other sixteen stay at 100%. The\nshipped configs never do this.\n\n    robot_001  50%    robot_002  20%    robot_006  14%\n    robot_003  12%    robot_004  10%    robot_005   9%\n\nAll six start on Stage Zone cells. The full run below uses the first 40\norders, as it did in B2, when a REQUEST robot stood where it was and\none out in an aisle blocked the lane. Since B3 a REQUEST robot drives to\na reserved charger or holding cell; check_charger_evacuation.py runs\nthis same fleet on all 100 orders.\n\n    PYTHONPATH=$PP $PY src/simulation_env/scripts/check_battery_eligibility.py"},{"path":"src/simulation_env/scripts/check_charger_evacuation.py","size":12566,"symbols":[{"name":"low","line":59,"kind":"function","doc":""},{"name":"run","line":84,"kind":"function","doc":""},{"name":"check","line":174,"kind":"function","doc":""},{"name":"main","line":356,"kind":"function","doc":""},{"name":"on_tick","line":99,"kind":"function","doc":""},{"name":"held_by","line":282,"kind":"function","doc":"Was this robot the legitimate holder of ``cell`` at ``when``?"}],"imports":["sys","dataclasses: replace","fractions: Fraction","pathlib: Path","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: non_transit_cells","simulation_env.charging: SETTLED_STATES, ChargeState, ResourceState","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor, battery_event_line, charging_report_lines","task_management.allocation_strategy: get_batch_strategy"],"summary":"Battery V1 B3/B4: REQUEST robots leave the transit network, charge\nand rejoin the fleet.\n\nHeadless demonstration on the V2 map with controlled initial SOCs:\n\n  four      robot_001..004 at 9%: four distinct chargers\n  twelve    robot_001..012 at 9%: 8 chargers, 4 holding cells\n  late      8 at 9% fill the chargers; robot_009 (14%) later turns\n            CHARGE_NEEDED in an aisle and goes to a holding cell\n  saturated 10 at 9%, holding bank cut to 2 cells for this run only;\n            robot_011 (14%) finds everything taken -> Stage Zone\n  b2_block  the B2 controlled fleet (50/20/12/10/9/14 %) on all 100\n            orders, which deadlocked at t=391.3333 in B2 because a\n            REQUEST robot held its aisle cell\n\nFor every scenario it checks: every requester reaches its reserved\nterminal; a charger robot charges to exactly 100%, reverses off and\nrejoins, and its slot is FREE again; a holding robot either stays put\nor is promoted onto a freed charger (B5) and leaves only then; a\nterminal is only ever entered or left by the robot holding it at the\ntime; no robot moves terminal -> terminal; no yield; no reservation\nviolation; SOC rises only inside a charge session. Exits non-zero on\nany failure.\n\nUsage:\n    PYTHONPATH=src/mrta_core:src/simulation_env:src/task_management \\\n        python src/simulation_env/scripts/check_charger_evacuation.py"},{"path":"src/simulation_env/scripts/check_engine_batch_traffic.py","size":3009,"symbols":[{"name":"FakeRobot","line":12,"kind":"class","doc":"Minimum robot interface needed by _try_moves_batch()."},{"name":"__init__","line":15,"kind":"function","doc":""},{"name":"finished","line":29,"kind":"function","doc":""},{"name":"book_wait","line":32,"kind":"function","doc":""}],"imports":["fractions: Fraction","simulation_env.fleet_engine: EventType, FleetSimulationEngine","simulation_env.grid_robot: GridRobotStatus"],"summary":""},{"path":"src/simulation_env/scripts/check_engine_headon_yield.py","size":6858,"symbols":[{"name":"transit","line":64,"kind":"function","doc":""},{"name":"audited_begin_move","line":176,"kind":"function","doc":""},{"name":"audited_begin_batch","line":184,"kind":"function","doc":""}],"imports":["mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: directional_blocked_edges, non_transit_cells, plan_from_cell","simulation_env.fleet: build_fleet, home_stations","simulation_env.fleet_engine: FleetSimulationEngine"],"summary":"Head-on prevention in the production fleet engine.\n\nThis check used to drive a head-on between two robots at (4,1) and\n(5,1) and assert that the loser found a one-cell yield bay. That\nscenari
