e config, one map, one world.\n\nThe research setup is a single config (config/warehouse.yaml) naming a\nsingle map, with a single Gazebo world built from that map. The world\nholds the warehouse only; the robots a run uses are created in Gazebo\nwhen the run starts. These tests pin the pieces that make that work\nwithout a running Gazebo:\n\n  * the one config loads, and its map, orders and fleet agree\n  * switching maps rewrites only the map and fleet lines of the config\n  * the robot create/remove plan makes Gazebo show exactly the fleet\n  * the create request is well-formed for the gz command line"},{"path":"src/simulation_env/test/test_order_limit_run.py","size":6545,"symbols":[{"name":"run_workload","line":32,"kind":"function","doc":"One headless run with a dataset; returns (stdout, run directory)."},{"name":"read","line":52,"kind":"function","doc":""},{"name":"five","line":57,"kind":"function","doc":"5 orders, with every effective condition set away from the config."},{"name":"test_a_limited_run_executes_exactly_the_first_n_orders","line":68,"kind":"function","doc":""},{"name":"test_run_json_records_what_was_really_run","line":81,"kind":"function","doc":""},{"name":"test_metrics_and_dataset_agree_on_the_order_count","line":98,"kind":"function","doc":""},{"name":"test_a_limit_above_the_workload_runs_every_order","line":108,"kind":"function","doc":"And names the same run as no limit at all."},{"name":"calls","line":137,"kind":"function","doc":"Every call to ``name`` in a Python file, as ast.Call nodes."},{"name":"test_ros_and_headless_select_orders_the_same_way","line":150,"kind":"function","doc":""},{"name":"test_the_node_has_an_order_limit_defaulting_to_all","line":156,"kind":"function","doc":""},{"name":"test_the_node_records_its_effective_conditions","line":166,"kind":"function","doc":""},{"name":"test_the_launch_keeps_existing_commands_working","line":177,"kind":"function","doc":"orders:=true still switches the workload on; order_limit is new."}],"imports":["ast","json","subprocess","sys","pathlib: Path","pytest","mrta_core.orders: load_orders_csv, select_orders"],"summary":"A run on fewer orders: what it executes, and what it records.\n\nThe headless runner (``--orders N``) and the ROS node\n(``order_limit:=N``) run the first N logical orders through the same\nselect_orders(), and every recorded run says what it really ran:\nrun.json carries the effective order count, seed, robots, strategy,\nspeed and dispatch quantum, and two different conditions never share a\nrun_id. rclpy is not available to these tests, so the ROS side is\nchecked in its source: the parameter, the shared rule and the manifest\narguments."},{"path":"src/simulation_env/test/test_paired_seeds.py","size":6692,"symbols":[{"name":"script","line":28,"kind":"function","doc":""},{"name":"test_seed_42_reproduces_the_committed_reference_workload","line":42,"kind":"function","doc":""},{"name":"test_a_seed_always_writes_the_same_workload_and_seeds_differ","line":50,"kind":"function","doc":""},{"name":"test_the_first_n_orders_of_a_workload_are_the_workload_of_n","line":60,"kind":"function","doc":""},{"name":"test_the_workload_index_names_each_file_and_its_hash","line":69,"kind":"function","doc":""},{"name":"test_every_strategy_runs_every_seed_when_paired","line":80,"kind":"function","doc":""},{"name":"test_interval_is_the_paired_t_interval","line":99,"kind":"function","doc":""},{"name":"test_one_pair_has_no_interval","line":108,"kind":"function","doc":""},{"name":"row","line":112,"kind":"function","doc":""},{"name":"test_differences_are_strategy_minus_baseline_per_seed","line":123,"kind":"function","doc":""},{"name":"test_pairs_that_ran_different_workloads_are_refused","line":139,"kind":"function","doc":""},{"name":"test_a_seed_run_twice_is_refused","line":146,"kind":"function","doc":""},{"name":"test_a_paired_experiment_shares_one_workload_per_seed","line":156,"kind":"function","doc":"Two strategies, two seeds, real headless runs of a few orders."}],"imports":["csv","importlib.util","json","subprocess","sys","pathlib: Path","pytest","simulation_env.paired: PairingError, interval, paired_differences"],"summary":"Paired workload seeds: one workload per seed, shared by every strategy.\n\ndocs/DECISIONS.md, \"Workload Seeds and Paired Comparison\". The workload\nfiles are deterministic and seed 42 reproduces the committed reference;\nevery strategy of one seed runs the same file; the paired statistics\nare the textbook paired t-interval and refuse pairs that ran different\nworkloads."},{"path":"src/simulation_env/test/test_reservation_audit.py","size":5758,"symbols":[{"name":"overlaps","line":24,"kind":"function","doc":""},{"name":"all_pairs_audit","line":34,"kind":"function","doc":""},{"name":"random_logs","line":72,"kind":"function","doc":"A tiny world where overlaps and swaps are common on purpose."},{"name":"test_audit_reports_exactly_what_the_all_pairs_scan_reports","line":110,"kind":"function","doc":""},{"name":"test_touching_intervals_are_not_a_conflict","line":127,"kind":"function","doc":""},{"name":"test_a_swap_and_a_shared_cell_are_reported","line":142,"kind":"function","doc":""},{"name":"test_a_long_run_is_audited_in_seconds","line":160,"kind":"function","doc":"40,000 one-way moves: the all-pairs scan needs minutes."},{"name":"start","line":77,"kind":"function","doc":""},{"name":"robot","line":80,"kind":"function","doc":""}],"imports":["random","fractions: Fraction","time: perf_counter","simulation_env.reservations: CellInterval, EdgeInterval, ReservationTable"],"summary":"The reservation audit finds every conflict, and finishes on a long run.\n\nThe audit re-derives the traffic guarantees after a run: no two robots\nhold one cell at once, and no two robots swap across one edge. It used\nto compare every logged move with every other move. After 100 robots\nand 2000 orders that is about 240,000 moves and hours of work, and the\nfinal report waited on it, so a finished run printed nothing.\n\nall_pairs_audit() below is that original scan, kept as the reference:\nthe audit must report exactly what it reports, in the same order."},{"path":"src/simulation_env/test/test_run_metrics.py","size":3047,"symbols":[{"name":"saturated","line":20,"kind":"function","doc":""},{"name":"test_metrics_are_the_runs_own_numbers","line":25,"kind":"function","doc":""},{"name":"test_time_out_of_the_fleet_counts_each_request_once","line":50,"kind":"function","doc":"A request that waited and then charged is one span, not two."},{"name":"test_metrics_are_written_as_json","line":78,"kind":"function","doc":""}],"imports":["json","pytest","simulation_env.run_metrics: run_metrics, write_metrics","test_charger_evacuation: SATURATED, run","test_charger_evacuation: config","test_charger_evacuation: warehouse"],"summary":"metrics.json reports exactly what the run did.\n\nrun_metrics() gathers a finished run's results into one dict so an\nexperiment can be compared and plotted without reading terminal output.\nEvery number must be the run's own: the same totals the final report\nprints, the same counters the executor kept."},{"path":"src/simulation_env/test/test_s0_window.py","size":17221,"symbols":[{"name":"config","line":55,"kind":"function","doc":""},{"name":"warehouse","line":60,"kind":"function","doc":""},{"name":"one_robot","line":64,"kind":"function","doc":"A single-robot fleet at a controlled SOC. Never shipped."},{"name":"executor_for","line":72,"kind":"function","doc":"An executor whose queue is exactly ``order_ids``, in that order.\n\nThe FIFO sequence is the CSV sequence, so passing the ids in a\nchosen order is how a controlled head-of-queue case is built.\nOrders carry their own lifecycle status, so each executor gets fresh\ncopies loaded from disk."},{"name":"completed","line":107,"kind":"function","doc":"Completed order ids, in the order they actually completed."},{"name":"test_a_feasible_workload_completes_when_the_fifo_head_is_ineligible","line":123,"kind":"function","doc":"The order behind an ineligible head must not be hidden.\n\nrobot_001 at 14% can afford CHEAP but not DEAR. With DEAR at the\nhead of a strict prefix window the allocator sees only DEAR, returns\nnothing, and the run stalls at t=0 with both orders pending -- even\nthough the fleet can finish both: take CHEAP, charge, take DEAR.\n\nThis is the stall that the FIFO liveness rule exists to remove."},{"name":"test_the_same_workload_completes_when_the_cheap_order_leads","line":150,"kind":"function","doc":"The control: same robot, same SOC, same orders, order swapped.\n\nThis is what makes the case above a defect rather than an infeasible\nworkload. Nothing about the fleet or the energy changes -- only the\nCSV sequence -- and the run completes."},{"name":"test_the_legacy_window_still_stalls_on_the_same_workload","line":168,"kind":"function","doc":"The defect, kept reproducible under the pre-S0 rule.\n\n``window=\"legacy\"`` restores ``min(available_robots, pending)`` with\nno liveness extension, which is what the frozen pre-S0 baselines\nwere measured under. The stall is therefore expected here, and this\ntest is what proves the candidate window is the thing that fixed it\nrather than some unrelated change in routing or battery behaviour."},{"name":"test_a_lone_free_robot_is_offered_the_whole_window","line":194,"kind":"function","doc":"W = fleet_size, not the number of robots that happen to be free.\n\nThis is the whole point of S0. One robot free out of a fleet of 22\nis the common case under continuous dispatch, and under the legacy\nrule that robot was offered exactly one order -- so Random,\nHungarian and MILP all returned the same pair and no strategy\ncomparison meant anything.\n\nNote that ``fleet_size`` is the *configured* fleet, so a one-robot\nfleet legitimately has a window of one. The width follows the fleet,\nnot the free pool."},{"name":"test_the_legacy_window_gives_a_lone_robot_no_choice","line":217,"kind":"function","doc":"The same fleet and queue under the pre-S0 rule: one order."},{"name":"full_queue","line":229,"kind":"function","doc":""},{"name":"run_full","line":233,"kind":"function","doc":"The shipped 100-order workload, 22 robots, one window mode."},{"name":"forced","line":259,"kind":"function","doc":"Decisions with exactly one robot and one order on the table."},{"name":"test_the_legacy_window_leaves_almost_every_decision_forced","line":269,"kind":"function","doc":"P0-1, pinned: 62 of 71 decisions on the 100-order workload.\n\nThis is the measurement the candidate window exists to fix, and the\nnumber quoted in docs/ARCHITECTURE.md section 12. A forced decision\nis one every strategy answers identically, so under this rule 87% of\nthe workload could not tell two strategies apart."},{"name":"test_the_fleet_size_window_leaves_almost_no_decision_forced","line":285,"kind":"function","doc":"The same workload with W = fleet_size: 1 forced decision of 64.\n\nThe one that remains is the tail of the queue, where fewer than two\norders are left to choose between. Nothing else about the run\nchanges: same routing, same traffic, same battery."},{"name":"test_the_legacy_window_reproduces_the_pre_s0_baseline","line":300,"kind":"function","doc":"The frozen pre-S0 100-order baseline, bit-identical.\n\nMeasured 2026-09-13 and unchanged through Battery V1 B0-B5. Keeping\nit reproducible is why ``legacy`` exists: it is the anchor proving\nthat S0 changed the allocation window and nothing else.\n\nSee docs/DECISIONS.md, \"Baseline Re-Freeze Policy\"."},{"name":"test_the_window_is_always_a_fifo_prefix","line":321,"kind":"function","doc":"Widening offers more orders; it never reorders the queue."},{"name":"run_full_quantum","line":345,"kind":"function","doc":""},{"name":"robots_per_decision","line":370,"kind":"function","doc":""},{"name":"test_a_zero_quantum_is_exactly_continuous_dispatch","line":374,"kind":"function","doc":"The default must not change anything. 0 means 0."},{"name":"test_the_quantum_batches_robots_into_one_decision","line":389,"kind":"function","doc":"Mean robots per decision rises, which is the whole point.\n\nContinuous dispatch averages 1.56 robots per decision on this\nworkload; a 3 s quantum averages 3.03 and makes 25 of 33 decisions\ncarry a choice on the robot side. Without that, Hungarian and MILP\nare argmin and cannot be shown distinct from greedy nearest."},{"name":"test_the_quantum_never_drops_or_duplicates_work","line":413,"kind":"function","doc":"Holding a robot is a delay, never a change of ownership."},{"name":"test_no_robot_is_held_longer_than_one_quantum","line":427,"kind":"function","doc":"The liveness bound, checked where it is decided.\n\nThe window opens on the robot that has been free longest. Measured\nfrom the latest arrival instead, a steady trickle of freed robots\ncould postpone a decision for the whole run; measured from the\noldest, every robot is dispatched within one quantum of becoming\nfree however busy the fleet is.\n\nChecked directly on the rule rather than inferred from a run: gaps\nbetween decisions in a finished run legitimately exceed the quantum\nwhenever nothing was free to dispatch."},{"name":"test_nothing_is_held_when_holding_cannot_pay","line":465,"kind":"function","doc":"The three refusals, each of which would otherwise waste a quantum."},{"name":"test_the_quantum_is_deterministic","line":491,"kind":"function","doc":"Same quantum, same run, identical output."},{"name":"test_a_negative_quantum_is_rejected","line":501,"kind":"function","doc":""}],"imports":["dataclasses: replace","fractions: Fraction","pathlib: Path","pytest","mrta_core.order_queue: OrderQueue","mrta_core.orders: OrderStatus, load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor","task_management.allocation_strategy: get_batch_strategy"],"summary":"S0: the allocation candidate window and the FIFO liveness rule.\n\nTwo separate defects live in ``min(available_robots, pending)``:\n\n1. *No choice.* The window is sized by the number of free robots, and\n   under continuous dispatch robots come free one at a time, so 62 of\n   71 allocator calls on the 100-order workload are 1 robot x 1 order.\n   Every strategy returns the same assignment on a 1x1 decision, so no\n   strategy comparison is defensible. Fixed by W = fleet_size.\n\n2. *No liveness.* The window is a strict FIFO prefix, so a head order\n   that no free robot is battery-eligible for hides the feasible orders\n   behind it. The allocator returns nothing, recovery parks the robot\n   because it owes no work, and the run stalls with orders pending.\n   Fixed by extending the window down the FIFO sequence when the prefix\n   offers no assignable pair at all.\n\nSee docs/DECISIONS.md, \"Allocation Candidate Window\" and \"FIFO Liveness\nRule\", and docs/ARCHITECTURE.md section 12, P0-1.\n\nBoth are infrastructure: the window is identical for every strategy and\nno strategy ever chooses to skip an order."},{"path":"src/simulation_env/test/test_spawn_spread.py","size":3586,"symbols":[{"name":"config","line":26,"kind":"function","doc":""},{"name":"w100","line":31,"kind":"function","doc":""},{"name":"cells","line":41,"kind":"function","doc":""},{"name":"test_ten_robots_are_shared_between_both_banks_and_spaced_out","line":51,"kind":"function","doc":""},{"name":"test_the_default_rule_is_unchanged","line":63,"kind":"function","doc":"robot k on the k-th home cell: the five top rows of both banks."},{"name":"test_spread_gives_distinct_home_cells","line":72,"kind":"function","doc":""},{"name":"test_a_full_fleet_uses_every_cell_either_way","line":79,"kind":"function","doc":""},{"name":"test_an_uneven_split_still_uses_both_banks","line":85,"kind":"function","doc":""},{"name":"test_v2_is_identical_under_both_rules_at_full_fleet","line":91,"kind":"function","doc":""},{"name":"test_reports_agree_with_the_fleet","line":97,"kind":"function","doc":"home_stations must name the cells build_fleet actually used."},{"name":"test_an_unknown_mode_is_refused","line":110,"kind":"function","doc":""}],"imports":["dataclasses: replace","pathlib: Path","pytest","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet, home_bank, home_stations","mrta_core.map_builder: example_layout, write_layout_xlsx"],"summary":"How a fleet smaller than the parking bank is placed at t=0.\n\nThe default (\"home\") puts robot k on the k-th home cell in id order,\nwhich is what every frozen baseline uses. \"spread\" exists for fleet-size\nsweeps on one map: without it, 10 robots on a 100-cell bank start bunched\nin one corner, so the start condition changes in kind across the sweep.\n\nParking at the end of work is not affected either way: it is always the\nnearest free cell (test_stage_parking and friends)."},{"path":"src/simulation_env/test/test_stage_parking.py","size":8773,"symbols":[{"name":"manhattan","line":39,"kind":"function","doc":""},{"name":"config","line":44,"kind":"function","doc":""},{"name":"warehouse","line":49,"kind":"function","doc":""},{"name":"workload","line":54,"kind":"function","doc":"One 100-order run of the real fleet, shared by the slow tests."},{"name":"ranked_zones","line":80,"kind":"function","doc":"Every bank cell from ``cell``, cheapest legal route first."},{"name":"test_nearest_free_stage_is_chosen_by_directed_astar","line":96,"kind":"function","doc":"Directed route cost decides, not Manhattan distance."},{"name":"test_occupied_stage_forces_the_next_cheapest","line":124,"kind":"function","doc":"A claimed bank cell is skipped, and only for the next cheapest."},{"name":"test_two_returning_robots_cannot_claim_the_same_stage","line":152,"kind":"function","doc":"One batch, one cheapest cell, two robots: they must split."},{"name":"test_claims_are_exclusive_across_separate_batches","line":180,"kind":"function","doc":"A reservation survives, so a later batch cannot take it."},{"name":"test_released_claim_returns_to_the_pool","line":196,"kind":"function","doc":"A return mission that never planned must not hold the cell."},{"name":"test_robot_id_only_breaks_an_exact_tie","line":211,"kind":"function","doc":"Identity carries no parking priority.\n\nTwo robots standing on the same cell are indistinguishable on every\nmeaningful value, so the tie has to fall to the id -- and that is\nthe only situation in which it may."},{"name":"test_robot_does_not_necessarily_return_to_its_spawn_stage","line":239,"kind":"function","doc":"Spawn position confers no title to a bank cell."},{"name":"test_every_robot_ends_on_a_unique_stage_zone","line":258,"kind":"function","doc":"22 robots, 22 bank cells, no double occupancy."},{"name":"test_parking_never_touches_order_ownership","line":273,"kind":"function","doc":"Every order still completed, and none changed hands to park."}],"imports":["pathlib: Path","pytest","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet, home_stations","simulation_env.stage_parking: StageParking","simulation_env.workload_executor: WorkloadExecutor","task_management.allocation_strategy: get_batch_strategy"],"summary":"Final parking: the Stage Zone bank is a shared fleet resource.\n\nThese pin the policy, not an implementation detail: a robot's spawn\ncell buys it nothing, the cell it ends on is the cheapest *free* one by\ndirected A*, and two robots can never be sent to the same cell.\n\nThe real V2 map is used deliberately. The whole point of the policy is\nthat the legal one-way route, not the straight-line distance, decides\nwhich bank cell is nearest, and only a real warehouse shows that."},{"path":"src/simulation_env/test/test_stage_promotion.py","size":11127,"symbols":[{"name":"trips","line":30,"kind":"function","doc":"Every terminal trip of the run, current and historical, once."},{"name":"events","line":41,"kind":"function","doc":""},{"name":"stage_only","line":48,"kind":"function","doc":""},{"name":"mixed","line":54,"kind":"function","doc":""},{"name":"lowest_on_stage","line":61,"kind":"function","doc":""},{"name":"out_of_reach","line":67,"kind":"function","doc":""},{"name":"scenarios","line":72,"kind":"function","doc":""},{"name":"test_every_stage_zone_robot_charges_and_rejoins","line":86,"kind":"function","doc":"Saturation is recovered: nobody stays on the Stage Zone."},{"name":"test_a_promoted_robot_gives_its_stage_zone_back","line":127,"kind":"function","doc":"The claim is released, and parking at the end stays unique."},{"name":"test_holding_and_stage_zone_robots_wait_in_one_queue","line":153,"kind":"function","doc":""},{"name":"test_each_promotion_takes_the_lowest_soc_waiting_robot","line":164,"kind":"function","doc":"Lowest SOC first, over holding and Stage Zone robots together."},{"name":"test_a_lower_soc_stage_zone_robot_goes_before_holding_robots","line":190,"kind":"function","doc":""},{"name":"test_a_stage_zone_robot_drives_the_directed_astar_route","line":204,"kind":"function","doc":""},{"name":"test_a_charger_out_of_reach_is_never_offered","line":230,"kind":"function","doc":"Too little charge for any free charger: keep waiting, never strand."},{"name":"test_no_promoted_robot_arrives_flat","line":252,"kind":"function","doc":""},{"name":"test_no_waiting_robot_is_left_beside_a_free_charger_it_can_reach","line":259,"kind":"function","doc":"Liveness: (FREE charger, waiting robot) never survives a tick."},{"name":"test_charger_reservations_stay_exclusive","line":283,"kind":"function","doc":"One robot per charger and one charger per robot, at every instant."},{"name":"test_traffic_stays_safe","line":303,"kind":"function","doc":"No shared cell and no head-on swap, Stage Zone exits included."},{"name":"test_stage_zone_promotion_is_deterministic","line":310,"kind":"function","doc":""},{"name":"trace","line":313,"kind":"function","doc":""}],"imports":["fractions: Fraction","pytest","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_routing: best_path_to_zone, non_transit_cells","simulation_env.charging: ChargeState, ResourceState","test_charger_evacuation: TWELVE, run, warehouse_type","test_charger_evacuation: config","test_charger_evacuation: warehouse"],"summary":"Battery V1, B5: Stage Zone robots are promoted like holding robots.\n\nWhen every charger and holding cell is taken, a robot asking to charge\nwaits on a Stage Zone (saturation). It used to stay there for the rest\nof the run, even after chargers freed: at 100 robots that took 36\nrobots out of the fleet for good. Now it waits in the same queue as the\nholding robots -- lowest SOC, earliest request, robot_id only as the\nfinal tie-break -- and is promoted onto a FREE charger it can reach on\nits present SOC, by the directed A* route from its Stage Zone cell.\n\nFrozen policy: docs/DECISIONS.md, \"Stage Zone Promotion\". Nothing here\nchanges routing, traffic, the order schema or the allocator."},{"path":"src/simulation_env/test/test_traffic_rotation.py","size":9583,"symbols":[{"name":"intent","line":39,"kind":"function","doc":""},{"name":"ring","line":49,"kind":"function","doc":"One robot per cell, each wanting the next cell round the ring."},{"name":"resolve","line":63,"kind":"function","doc":""},{"name":"test_a_full_ring_rotates","line":70,"kind":"function","doc":""},{"name":"test_a_ring_member_beats_a_higher_priority_outsider","line":77,"kind":"function","doc":"The W100 stall, reduced: an outsider closer to its goal wants the\ncell a ring member rotates into."},{"name":"test_the_traced_w100_stall_now_rotates","line":95,"kind":"function","doc":"The eight intents traced at t=450.67 (hungarian, 100 robots)."},{"name":"test_two_independent_rings_rotate_in_one_batch","line":117,"kind":"function","doc":""},{"name":"test_contention_outside_any_loop_is_unchanged","line":128,"kind":"function","doc":"A chain C -> B -> A -> free cell, and an outsider for that cell.\n\nNo loop, so the plain rule decides: the outsider (closer) wins and\nthe whole chain waits, exactly as before the rotation rule."},{"name":"test_a_ring_with_a_robot_not_moving_never_rotates","line":156,"kind":"function","doc":"One ring cell is held by a robot outside the batch: servicing,\ncharging, mid-transit or otherwise stationary. Nobody may enter its\ncell, so nothing in the ring moves."},{"name":"test_a_robot_required_to_side_step_is_never_a_member","line":172,"kind":"function","doc":""},{"name":"test_a_holder_leaving_another_cell_does_not_close_a_loop","line":187,"kind":"function","doc":"A robot holding two cells (mid-transit) is not vacating the one\nasked for, so a loop through it is not a rotation."},{"name":"test_a_two_robot_swap_is_still_a_head_on_conflict","line":204,"kind":"function","doc":""},{"name":"test_decisions_do_not_depend_on_intent_order","line":214,"kind":"function","doc":""},{"name":"table_with","line":228,"kind":"function","doc":""},{"name":"test_the_reservation_table_accepts_a_valid_rotation","line":238,"kind":"function","doc":""},{"name":"test_the_reservation_table_rejects_a_rotation_through_a_stationary_robot","line":254,"kind":"function","doc":""},{"name":"test_the_reservation_table_rejects_a_two_robot_swap","line":263,"kind":"function","doc":""}],"imports":["random","fractions: Fraction","pytest","simulation_env.local_traffic_controller: LocalTrafficController, MovementIntent, TrafficDecision","simulation_env.reservations: ReservationTable"],"summary":"Rotation right-of-way: a full ring moves as one, never deadlocks.\n\nA loop of robots, each wanting the cell the next one is leaving, can\nall move in the same instant. Before this rule the controller could\nhand one ring cell to a higher-priority robot from outside the ring;\nthen the ring could not move, so the outsider's target was never\nvacated, and the identical decision repeated forever (W100, 6-cell\nring; V2, 4-cell rotary). docs/DECISIONS.md, \"Rotation Right-of-Way\".\n\nWhat is pinned here:\n\n  * a 4-cell and a 6-cell ring rotate, even against a higher-priority\n    outsider, and the outsider waits\n  * two independent rings rotate in one batch\n  * contention outside any loop is decided exactly as before\n  * a ring with a robot not moving in this batch never rotates\n  * a two-robot swap is still a head-on conflict, not a rotation\n  * the reservation table accepts a valid rotation and rejects an\n    invalid one: it stays the authority on safety"},{"path":"src/simulation_env/test/test_work_accounting.py","size":13507,"symbols":[{"name":"PerRobotAccounting","line":63,"kind":"class","doc":"WorkAccounting that also keeps each robot's own phase totals.\n\nThe production meter only keeps fleet totals; this spy adds the\nper-robot view and the transition log, so the partition can be\nchecked robot by robot. It changes nothing the executor reads."},{"name":"config","line":94,"kind":"function","doc":""},{"name":"warehouse","line":99,"kind":"function","doc":""},{"name":"run","line":103,"kind":"function","doc":"One recorded run of the reference workload, with the spy meter."},{"name":"busy","line":141,"kind":"function","doc":"100 orders; the four low robots charge while orders are owed."},{"name":"tail","line":148,"kind":"function","doc":"5 orders, all allocated at t=0: the four low robots charge in recovery."},{"name":"scenario","line":155,"kind":"function","doc":""},{"name":"metrics","line":159,"kind":"function","doc":""},{"name":"final_counters","line":163,"kind":"function","doc":""},{"name":"at","line":172,"kind":"function","doc":""},{"name":"test_a_robot_starts_in_support","line":176,"kind":"function","doc":""},{"name":"test_an_order_mission_is_productive_and_returns_what_it_spent","line":184,"kind":"function","doc":""},{"name":"test_an_idle_robot_enters_recovery_at_exhaustion","line":196,"kind":"function","doc":""},{"name":"test_a_robot_mid_order_at_exhaustion_enters_recovery_when_it_retires","line":212,"kind":"function","doc":""},{"name":"test_split_closes_open_segments_without_advancing_the_meter","line":231,"kind":"function","doc":""},{"name":"test_phases_partition_every_counter_over_the_fleet","line":249,"kind":"function","doc":""},{"name":"test_phases_partition_every_counter_per_robot","line":267,"kind":"function","doc":""},{"name":"test_phase_totals_is_read_only","line":286,"kind":"function","doc":""},{"name":"test_every_robot_ends_in_recovery_and_never_leaves_it","line":292,"kind":"function","doc":""},{"name":"test_productive_totals_are_the_outcome_rows","line":313,"kind":"function","doc":"One calculation: the run's order work is its outcome rows."},{"name":"test_order_makespan_is_the_final_drop_off","line":335,"kind":"function","doc":""},{"name":"test_version_1_fields_keep_their_values","line":354,"kind":"function","doc":""},{"name":"test_metric_phase_fields_add_up_to_the_totals","line":367,"kind":"function","doc":""},{"name":"test_charging_while_orders_are_owed_is_support","line":381,"kind":"function","doc":""},{"name":"test_charging_after_the_last_order_is_recovery_not_order_work","line":393,"kind":"function","doc":""},{"name":"register","line":75,"kind":"function","doc":""},{"name":"_enter","line":79,"kind":"function","doc":""}],"imports":["dataclasses: dataclass, field, replace","fractions: Fraction","pathlib: Path","pytest","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env: workload_executor","simulation_env.battery_ledger: fleet_summary","simulation_env.dataset: RunRecorder","simulation_env.fleet: build_fleet","simulation_env.run_metrics: METRICS_SCHEMA_VERSION, run_metrics","simulation_env.work_accounting: PRODUCTIVE, RECOVERY, ROBOT_COUNTERS, SUPPORT, WorkAccounting","task_management.allocation_strategy: get_batch_strategy"],"summary":"Order work and end-of-work recovery are measured apart (B6a).\n\ndocs/DECISIONS.md, \"End of Workload\": parking and charging after the\nfinal order must not change ``order_makespan``, and must not be booked\nto a strategy as if it were order work. WorkAccounting puts every robot\nin exactly one phase at every instant -- support, productive or\nrecovery -- and run_metrics reports each phase's share of the run.\n\nWhat has to hold, and is checked here on real runs with the battery on:\n\n    partition     support + productive + recovery is each counter's run\n                  total, per robot and over the fleet\n    one number    the productive totals are the sum of the outcome rows\n    makespan      order_makespan is the final drop-off; recovery only\n                  lengthens fleet_recovery_time"},{"path":"src/simulation_env/worlds/warehouse.world","size":419541,"symbols":[],"imports":[]},{"path":"src/task_management/package.xml","size":581,"symbols":[],"imports":[]},{"path":"src/task_management/resource/task_management","size":0,"symbols":[],"imports":[]},{"path":"src/task_management/setup.cfg","size":99,"symbols":[],"imports":[]},{"path":"src/task_management/setup.py","size":793,"symbols":[],"imports":["os","glob: glob","setuptools: find_packages, setup"],"summary":""},{"path":"src/task_management/task_management/__init__.py","size":0,"symbols":[],"imports":[],"summary":""},{"path":"src/task_management/task_management/allocation_strategy.py","size":33402,"symbols":[{"name":"OrderAssignment","line":35,"kind":"class","doc":"One robot-order pairing, with the route the allocator predicted."},{"name":"greedy_pairing","line":52,"kind":"function","doc":"Take pairs in the order given, skipping what is already taken.\n\nEvery strategy in this module is this same sweep over a different\nordering. Keeping the sweep in one place is what makes the\ncomparison controlled: two strategies then differ by their ranking\nand by nothing else -- not by how they resolve a conflict, not by\nhow many pairs they emit, not by what they do when one side runs\nout.\n\n``ordered`` must already be filtered to eligible candidates and\nsorted (or shuffled) by the strategy's own policy. The sweep itself\nnever reorders it, so a strategy's ranking is fully visible in the\nstrategy."},{"name":"register_batch","line":107,"kind":"function","doc":""},{"name":"get_batch_strategy","line":112,"kind":"function","doc":""},{"name":"BatchAllocationStrategy","line":121,"kind":"class","doc":"Pairs available robots with eligible orders.\n\nOne call is one allocation decision. The caller supplies:\n\n  warehouse       grid + zone state, for grid-aware costing\n  robots          (robot_id, cell) for every AVAILABLE robot\n  orders          the candidate window: the FIFO prefix the\n                  executor offers, sized by allocation.window\n                  (W = fleet_size by default) and extended down\n                  the queue when the prefix holds no assignable\n                  pair at all. Sizing is infrastructure -- see\n                  docs/DECISIONS.md, \"Allocation Candidate Window\"\n                  -- and is identical for every strategy\n  fifo_position   order_id -> FIFO in"},{"name":"NearestAStarAllocator","line":197,"kind":"class","doc":"Greedy minimum static-A*-cost pairing.\n\nC_static(r, o) is the shortest static grid route taking robot r\nfrom where it stands, through every shelf of order o in the best\nvisiting order, to o's drop-off. Grid distance through the aisle\nnetwork -- never Euclidean, never a straight line through racking.\n\nPairing is greedy and deterministic:\n\n  1. take the cheapest remaining (robot, order) pair\n  2. assign it\n  3. drop that robot and that order\n  4. repeat until one side runs out\n\nGreedy is not optimal -- the Hungarian assignment would be, and is\na later milestone. It is stated here as the baseline it is.\n\nTies break on (cost, order FIFO position, robot_id), so an equal\ncost always resolves to th"},{"name":"NearestManhattanAllocator","line":261,"kind":"class","doc":"Greedy pairing on Manhattan distance. Deliberately naive.\n\nThe experimental control for grid-awareness. It ranks pairs by the\nManhattan chain robot -> shelves -> drop-off, which ignores racking,\nwalls and lane direction entirely, and then drives the same directed\nA* route every other strategy drives.\n\nThat split is the whole point and it is not negotiable:\n\n    Manhattan decides WHICH robot takes which order\n    directed A* decides HOW the robot gets there\n\nSo this strategy changes allocation and nothing else. Route, traffic,\nbattery drain, service and speed are identical to nearest_astar's,\nwhich is what makes an outcome difference attributable to the\nallocation decision rather than to the "},{"name":"RandomAllocator","line":349,"kind":"class","doc":"Uniformly random pairing among eligible pairs.\n\nThe lower bound. It answers the question every allocation result has\nto answer first: is this strategy better than no policy at all?\n\nRandom here means random *allocation*, not random behaviour. It is\nstill bound by every constraint the others are: only eligible pairs,\nat most one order per robot, the same candidate window, the same\nroutes, the same traffic and battery infrastructure. The only thing\nit discards is the ranking.\n\nDeterminism is a requirement, not a contradiction. The stream is\nseeded, and the candidates are sorted into a canonical order before\nthey are shuffled, so the result never depends on dict iteration\norder. The same seed a"},{"name":"_eligible","line":427,"kind":"function","doc":""},{"name":"_require_timing","line":437,"kind":"function","doc":""},{"name":"_canonical","line":447,"kind":"function","doc":"Robots and orders of the candidates, in a fixed order.\n\nRobots by id, orders by FIFO position: the matrix an optimizer sees\nnever depends on dict or set iteration order."},{"name":"earliest_finish_pairing","line":461,"kind":"function","doc":"Greedy on estimated finish time: travel + service."},{"name":"EarliestFinishAllocator","line":473,"kind":"class","doc":"Greedy minimum estimated completion time.\n\nFor each eligible pair, the time from now until the order would be\nfinished, using only what is known at the decision:\n\n    directed A* route length (C_static) / the robot's speed\n  + configured shelf service x the number of shelf visits\n  + configured drop-off service\n\nEvery robot offered to a decision is free now, so they all start\nnow. Traffic waiting is a realized outcome and is never included\n(docs/DECISIONS.md, \"Decision-Time Features\").\n\nPairing is the shared greedy sweep, ranked by that estimate; ties on\n(C_static, FIFO position, robot_id). It differs from nearest_astar\nexactly where service time changes the order: an order with more\nshelves"},{"name":"_normalised","line":538,"kind":"function","doc":"Min-max to [0, 1] within one decision; all equal -> all 0."},{"name":"multi_criteria_scores","line":549,"kind":"function","doc":"Weighted sum of decision-time criteria, lower is better.\n\nEach criterion is min-max normalised over this decision's eligible\npairs, so the weights trade relative positions, not units:\n\n    finish             estimated travel + service time   lower\n    fifo_age           FIFO position of the order         lower\n    energy_margin      SOC left above the requirement     higher\n    charger_distance   directed A* leg to a charger\n                       from where the mission ends        lower\n\nWithout battery features the two battery criteria drop out and the\nremaining weights are rescaled to the same total."},{"name":"MultiCriteriaGridAwareAllocator","line":594,"kind":"class","doc":"Greedy on a weighted score of grid-aware decision-time criteria.\n\nWhere nearest_astar and earliest_finish rank on one number, this\ntrades several the operator cares about: how soon the order is done\n(directed A* travel + service), how long the order has waited (FIFO\nage), how much battery the robot keeps, and whether the mission\nends near a charger (directed A*). Every criterion is known at the\ndecision; none is a realized outcome. Weights default to\nMULTI_CRITERIA_WEIGHTS and are a constructor argument.\n\nPairing is the shared greedy sweep ranked by the score; ties on\n(estimated finish, C_static, FIFO position, robot_id)."},{"name":"auction_pairing","line":660,"kind":"function","doc":"Sequential single-item auction in FIFO order.\n\nOrders are put up one at a time, oldest first. Every robot still\nunassigned bids its marginal cost for the order -- the route length\nit would add to its plan, which, holding no other order, is\nC_static -- and the lowest bid wins (ties: lower robot_id). An order\nno remaining robot can take is passed over."},{"name":"AuctionAllocator","line":692,"kind":"class","doc":"Market-based allocation: a sequential single-item auction.\n\nOrders are auctioned one at a time in FIFO order, the way a\nmarket-based dispatcher announces tasks as they arrive (MURDOCH,\nGerkey and Mataric 2002). Each free robot bids its marginal cost:\nthe directed A* route length the order would add to its plan.\n\nWhy FIFO announcement and not rounds. In the round-based variant\nevery robot bids on every open order and the globally cheapest bid\nwins each round. A robot here holds at most one order per decision,\nso its marginal cost for any order is that order's C_static, and the\nround-based auction reduces exactly to nearest_astar's greedy sweep.\nThe same behaviour under a second name is not a "},{"name":"hungarian_pairing","line":738,"kind":"function","doc":"Maximum matching of minimum total C_static.\n\nFirst as many pairs as the eligibility mask allows, then, among all\nmatchings of that size, the one with the smallest summed route\nlength. Ineligible pairs carry a cost larger than any feasible\nmatching can reach, so the solver never trades a pair away to save\ndistance."},{"name":"_min_total_matching","line":756,"kind":"function","doc":"Maximum-cardinality matching of minimum summed weight."},{"name":"HungarianAllocator","line":778,"kind":"class","doc":"Optimal assignment: minimum total route length, per decision.\n\nThe Hungarian method (Kuhn 1955; scipy's linear_sum_assignment)\nover the decision's eligible pairs: the matching with the most pairs\nthe mask allows and, among those, the least summed C_static. Where\nnearest_astar is greedy and can lock a robot into a cheap pair that\nforces an expensive one elsewhere, this minimises the sum.\n\nIt optimises one decision at a time, not the workload: the window,\nthe free robots and the timing of decisions are infrastructure and\nthe same for every strategy. When a decision offers one free robot,\nevery minimum-cost rule picks the same pair, so its difference from\nnearest_astar shows only in decisions w"},{"name":"milp_pairing","line":820,"kind":"function","doc":"Minimum batch makespan, then minimum total finish time.\n\nx_e in {0, 1} for every eligible pair e, z >= 0 continuous:\n\n    stage 1   minimise  z\n              s.t.      sum of x over each robot              \u003c= 1\n                        sum of x over each order              \u003c= 1\n                        sum of all x                          =  K\n                        sum of finish_e * x_e over a robot    \u003c= z\n                        sum of finish_e * x_e over an order   \u003c= z\n\n    stage 2   minimise  sum of finish_e * x_e\n              s.t.      the same, and z \u003c= z* (stage 1 optimum)\n\nA robot and an order each hold at most one pair, so each of the last\ntwo sums is the finish time of that robo"},{"name":"MILPAllocator","line":930,"kind":"class","doc":"Mixed-integer program: minimise the decision's makespan.\n\nA different objective from the Hungarian method, not a different\nsolver for the same one. Hungarian minimises the *sum* of route\nlengths; this minimises the *latest* estimated finish among the\npairs it makes (a bottleneck objective, which a linear assignment\ncannot express), and only then the total estimated finish time. It\naccepts a longer total to bring the slowest mission of the batch in\nearlier.\n\nEstimated finish is DecisionTiming.finish_s (directed A* travel +\nservice), the same estimate earliest_finish ranks on. The\nformulation is in milp_pairing. With one free robot in a decision\nthe bottleneck is that robot's own mission, so i"},{"name":"zone_sequence","line":47,"kind":"function","doc":"Zones the executor must drive, in order."},{"name":"__init__","line":157,"kind":"function","doc":""},{"name":"reset","line":161,"kind":"function","doc":"Reset any per-trial internal state."},{"name":"score","line":164,"kind":"function","doc":"Cost every (robot, order) pair. Shared by every strategy."},{"name":"assign","line":178,"kind":"function","doc":""},{"name":"explain","line":190,"kind":"function","doc":""},{"name":"assign","line":227,"kind":"function","doc":""},{"name":"explain","line":252,"kind":"function","doc":""},{"name":"assign","line":297,"kind":"function","doc":""},{"name":"explain","line":338,"kind":"function","doc":""},{"name":"reset","line":371,"kind":"function","doc":""},{"name":"assign","line":376,"kind":"function","doc":""},{"name":"explain","line":404,"kind":"function","doc":""},{"name":"assign","line":498,"kind":"function","doc":""},{"name":"explain","line":515,"kind":"function","doc":""},{"name":"__init__","line":611,"kind":"function","doc":""},{"name":"assign","line":621,"kind":"function","doc":""},{"name":"explain","line":650,"kind":"function","doc":""},{"name":"assign","line":713,"kind":"function","doc":""},{"name":"explain","line":729,"kind":"function","doc":""},{"name":"assign","line":796,"kind":"function","doc":""},{"name":"explain","line":812,"kind":"function","doc":""},{"name":"assign","line":956,"kind":"function","doc":""},{"name":"explain","line":973,"kind":"function","doc":""},{"name":"key","line":319,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","random: Random","numpy","scipy.optimize: Bounds, LinearConstraint, linear_sum_assignment, milp","scipy.sparse: coo_matrix","mrta_core.battery: EnergyRequirement","task_management.features: DecisionTiming, OrderCandidate, OrderRoute, build_order_candidates, manhattan_order_cost"],"summary":"Batch MRTA allocation strategies for warehouse orders.\n\nFIFO determines which pending orders are eligible.\n\nAn allocation strategy determines only which available robot receives\nwhich eligible order.\n\nTraffic planning, collision avoidance and execution are outside this\nmodule and must never change robot-order ownership."},{"path":"src/task_management/task_management/features.py","size":11559,"symbols":[{"name":"OrderRoute","line":54,"kind":"class","doc":"The best static route for one robot-order pair."},{"name":"order_route_cost","line":72,"kind":"function","doc":"C_static(r, o): the cheapest static route through all shelves.\n\nEvaluates every shelf visiting order and keeps the shortest. An\norder carries 1-3 shelves, so this is at most 3! = 6 candidate\nroutes -- exhaustive, hence genuinely optimal for the sequence,\nwith no heuristic ordering to justify.\n\nRoute length is A* grid distance through the aisle network, never\nEuclidean, and includes the one-cell retreat after each station\nbecause the robot really drives it.\n\nTies between permutations break on the shelf sequence itself, so\nthe chosen route is deterministic."},{"name":"manhattan","line":154,"kind":"function","doc":""},{"name":"manhattan_order_cost","line":158,"kind":"function","doc":"Manhattan chain: start -> every shelf -> drop-off, best order.\n\nMirrors the structure of ``order_route_cost`` -- the same shelf\npermutations, the same chain, the same end point -- so that the only\ndifference between the two is the metric. A strategy ranking on this\ndiffers from one ranking on C_static because of the metric alone,\nwhich is what makes the comparison a controlled one.\n\nReturns ``inf`` when a zone does not exist, matching the\nunreachable convention of ``order_route_cost``. Nothing here can\nmake a pair *eligible*: eligibility is decided by directed A* and\nthe battery mask, and this function is never consulted for it."},{"name":"_single_cell","line":202,"kind":"function","doc":"The one cell of a service zone.\n\nShelf and drop-off zones are single cells on this map. Asserting\nthat here means a multi-cell zone fails loudly rather than silently\npicking an arbitrary cell and making the baseline irreproducible."},{"name":"OrderCandidate","line":223,"kind":"class","doc":"One (robot, order) pair scored by C_static, ready to rank."},{"name":"DecisionTiming","line":251,"kind":"class","doc":"Decision-time timing: robot speeds and the fixed service durations.\n\nBuilt by the executor from the same values the engine executes with\n(each robot's own speed, the configured shelf and drop-off service\ntimes), so a strategy's time estimate and the realized execution\nshare one model. It holds nothing realized: no waiting, no traffic."},{"name":"route_energy","line":284,"kind":"function","doc":"The battery eligibility of one robot for one planned route."},{"name":"build_order_candidates","line":301,"kind":"function","doc":"Score every (robot, order) pair with C_static.\n\n``robots`` is ``(robot_id, cell)`` pairs; ``orders`` is the\neligible FIFO batch; ``fifo_position`` maps order_id -> FIFO index.\nWith ``battery`` every reachable pair also gets its decision-time\nenergy features."},{"name":"reachable","line":63,"kind":"function","doc":""},{"name":"zone_sequence","line":67,"kind":"function","doc":"Zones to visit, in order, excluding the robot's start."},{"name":"reachable","line":237,"kind":"function","doc":""},{"name":"battery_eligible","line":241,"kind":"function","doc":""},{"name":"eligible","line":245,"kind":"function","doc":"A legal assignment: routable, and battery-feasible."},{"name":"travel_s","line":264,"kind":"function","doc":""},{"name":"service_s","line":267,"kind":"function","doc":""},{"name":"finish_s","line":271,"kind":"function","doc":"Estimated time from now to the end of the mission.\n\nDirected A* route length over the robot's speed, plus one shelf\nservice per visited shelf and one drop-off service. Every robot\noffered to a decision is free now, so its start time is now for\nall of them. Traffic waiting is a realized outcome and is never\npart of it."}],"imports":["dataclasses: dataclass","itertools: permutations","math: inf","mrta_core.battery: BatteryDecisionContext, EnergyRequirement","mrta_core.grid: Cell","mrta_core.warehouse_routing: MissionPlan, RouteCache, plan_from_cell"],"summary":"Grid-aware features for batch warehouse MRTA.\n\nThis module contains prediction-time features only.\n\nFor each candidate robot-order pair, C_static(r, o) is the shortest\nstatic A* route from the robot's current cell through every required\nshelf and finally to the order's drop-off.\n\nFor orders with multiple shelves, every shelf permutation is evaluated.\nWith at most three shelves this requires at most 3! = 6 route candidates.\n\nC_static is a geometric prediction. It contains no realized MAPF\nwaiting, reservation conflicts, execution outcomes or future leakage.\n\nWith a battery context each candidate also carries its decision-time\nenergy features (``mrta_core.battery.EnergyRequirement``): the SOC the\nrobot has now, and the energy the chosen static route, its services and\nthe directed-A* leg from the post-dropoff retreat cell to the nearest\ncharger are predicted to cost. Battery eligibility is a hard mask: an\nineligible pair is never a legal assignment for any strategy."},{"path":"src/task_management/test/test_nearest_astar.py","size":11573,"symbols":[{"name":"FakeOrder","line":69,"kind":"class","doc":"The two fields the allocator reads off an order."},{"name":"practice_warehouse","line":78,"kind":"function","doc":"A one-band miniature of the production warehouse.\n\n    y=6  # # # # # # # # # # # # # # # # #\n    y=5  H . . . . . . . . . . . . D . . H\n    y=4  H . . . . . . S . . . . . . . . H\n    y=3  H . . . . . . . . . S . . . . . H\n    y=2  H . . . D . . . . . . . . . . . H\n    y=1  H . . . . . . . . . . . . . . . H\n    y=0  # # # # # # # # # # # # # # # # #\n\nRows alternate one-way (y=1 west, y=2 east, y=3 west, y=4 east,\ny=5 west) and columns alternate (x=3,6,9,12 north; x=5,8,11,14\nsouth; x=4,7,10,13 shelf columns, north within the band). x=1 and\nx=2 are the left frontage lanes, x=15 the right one."},{"name":"west_order","line":129,"kind":"function","doc":""},{"name":"east_order","line":133,"kind":"function","doc":""},{"name":"solo_cost","line":137,"kind":"function","doc":"What one robot standing at ``start`` would pay for one order."},{"name":"test_practice_map_obeys_the_production_lane_policy","line":157,"kind":"function","doc":"The practice map must be a legal warehouse, not just a drawing.\n\nScored through the production policy functions rather than a\nrestatement of the lane rules, so this fails the moment the\nfixture and the real lane policy drift apart."},{"name":"test_nearest_astar_pairs_each_robot_with_its_grid_nearest_order","line":230,"kind":"function","doc":""},{"name":"test_cost_is_grid_distance_not_euclidean","line":265,"kind":"function","doc":"The one-way network must show up in the cost, or A* is not used."},{"name":"test_multi_shelf_order_takes_the_best_visiting_permutation","line":300,"kind":"function","doc":""},{"name":"test_pairing_is_deterministic_across_repeated_calls","line":339,"kind":"function","doc":""},{"name":"__init__","line":72,"kind":"function","doc":""},{"name":"reachable","line":200,"kind":"function","doc":""}],"imports":["math","mrta_core.warehouse_map: WarehouseMap, WarehouseZone, ZoneType","mrta_core.warehouse_routing: directional_blocked_edges, non_transit_cells","mrta_core.world: WorldGrid","task_management.allocation_strategy: get_batch_strategy"],"summary":"Nearest A* picks the expected pairing on a controlled warehouse.\n\nOne focused test file, not a suite: it pins the two things that make\nthe allocator scientific rather than incidental -- that cost is the\nlegal directed route and not a straight line, and that the greedy\npairing is fully determined by the data.\n\nWhy the practice map looks like the real one\n--------------------------------------------\nThe lane policy in ``mrta_core.warehouse_routing`` is written against\nthe production 17-wide layout and reads absolute grid coordinates:\n``EASTBOUND_ROWS``, ``WESTBOUND_ROWS``, ``NORTHBOUND_COLS``,\n``SOUTHBOUND_COLS``, ``SHELF_COLS`` and the frontage lanes are fixed\ncolumn and row numbers, not a description a smaller hall can satisfy.\n\nA map drawn on arbitrary coordinates is therefore not a smaller\nwarehouse -- it is an illegal one. The earlier 9x3 fixture put its\ncells where the policy grants no direction at all (row y=0 has no\neast/west rule, columns 0..2 no north/south rule), so most of it had\nno outgoing edges and the allocator correctly refused to route.\n\n``practice_warehouse`` is instead a genuine one-band slice of the\nproduction map: the same column roles, the same alternating row\ndirections, the same left/right home banks closing the circulation\nloop. ``test_practice_map_obeys_the_production_lane_policy`` asserts\nthat, so this fixture cannot silently rot again."},{"path":"src/task_management/test/test_phase7_strategies.py","size":17426,"symbols":[{"name":"candidate","line":49,"kind":"function","doc":""},{"name":"timing","line":67,"kind":"function","doc":""},{"name":"fifo_of","line":75,"kind":"function","doc":""},{"name":"nearest","line":79,"kind":"function","doc":"nearest_astar's choice: its own sort key, the shared sweep."},{"name":"pairs","line":86,"kind":"function","doc":""},{"name":"energy","line":90,"kind":"function","doc":""},{"name":"test_all_eight_strategies_are_registered_under_distinct_names","line":110,"kind":"function","doc":""},{"name":"test_finish_time_is_travel_plus_service","line":121,"kind":"function","doc":""},{"name":"test_earliest_finish_prefers_the_order_with_fewer_services","line":130,"kind":"function","doc":"10.0 m with 3 shelves finishes later than 10.5 m with 1 shelf.\n\no1  10.0 m / 1.5 + 3 x 1 + 1 = 10.67 s   nearest_astar's pick\no2  10.5 m / 1.5 + 1 x 1 + 1 =  9.00 s   earliest_finish's pick"},{"name":"test_earliest_finish_prefers_the_faster_robot","line":143,"kind":"function","doc":"Same order: the shorter route on the slower robot finishes later."},{"name":"test_earliest_finish_never_uses_waiting","line":153,"kind":"function","doc":"The estimate is a function of route, speed and services only."},{"name":"test_multi_criteria_pulls_an_older_order_forward","line":170,"kind":"function","doc":"Earliest finish takes the 29 m new order; the FIFO criterion takes\nthe 30 m old one, because 1 m is small within this decision's range."},{"name":"test_multi_criteria_prefers_battery_headroom_at_equal_cost","line":190,"kind":"function","doc":""},{"name":"test_multi_criteria_rescales_weights_without_battery","line":203,"kind":"function","doc":""},{"name":"test_multi_criteria_refuses_unknown_weights","line":212,"kind":"function","doc":""},{"name":"test_auction_gives_the_oldest_order_to_its_cheapest_robot","line":220,"kind":"function","doc":"One robot, two orders: nearest takes the cheap young order, the\nFIFO auction sells the old one first."},{"name":"test_auction_lets_the_oldest_order_take_a_contested_robot","line":230,"kind":"function","doc":"r1 is cheapest for both; the old order wins it at auction."},{"name":"test_hungarian_minimises_the_total_where_greedy_does_not","line":247,"kind":"function","doc":"Greedy locks r1-o1 at 1 m and pays 10 m for r2-o2 (11 m total);\nthe optimum crosses over for 2 + 2 = 4 m."},{"name":"test_hungarian_pairs_as_many_robots_as_the_mask_allows","line":264,"kind":"function","doc":"r2 can only take o1. Greedy gives o1 to r1 and strands r2."},{"name":"unit_timing","line":280,"kind":"function","doc":"finish = cost: speed 1 m/s, no service time."},{"name":"test_milp_minimises_the_latest_finish_not_the_sum","line":286,"kind":"function","doc":"Hungarian takes 1 + 7 = 8 (latest 7); MILP takes 6 + 6 = 12\n(latest 6). Different objectives, different answers."},{"name":"test_milp_breaks_an_equal_makespan_on_total_finish","line":304,"kind":"function","doc":"Both matchings end at 5; the second totals 7 instead of 10."},{"name":"test_milp_pairs_as_many_robots_as_the_mask_allows","line":320,"kind":"function","doc":""},{"name":"test_optimisers_return_nothing_for_no_candidates","line":333,"kind":"function","doc":""},{"name":"warehouse","line":342,"kind":"function","doc":""},{"name":"orders","line":347,"kind":"function","doc":""},{"name":"fifo","line":352,"kind":"function","doc":""},{"name":"test_every_strategy_returns_a_legal_matching_in_fifo_order","line":361,"kind":"function","doc":""},{"name":"test_every_strategy_carries_c_static_and_the_astar_route","line":377,"kind":"function","doc":""},{"name":"test_no_strategy_can_escape_the_battery_mask","line":384,"kind":"function","doc":""},{"name":"test_every_strategy_uses_only_the_robot_that_can_afford_it","line":396,"kind":"function","doc":""},{"name":"test_new_strategies_are_deterministic","line":408,"kind":"function","doc":""},{"name":"test_time_estimating_strategies_refuse_to_run_without_timing","line":418,"kind":"function","doc":""},{"name":"_brute_force_optimum","line":423,"kind":"function","doc":"(latest finish, total finish) of the best maximum matching."},{"name":"test_milp_matches_brute_force_on_random_decisions","line":451,"kind":"function","doc":"The aggregated formulation and the pruning are exact."},{"name":"test_multi_criteria_prefers_the_earlier_finish","line":481,"kind":"function","doc":""},{"name":"test_multi_criteria_prefers_ending_nearer_a_charger","line":488,"kind":"function","doc":""},{"name":"test_multi_criteria_zero_range_contributes_nothing","line":499,"kind":"function","doc":"Every criterion equal across the decision: every score is 0, and\nthe pair falls to the shared tie-break (finish, C_static, FIFO, id)."},{"name":"test_multi_criteria_scores_stay_within_the_weight_total","line":513,"kind":"function","doc":""}],"imports":["fractions: Fraction","pytest","mrta_core.battery: EnergyRequirement","task_management.allocation_strategy: BATCH_STRATEGIES, MultiCriteriaGridAwareAllocator, auction_pairing, earliest_finish_pairing, get_batch_strategy, greedy_pairing, hungarian_pairing, milp_pairing, multi_criteria_scores, MULTI_CRITERIA_WEIGHTS","task_management.features: DecisionTiming, OrderCandidate, OrderRoute","test_nearest_astar: EAST_HOME, WEST_HOME, east_order, practice_warehouse, west_order","test_strategies: battery_context","itertools: combinations","random: Random","random: Random"],"summary":"Phase 7: the five remaining conventional strategies.\n\nTwo kinds of test:\n\n  * controlled allocation scenarios, on hand-set candidate costs, where\n    each new strategy must choose differently from the strategy it is\n    most likely to collapse onto -- and for the reason its definition\n    gives, not by accident\n  * the properties every strategy must hold on the real practice map,\n    or a comparison between them is void: a legal matching, the battery\n    mask, C_static carried forward, determinism\n\nThe controlled scenarios call the strategies' pairing functions on\ncandidates built here, so the costs are exact and the scenario says\nprecisely what is being tested. Nearest A*'s choice in a scenario is\nits own sort key over the same candidates."},{"path":"src/task_management/test/test_strategies.py","size":13535,"symbols":[{"name":"warehouse","line":45,"kind":"function","doc":""},{"name":"orders","line":50,"kind":"function","doc":""},{"name":"fifo","line":55,"kind":"function","doc":""},{"name":"pairs","line":59,"kind":"function","doc":""},{"name":"battery_context","line":63,"kind":"function","doc":"A controlled battery context. The charger is a fixed leg away."},{"name":"test_all_three_strategies_are_registered","line":80,"kind":"function","doc":""},{"name":"test_an_unknown_strategy_is_refused_by_name","line":87,"kind":"function","doc":""},{"name":"test_manhattan_and_astar_choose_different_pairings","line":97,"kind":"function","doc":"A controlled case where the naive metric picks the other pairing.\n\nMeasured on the practice map, robot_001 at (1, 1), robot_002 at\n(9, 1)::\n\n                      O0001 west      O0002 east\n    robot_001 (1,1)   A* 25  M 14     A* 31  M 16\n    robot_002 (9,1)   A* 11  M 10     A* 11  M  8\n\nA* sees robot_002's two options as *equal* at 11 m, so its tie-break\ngives robot_002 the older order and robot_001 the east one.\nManhattan sees 8 \u003c 10 and sends robot_002 east instead. That 8 is\nthe illusion: in a one-way warehouse the straight line is not the\nroute, and both legs really cost 11.\n\nNote what this case does *not* show. Greedy A* is myopic, so on this\n2x2 the Manhattan pairing happens to be c"},{"name":"test_manhattan_reports_the_astar_cost_not_its_own_ranking","line":133,"kind":"function","doc":"The ranking key must not leak into the recorded cost.\n\n``cost`` is C_static, the predicted cost of the route that will\nactually be driven, and the dataset compares it against the realized\ndistance. If Manhattan wrote its own number there, every\npredicted-vs-realized comparison for this strategy would be wrong."},{"name":"test_a_strategy_returns_a_legal_matching","line":169,"kind":"function","doc":""},{"name":"test_a_strategy_reports_in_fifo_order","line":188,"kind":"function","doc":"Whichever robot won it, the oldest order is reported first."},{"name":"test_no_strategy_can_escape_the_battery_mask","line":203,"kind":"function","doc":"Eligibility is infrastructure, not a thing a policy may weigh.\n\nAt 11% SOC neither robot can finish an order and still reach a\ncharger on the 10% reserve, so there is no legal pair and every\nstrategy must defer -- the cheap one, the naive one and the random\none alike."},{"name":"test_a_strategy_assigns_only_the_robot_that_can_afford_it","line":224,"kind":"function","doc":"One robot full, one nearly flat: only the full one may be used."},{"name":"wide_case","line":249,"kind":"function","doc":"Enough robots and orders that a shuffle can actually change something."},{"name":"test_random_is_reproducible_from_its_seed","line":269,"kind":"function","doc":""},{"name":"test_a_different_seed_gives_a_different_pairing","line":282,"kind":"function","doc":"Otherwise the seed is decoration and the sweep is not random."},{"name":"test_reset_restores_the_random_stream","line":301,"kind":"function","doc":"``reset()`` must genuinely reset, or a re-run is not a re-run."},{"name":"test_random_does_not_depend_on_the_order_it_is_handed","line":317,"kind":"function","doc":"A seeded shuffle of a list built from dict iteration is not seeded.\n\nThe strategy sorts into a canonical order before shuffling, so\npresenting the same decision with the robots and orders listed\nbackwards must not change the outcome."},{"name":"test_manhattan_cost_is_the_straight_line_chain","line":342,"kind":"function","doc":"start -> shelf -> dropoff, ignoring every wall and lane rule."},{"name":"test_manhattan_picks_the_cheaper_shelf_permutation","line":350,"kind":"function","doc":"Same structure as order_route_cost: it evaluates every ordering.\n\nTwo shelves and a drop-off chosen so the two visiting orders really\ndiffer, (1,1) -> shelves -> dropoff_east (13,5)::\n\n    west then east   9 + 4 + 5 = 18     \u003c- the better one\n    east then west  11 + 4 + 7 = 22\n\nA cost function that walked the shelves in the order given would\nreturn 22 half the time, and the baseline would be a different\nbaseline depending on how the CSV happened to list the items."},{"name":"test_manhattan_cost_is_infinite_for_an_unknown_zone","line":382,"kind":"function","doc":"Matching order_route_cost's unreachable convention."},{"name":"test_manhattan_underestimates_the_real_route","line":389,"kind":"function","doc":"The naive metric is optimistic, which is exactly its weakness.\n\nA straight line can only be shorter than a legal one-way route, so\nManhattan never over-estimates. A strategy ranking on it is\nsystematically confident about pairs the warehouse will punish."}],"imports":["fractions: Fraction","math: inf","pytest","mrta_core.battery: BatteryConfig, BatteryDecisionContext","task_management.allocation_strategy: BATCH_STRATEGIES, get_batch_strategy","task_management.features: manhattan_order_cost","test_nearest_astar: EAST_HOME, WEST_HOME, FakeOrder, east_order, practice_warehouse, west_order"],"summary":"Phase 7 slice 1: Random and Nearest Manhattan beside Nearest A*.\n\nThree strategies, one sweep. What is tested here is not that each picks\nsome particular pair -- that is the experiment -- but the properties\nthat have to hold for a comparison between them to mean anything:\n\n  * they differ by their ranking and by nothing else\n  * none of them can escape the battery eligibility mask\n  * each returns a legal matching, never two orders for one robot\n  * the stochastic one is reproducible from its seed\n  * Manhattan decides the pairing and never the route\n\nThe practice warehouse is reused from ``test_nearest_astar`` rather than\nredrawn. The lane policy reads absolute grid coordinates, so a map on\narbitrary coordinates is not a smaller warehouse but an illegal one;\nthat fixture is a genuine one-band slice of the production map and is\nasserted to obey the production lane policy."}],"map":{"source":"src/simulation_env/maps/W100.xlsx","sha256":"508c3ab470df7de45de22c9f7f690c77cd09c3de54d89c9a2810742710c27fbc","stats":{"width":40,"height":54,"blocked":12,"roads":1424,"terminals":724,"edges":4244,"core_edges":1548,"bidirectional_core_edges":0,"forward_reachable":1424,"reverse_reachable":1424,"zones":{"wall":12,"dropoff":36,"road":1424,"staging":100,"shelf":552,"charging":24,"charge_queue":12}},"cells" ality first.","no_leakage":"Routes/geometry, current SOC, reserve, predicted service and charger leg only. No realized future waiting, completion, energy, congestion, charging events.","route_complexity":"All strategies first score m*n pairs; for k shelf visits, enumerate unique permutations (k! in general) and build each k+1-leg directed A* mission, including service retreats. Generated workload normally has 1-3 shelves; loader itself does not enforce k\u003c=3. Shared RouteCache memoizes static leg queries. Allocation-only costs below exclude this shared work.","source_caveats":["greedy_pairing docstring lines 55-60 still claims every strategy is a greedy sweep, stale after global assignment methods were added.","RandomAllocator docstring says uniformly random pairing; code implements uniform random edge ordering followed by greedy matching, which does not establish uniform sampling over feasible matchings.","MILP generic backend has no polynomial runtime guarantee, but this specific eligible-edge bottleneck assignment problem admits specialized polynomial algorithms; do not call the scientific problem intrinsically NP-hard."]},"strategies":[{"id":"random","name":"Random","cls":"RandomAllocator","path":"src/task_management/task_management/allocation_strategy.py","line":349,"pairing_function":"greedy_pairing","pairing_line":52,"objective":"Seeded random eligible-edge ordering, then greedy matching. No cost minimization.","rank":"Sort (robot_id,order_id) canonically, Random(seed).shuffle, sweep.","tie":"Pseudorandom stream advances with each call; reset() reconstructs Random(seed). IDs canonicalize engineering order, not scientific priority.","cardinality":"Maximal, not maximum in sparse eligibility graphs.","complexity":"O(q log q) canonical sort + O(q) shuffle/sweep; q eligible edges.","strength":"Seeded stochastic control for allocation value.","limitations":"No quality guarantee or formal lower bound; not generally uniform over legal matchings.","example":"Existing tests show same seed reproducible, different seeds yield >1 pairing across seeds 0..11; reset restores first decision.","test_path":"src/task_management/test/test_strategies.py","test_line":269,"status":"Implemented baseline","infeasible":"Ineligible pairs are filtered out. No eligible pair -> []; caller defers. Time-estimating strategies require timing and raise ValueError if absent."},{"id":"nearest_manhattan","name":"Nearest Manhattan","cls":"NearestManhattanAllocator","path":"src/task_management/task_management/allocation_strategy.py","line":261,"pairing_function":"greedy_pairing","pairing_line":52,"objective":"Greedy minimum Manhattan chain through shelves then dropoff. Deliberately naive allocation control.","rank":"Minimum shelf-permutation sum of |dx|+|dy| from start through shelves to dropoff; raw grid-cell coordinate units.","tie":"(Manhattan chain, C_static, FIFO position, robot_id).","cardinality":"Maximal, not maximum in sparse eligibility graphs.","complexity":"O(q*k!*k) Manhattan ranking-key construction + O(q log q) sort/sweep. Shared directed routing still paid.","strength":"Isolates the value of grid-aware allocation while preserving legal directed execution.","limitations":"Ignores walls, lane directions, and explicit terminal retreat in ranking. Can beat a greedy A* decision accidentally; not expected to lose every scenario.","example":"Practice map costs (r1 west/east) A*=25/31, M=14/16; (r2 west/east) A*=11/11, M=10/8. A* takes r2-west+r1-east=42m; Manhattan takes r1-west+r2-east=36m, but records/drives A* 25+11, never Manhattan 14+8.","test_path":"src/task_management/test/test_strategies.py","test_line":97,"status":"Implemented baseline","infeasible":"Ineligible pairs are filtered out. No eligible pair -> []; caller defers. Time-estimating strategies require timing and raise ValueError if absent."},{"id":"nearest_astar","name":"Nearest Directed A*","cls":"NearestAStarAllocator","path":"src/task_management/task_management/allocation_strategy.py","line":197,"pairing_function":"greedy_pairing","pairing_line":52,"objective":"Greedy globally cheapest remaining eligible pair by whole-order directed route length.","rank":"C_static(r,o): shortest generated static mission among all shelf visiting permutations, including retreats.","tie":"(C_static, FIFO position, robot_id).","cardinality":"Maximal, not maximum in sparse eligibility graphs.","complexity":"O(q log q) sorting plus sweep.","strength":"Simple deterministic legal-geometry baseline; preserves interpretable distance objective.","limitations":"Myopic; neither minimum batch total nor guaranteed maximum cardinality; no waiting prediction.","example":"2x2 C=[[1,2],[2,10]]: greedy picks diagonal 1+10=11; Hungarian crosses for 2+2=4. Sparse edges r1-o1=1,r1-o2=2,r2-o1=3: greedy produces only r1-o1; optimizers produce two pairs.","test_path":"src/task_management/test/test_phase7_strategies.py","test_line":247,"status":"Implemented baseline","infeasible":"Ineligible pairs are filtered out. No eligible pair -> []; caller defers. Time-estimating strategies require timing and raise ValueError if absent."},{"id":"earliest_finish","name":"Earliest Finish","cls":"EarliestFinishAllocator","path":"src/task_management/task_management/allocation_strategy.py","line":473,"pairing_function":"earliest_finish_pairing","pairing_line":461,"objective":"Greedy minimum estimated relative finish duration (travel plus service).","rank":"F=C_static/v_r + shelf visits*shelf_service + dropoff_service. All offered robots free now.","tie":"(F,C_static,FIFO position,robot_id).","cardinality":"Maximal, not maximum in sparse eligibility graphs.","complexity":"O(q log q) sorting plus sweep.","strength":"Accounts for shelf service count and robot speed using executor timing.","limitations":"Static estimate excludes uncertain future waiting; greedy rather than global batch makespan; often agrees with A* under equal speeds/near-equal services.","example":"One robot v=1.5m/s: o1 10m/three shelves gives 10.6667s; o2 10.5m/one shelf gives 9s (1s shelf and dropoff services). A* chooses o1; EF chooses o2.","test_path":"src/task_management/test/test_phase7_strategies.py","test_line":130,"status":"Implemented; Phase 7 slice 2 awaiting review","infeasible":"Ineligible pairs are filtered out. No eligible pair -> []; caller defers. Time-estimating strategies require timing and raise ValueError if absent."},{"id":"multi_criteria","name":"Multi-Criteria Grid-Aware","cls":"MultiCriteriaGridAwareAllocator","path":"src/task_management/task_management/allocation_strategy.py","line":594,"pairing_function":"multi_criteria_scores","pairing_line":549,"objective":"Greedy weighted sum of decision-local min-max normalized finish, FIFO position, negative energy margin, charger distance.","rank":"0.5*N(F)+0.2*N(FIFO)+0.2*N(-energy_margin)+0.1*N(charger_distance); N=(x-min)/(max-min), equal range -> 0.","tie":"(score,F,C_static,FIFO position,robot_id).","cardinality":"Maximal, not maximum in sparse eligibility graphs.","complexity":"O(q) scoring for four criteria + O(q log q) sort/sweep.","strength":"Combines completion estimate, FIFO age, headroom and post-mission charger proximity with approved transparent weights.","limitations":"Untuned heuristic weights fixed 2026-10-27. Relative normalization means a 1m spread and 100m spread each span [0,1]; score depends on the whole offered decision. No congestion feature. Battery only favors already-eligible pairs.","example":"One robot, cost old=30m at FIFO0, mid=60m at5, new=29m at10. Without battery, finish/FIFO weights rescale 0.5/0.7 and 0.2/0.7. old score≈0.02304, new≈0.28571; MC picks old, EF picks new.","test_path":"src/task_management/test/test_phase7_strategies.py","test_line":170,"status":"Implemented; Phase 7 slice 2 awaiting review","infeasible":"Ineligible pairs are filtered out. No eligible pair -> []; caller defers. Time-estimating strategies require timing and raise ValueError if absent."},{"id":"auction","name":"Sequ function strategyDetail(s){return `<div class="card"><div class="card-top"><h3>${s.name}</h3>${tag(['random','nearest_astar','nearest_manhattan'].includes(s.id)?'Established baseline':'Implemented / review pending',['random','nearest_astar','nearest_manhattan'].includes(s.id)?'green':'amber')}</div><p>${esc(s.strength)}</p><div class="formula">${esc(s.objective)}</div><dl class="detail-grid"><dt>Algorithm</dt><dd>${esc(s.rank)}</dd><dt>Input</dt><dd>Same offered robot–order candidates, route plans, timing and battery mask.</dd><dt>Output</dt><dd>One-to-one assignment set, FIFO-sorted; directed route attached.</dd><dt>Cardinality</dt><dd>${esc(s.cardinality)}</dd><dt>Tie handling</dt><dd>${esc(s.tie)}</dd><dt>Complexity</dt><dd>${esc(s.complexity)} Shared route computation is additional.</dd><dt>Limitation</dt><dd>${esc(s.limitations)}</dd><dt>Source example</dt><dd>${esc(s.example)}</dd><dt>Research role</dt><dd>${esc(s.role||s.strength)}</dd></dl><hr><p>Congestion: ${esc(s.congestion||'No future realized waiting enters this policy. Different assignments can cause different queues in the same shared traffic controller.')}</p>${source(s.path,s.line)}<br>${source(s.test_path,s.test_line)}</div>`}
function pageStrategies(){return head(5,'Eight ways to allocate the same work.','Every strategy receives the same candidate window, legal directed routes and battery mask. The policy can choose ownership; it cannot change the apparatus.')+`<div class="compare-selects"><label>Policy A<select id="strategy-a">${options(S,'nearest_astar')}</select></label><label>Policy B<select id="strategy-b">${options(S,'hungarian')}</select></label></div><div id="strategy-comparison" class="grid cols2 spacer"></div>`+`<div class="card spacer"><div class="card-top"><h3>Allocation matrix: greedy versus global</h3>${tag('Conceptual controlled example','amber')}</div><label class="inline"><input id="matrix-mask" type="checkbox">Inspect sparse feasibility / cardinality example</label><p>Two available robots, two orders; all entries feasible. Each cell shows <strong>directed route distance</strong> and relative <strong>predicted finish</strong>. At 1 m/s with equal 2 s service: F = distance + 2 s. These invented inputs illustrate objectives; they are not measured warehouse data or production solvers.</p><div class="pill-tabs" id="matrix-tabs"><button data-matrix="nearest">Greedy nearest</button><button data-matrix="hungarian">Hungarian · min sum</button><button data-matrix="milp">MILP · bottleneck</button></div><div id="allocation-matrix" class="spacer"></div></div>`+grid(card('Greedy is maximal, not necessarily maximum',`<p>A greedy sweep takes the best remaining edge, then removes its robot and order. In a sparse feasibility graph this can leave an avoidable unmatched order. Hungarian and MILP maximize cardinality first.</p>${source('src/task_management/task_management/allocation_strategy.py',52)}`)+card('Static optimization ≠ global warehouse optimum',`<p>Matching is global over one offered decision batch. It does not schedule all future orders, predict future traffic, or optimize charging. The MILP has binary assignment variables and a bottleneck finish objective; it is not the ILP symbolic learner.</p>${source('docs/DECISIONS.md',1159)}`),2)}
function renderSparseMatrix(){const global=matrixMode!=='nearest';$$('[data-matrix]').forEach(b=>b.classList.toggle('selected',b.dataset.matrix===matrixMode));$('#allocation-matrix').innerHTML=`<div class="table-wrap"><table class="matrix"><thead><tr><th>Robot / order</th><th>Order A</th><th>Order B</th></tr></thead><tbody><tr><th>Robot 1</th><td class="${!global?'selected':''}">1 m · 3 s ${!global?'✓':''}</td><td class="${global?'selected':''}">2 m · 4 s ${global?'✓':''}</td></tr><tr><th>Robot 2</th><td class="${global?'selected':''}">3 m · 5 s ${global?'✓':''}</td><td class="infeasible">INFEASIBLE · hard mask</td></tr></tbody></table></div><p class="spacer">${global?'Maximum cardinality comes first: choose both cross edges (2 orders), even though one costs more. Hungarian and MILP agree in this sparse example.':'Greedy takes Robot 1 → Order A, leaving Robot 2 with no eligible remaining edge: only 1 order is assigned. This is maximal, but not maximum cardinality.'}</p><p>Conceptual input matrix based on the source test motif; production Python solvers are not running in the browser.</p>`}
