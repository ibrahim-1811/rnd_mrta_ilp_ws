o is no longer constructible: the warehouse core is fully\none-way, so for any adjacent pair of transit cells only one direction\nis legal and A* can never hand two robots opposing intents on the same\nedge.\n\nThe 100-order workload used to deadlock exactly here:\n\n    robot_006  (10,15) -> (10,16)\n    robot_013  (10,16) -> (10,15)\n\nx=10 is a shelf column. It had no direction assigned inside the open\nband, so both intents were legal, the two robots each waited for the\nother, and every other robot queued up behind them. Sixteen more\nrobots were stalled behind that single pair.\n\nSo what is worth checking now is the property that replaced the yield:\n\n  1. no pair of adjacent transit cells is legal in both directions\n  2. the specific (10,15)/(10,16) edge is one-way\n  3. two robots driven straight at each other through that band both\n     finish, and every edge the engine executes is lane-legal"},{"path":"src/simulation_env/scripts/check_local_headon_resolution.py","size":9306,"symbols":[{"name":"resolve","line":59,"kind":"function","doc":""}],"imports":["mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: directional_blocked_edges, non_transit_cells","simulation_env.local_traffic_controller: LocalTrafficController, MovementIntent, TrafficDecision","simulation_env.local_yield_selector: select_local_yield_cell"],"summary":"Local head-on detection, yielding and rejoining on the real map.\n\nSince the warehouse core became fully one-way, two robots can no longer\nmeet head-on in an aisle: for any adjacent pair of transit cells only\none of the two directions is legal, so the opposing intent is never\nplanned in the first place.\n\nThe one place a head-on survives is a *service* edge. Shelf, dropoff\nand staging connections stay bidirectional on purpose, because a robot\nhas to be able to drive in and reverse back out. So the residual case\nis two robots contending for the same station: one arriving, one\nleaving.\n\nThat is the case exercised here, at shelf cell (4,10):\n\n    robot_001  (5,10) -> (4,10)   arriving to pick\n    robot_002  (4,10) -> (5,10)   retreating after its pick\n\nrobot_001 has the shorter remaining distance and therefore right of\nway, so robot_002 must step aside into the aisle on the far side of the\nrack, (3,10), and let it in."},{"path":"src/simulation_env/scripts/check_local_traffic_controller.py","size":3940,"symbols":[{"name":"show","line":13,"kind":"function","doc":""}],"imports":["simulation_env.local_traffic_controller: LocalTrafficController, MovementIntent, TrafficDecision"],"summary":""},{"path":"src/simulation_env/scripts/check_local_yield_selector.py","size":3038,"symbols":[{"name":"neighbors","line":20,"kind":"function","doc":""},{"name":"acceptable_traffic_cell","line":39,"kind":"function","doc":""}],"imports":["mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.local_yield_selector: select_local_yield_cell"],"summary":""},{"path":"src/simulation_env/scripts/check_map_topology.py","size":11410,"symbols":[{"name":"_reach","line":59,"kind":"function","doc":""},{"name":"main","line":74,"kind":"function","doc":""},{"name":"plan","line":162,"kind":"function","doc":"One mission leg, planned exactly as the executor plans it."},{"name":"cells_of","line":239,"kind":"function","doc":""}],"imports":["__future__: annotations","argparse","itertools","collections: Counter, deque","pathlib: Path","mrta_core.grid: astar_path","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: directional_blocked_edges, navigation_grid, non_transit_cells, non_transit_types, traversable_lane_edges"],"summary":"Topology gate for a warehouse map, under the production lane policy.\n\nThis is the check that has to pass before a map is allowed to become\nthe current one. It answers:\n\n  * is every transit cell strongly connected, so no robot can drive\n    into a corner it cannot legally leave\n  * are there uncontrolled two-way core edges, the structural head-on\n    the one-way core exists to remove\n  * can every terminal -- shelf, dropoff, Stage Zone, charger and\n    charge-queue holding cell -- be entered from the core AND left back\n    to it. A local \"has a lane in and a lane out\" test is not enough: a\n    terminal whose only aisle neighbour is a one-way dead end has both\n    lanes and is still a trap or unreachable\n  * can every station reach every other station through A*\n  * does any of those routes use a terminal as an intermediate cell,\n    move directly from one terminal to another, or take a move the RMF\n    nav graph does not have\n\nIt deliberately imports the production routing policy rather than\nrestating the lane rules:\n\n    non_transit_cells()          which cells are terminals\n    directional_blocked_edges()  which directed edges are legal\n    navigation_grid()            what A* actually plans on\n    traversable_lane_edges()     what the RMF nav graph is built from\n\nso this validates the graph the planner executes, not a paraphrase of\nit.\n\nUsage\n-----\n    python3 src/simulation_env/scripts/check_map_topology.py \\\n        --config src/simulation_env/config/warehouse.yaml"},{"path":"src/simulation_env/scripts/check_raw_mission_cycle.py","size":4055,"symbols":[{"name":"on_event","line":45,"kind":"function","doc":""}],"imports":["mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: plan_from_cell","simulation_env.fleet: home_bank","simulation_env.fleet_engine: EventType, FleetSimulationEngine","simulation_env.grid_robot: GridRobot"],"summary":""},{"path":"src/simulation_env/scripts/check_strategy_distinctness.py","size":8448,"symbols":[{"name":"ProbingAllocator","line":67,"kind":"class","doc":"Drives with one strategy and asks the rivals the same question.\n\nDeliberately not a BatchAllocationStrategy subclass. It is a\nmeasurement wrapper, and making it look like a strategy would invite\nsomeone to run an experiment through it."},{"name":"run","line":112,"kind":"function","doc":""},{"name":"main","line":143,"kind":"function","doc":""},{"name":"__init__","line":75,"kind":"function","doc":""},{"name":"score","line":84,"kind":"function","doc":""},{"name":"assign","line":87,"kind":"function","doc":""}],"imports":["argparse","dataclasses: replace","itertools: permutations","pathlib: Path","sys","mrta_core.order_queue: OrderQueue","mrta_core.orders: load_orders_csv","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet","simulation_env.workload_executor: WorkloadExecutor","task_management.allocation_strategy: BATCH_STRATEGIES, get_batch_strategy"],"summary":"Strategy distinctness gate (docs/DECISIONS.md, \"Strategy Distinctness Gate\").\n\nA new baseline is accepted only when it is shown distinct from every\nalready-accepted strategy. The measure is *pairwise decision\ndivergence*: the share of choice-bearing decisions at which two\nstrategies select a different pair set.\n\nComparing two independent runs would not measure that. After the first\ndecision where they differ the two fleets are in different states, so\ntheir decision N is not the same decision and the comparison is\nmeaningless. This script therefore measures a **counterfactual**: one\nstrategy drives the run, and at every decision each rival is asked the\n*same* question -- same free robots, same candidate window, same\npositions, same SOC, same route cache -- and its answer is compared\nagainst the one that was taken.\n\n    python3 src/simulation_env/scripts/check_strategy_distinctness.py\n    python3 src/simulation_env/scripts/check_strategy_distinctness.py --orders 40\n\nA choice-bearing decision is one where robots x orders > 1. Forced\ndecisions are excluded from the denominator: no strategy deserves\ncredit for agreeing where there was nothing to decide, and counting\nthem would let the gate be passed by widening the candidate window.\n\nProbing is read-only with respect to the simulation: the rivals' answers\nare recorded and discarded, and only the driving strategy's assignment\nis ever returned to the executor."},{"path":"src/simulation_env/scripts/compare_paired.py","size":9208,"symbols":[{"name":"load","line":56,"kind":"function","doc":""},{"name":"_number","line":73,"kind":"function","doc":""},{"name":"completeness","line":77,"kind":"function","doc":"What is missing from the grid, and what each comparison lost.\n\nReturns (missing, extra, samples): missing runs with why they are\nmissing, runs present but outside the grid, and per (strategy,\nrobots) the expected seeds and the seeds actually paired with the\nbaseline."},{"name":"incomplete_banner","line":129,"kind":"function","doc":""},{"name":"table","line":170,"kind":"function","doc":""},{"name":"main","line":192,"kind":"function","doc":""}],"imports":["argparse","csv","json","sys","pathlib: Path","simulation_env.paired: PairingError, check_complete, check_settings, paired_differences"],"summary":"Compare strategies by paired differences over workload seeds.\n\n    python3 src/simulation_env/scripts/compare_paired.py --name main\n\nreads runs/\u003cname>/summary.csv from a paired run_experiment.py run and\nwrites, for every strategy against the baseline (default\nnearest_astar), at every fleet size and on every headline metric, the\nmean per-seed difference and its 95% confidence interval:\n\n    runs/\u003cname>/paired.csv\n    runs/\u003cname>/paired.md\n\nA difference is strategy minus baseline. An interval that does not\ncontain 0 is marked. Refuses (E1) an experiment whose runs do not match\nthe grid in experiment.json, whose runs do not share one map and\nsimulator setting, or whose pairs did not run the same workload.\n\n--allow-incomplete compares the runs that are there, and says so:\npaired.md opens with an INCOMPLETE banner, lists every missing run\n(stalled, failed or never run) and every run left out, and gives each\ncomparison's expected and actual paired sample size; paired.csv\ncarries expected_n and complete for every row. A stalled run is never\nshown as a success or dropped without being listed. See simulation_env/paired.py\nand docs/DECISIONS.md, \"Workload Seeds and Paired Comparison\"."},{"path":"src/simulation_env/scripts/discover_directional_highways.py","size":3126,"symbols":[{"name":"usable","line":19,"kind":"function","doc":""},{"name":"contiguous_runs","line":36,"kind":"function","doc":""}],"imports":["mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: NON_TRANSIT_TYPES"],"summary":""},{"path":"src/simulation_env/scripts/generate_gazebo_grid_world.py","size":8202,"symbols":[{"name":"grid_to_world","line":115,"kind":"function","doc":""}],"imports":["argparse","pathlib: Path","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.gazebo_view: grid_to_gazebo"],"summary":"Generate a lightweight Gazebo warehouse world from the XLSX map.\n\nGazebo is visualization only.\n\nWhite floor:\n    traversable warehouse area\n\nRed tiles:\n    blocked / no-go cells\n\nColoured tiles:\n    semantic stations, one model per station ID, named after\n    the ID so a pose can be read straight off the entity tree\n\nNo robots. The world is the warehouse only, so one world serves every\nfleet size on its map. The fleet node creates exactly the robots a run\nneeds when it starts (simulation_env.gazebo_bridge.create_robots).\n\nStation tiles are visual only. They carry no collision and never\naffect A*; the occupancy layer is still just the red cells."},{"path":"src/simulation_env/scripts/generate_orders.py","size":4762,"symbols":[{"name":"stations_of","line":53,"kind":"function","doc":"Shelf and drop-off ids, read from the map a config names.\n\nIn the map's own numbering order, which for V2 is exactly SHELVES\nand DROPOFFS above, so a V2 workload generated either way is\nbyte-identical."},{"name":"build","line":88,"kind":"function","doc":"The whole CSV as text. Same seed in, same bytes out."},{"name":"main","line":121,"kind":"function","doc":""}],"imports":["argparse","random","sys","pathlib: Path","mrta_core.sim_config: resolve_map_path","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx"],"summary":"Generate a deterministic order workload.\n\nWrites an order CSV under the active schema::\n\n    order_id,item_id,shelf_id,quantity,dropoff_id\n\n1-3 shelf lines per order, drawn only from station ids the warehouse\nmap defines. Seeded, so rerunning it writes a byte-identical file and\nthe FIFO sequence never moves.\n\n    # orders for the current map (the one config), into config/orders.csv\n    python3 src/simulation_env/scripts/generate_orders.py --orders 2000\n\n    # the V2 reference workload used by the tests\n    python3 src/simulation_env/scripts/generate_orders.py         --config src/simulation_env/test/fixtures/v2_reference.yaml         --output src/simulation_env/test/fixtures/orders.csv\n\nbuild_scenario.py --map runs this for you when you switch maps.\n\nRegeneration is deliberate, not automatic: the committed CSV is the\nreference workload every run and every strategy comparison shares."},{"path":"src/simulation_env/scripts/map_tool.py","size":11171,"symbols":[{"name":"excel_names","line":59,"kind":"function","doc":"grid cell -> Excel cell name, from the map's own labels."},{"name":"where","line":75,"kind":"function","doc":""},{"name":"cmd_new","line":88,"kind":"function","doc":""},{"name":"cmd_example","line":99,"kind":"function","doc":""},{"name":"cmd_check","line":116,"kind":"function","doc":""},{"name":"cmd_show","line":226,"kind":"function","doc":""},{"name":"cmd_export","line":296,"kind":"function","doc":""},{"name":"main","line":308,"kind":"function","doc":""}],"imports":["argparse","pathlib: Path","sys","mrta_core.map_builder: GLYPH_ORDER, blank_layout, example_layout, layout_of, write_layout_xlsx","mrta_core.map_check: Problem, check_map","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx, read_xlsx_coordinate_frame","mrta_core.warehouse_routing: directional_blocked_edges, non_transit_cells","openpyxl.utils: get_column_letter"],"summary":"Make, check and inspect warehouse maps.\n\n    # start an empty map to draw by hand\n    map_tool.py new      --width 30 --height 40 --out maps/my_map.xlsx\n\n    # or start from a complete, valid map sized for a fleet\n    map_tool.py example  --robots 100 --out maps/my_map.xlsx\n\n    # after every edit: what is wrong, and in which Excel cell\n    map_tool.py check    --map maps/my_map.xlsx\n\n    # print the map and its lanes in the terminal\n    map_tool.py show     --map maps/my_map.xlsx\n\n    # draw a map's effective lanes into a copy of it as arrows\n    map_tool.py export   --map test/fixtures/CSV_To_Gazebo_v2.xlsx --out v2_drawn.xlsx\n\nThe step-by-step guide is docs/MAKE_A_MAP.md."},{"path":"src/simulation_env/scripts/plot_dataset.py","size":10646,"symbols":[{"name":"per_decision","line":43,"kind":"function","doc":"One record per decision, from the per-pair candidate rows.\n\nThe shape columns (free_robots, window_orders) are properties of the\ndecision and repeat across its candidate rows, so the first row of\neach group carries them."},{"name":"load","line":59,"kind":"function","doc":""},{"name":"figure_decision_shape","line":89,"kind":"function","doc":"Why S0 exists: a 1x1 decision cannot tell two strategies apart."},{"name":"figure_predicted_vs_realized","line":166,"kind":"function","doc":"The predicted/realized join, and where divergence legitimately is."},{"name":"figure_tradeoff","line":239,"kind":"function","doc":"What the window and the quantum cost and buy, side by side."},{"name":"main","line":292,"kind":"function","doc":""}],"imports":["argparse","pathlib: Path","sys","simulation_env.dataset_export: read_run","matplotlib.pyplot","matplotlib.pyplot","matplotlib.pyplot"],"summary":"Plot figures from recorded Phase 8 datasets.\n\nEvery number in every figure is read from a recorded run, so a figure\ncannot drift from the simulator the way a hand-drawn one does. Re-run\nthis after any change that moves the baselines and the documentation\nfigures update with it.\n\n    python3 src/simulation_env/scripts/plot_dataset.py         --run legacy=runs/legacy         --run continuous=runs/astar         --run batched=runs/batched         --out docs/figures\n\nEach --run is LABEL=DIR, where DIR is a directory written by\nrun_workload.py --dataset. Order is preserved in the figures."},{"path":"src/simulation_env/scripts/plot_experiment.py","size":12170,"symbols":[{"name":"style_of","line":95,"kind":"function","doc":""},{"name":"load","line":103,"kind":"function","doc":""},{"name":"by_strategy","line":117,"kind":"function","doc":"strategy -> sorted [(robots, mean, low, high)] over seeds."},{"name":"setup","line":136,"kind":"function","doc":""},{"name":"metric_grid","line":151,"kind":"function","doc":""},{"name":"outcomes_of","line":203,"kind":"function","doc":""},{"name":"first_seed","line":208,"kind":"function","doc":"One run per (strategy, robots): the lowest seed, for per-order plots."},{"name":"completion_curves","line":219,"kind":"function","doc":""},{"name":"order_times","line":251,"kind":"function","doc":""},{"name":"summary_table","line":301,"kind":"function","doc":""},{"name":"main","line":326,"kind":"function","doc":""}],"imports":["argparse","csv","collections: defaultdict","pathlib: Path","statistics: mean","matplotlib","matplotlib.pyplot","pyarrow.parquet"],"summary":"Plot an experiment written by run_experiment.py: every core metric.\n\n    python3 src/simulation_env/scripts/plot_experiment.py --name fleet_sweep\n\nreads runs/\u003cname>/summary.csv and each run's outcomes.parquet, and\nwrites runs/\u003cname>/figures/:\n\n    mrta.png               order makespan, throughput, completion time,\n                           fleet settled time, distance (fleet and per\n                           phase), waiting, allocator CPU\n    traffic.png            waiting per order, waiting share, yields\n    battery.png            energy (fleet and per phase), minimum SOC,\n                           charging, time out of the fleet, waiting for\n                           a charger, saturation\n    completion_curves.png  orders completed over time, per fleet size\n    order_times.png        per-order duration and waiting, per strategy\n\nand runs/\u003cname>/summary.md, the same numbers as a table. Every number\nis read from the recorded run, never typed in. A stochastic strategy\nis drawn as its mean over seeds with the min-max range as a bar."},{"path":"src/simulation_env/scripts/run_experiment.py","size":12952,"symbols":[{"name":"runs_for","line":93,"kind":"function","doc":""},{"name":"write_workloads","line":105,"kind":"function","doc":"One order file per seed, from the current map; seed -> path.\n\nRewriting an existing experiment's files is harmless while they come\nout the same: same seed, map and size, same bytes. If a recorded\nworkload would now come out different (the map changed), the runs\nalready made used another workload, and this refuses."},{"name":"run_dir_of","line":150,"kind":"function","doc":""},{"name":"finished","line":154,"kind":"function","doc":"A run that left both its manifest and its metrics."},{"name":"prepare","line":160,"kind":"function","doc":"Guard runs/\u003cname> against overwrites; None when clear to run.\n\nReturns the reason to refuse, or None. With --force the old\ndirectory is renamed, never deleted."},{"name":"run_one","line":197,"kind":"function","doc":""},{"name":"main","line":239,"kind":"function","doc":""}],"imports":["argparse","csv","json","os","subprocess","sys","time","concurrent.futures: ThreadPoolExecutor","datetime: datetime, timezone","hashlib: sha256","pathlib: Path","generate_orders","simulation_env.dataset: git_state","simulation_env.paired: settings_signature"],"summary":"Run an experiment grid headless: strategies x fleet sizes x seeds.\n\nEvery run is an ordinary run_workload.py run with --dataset, so each one\nleaves its own directory:\n\n    runs/\u003cname>/\u003cstrategy>/r\u003crobots>_s\u003cseed>/\n        run.log             the run's full terminal output\n        run.json            provenance: map, config, orders, code\n        metrics.json        the run's results (EXPERIMENT_PROTOCOL.md)\n        decisions.parquet   every scored robot-order pair, decision time\n        outcomes.parquet    what happened to each order\n        decisions.csv, outcomes.csv, bk.pl, exs.pl   with --export\n\nand the experiment gets one table of every run's metrics:\n\n    runs/\u003cname>/summary.csv\n\nA seed selects a workload (docs/DECISIONS.md, \"Workload Seeds and\nPaired Comparison\"). For each seed, generate_orders.py writes one\ndeterministic order file from the current map,\n\n    runs/\u003cname>/workloads/orders_s\u003cseed>.csv\n    runs/\u003cname>/workloads/workloads.json    seed -> file, sha256, size\n\nand every strategy runs that same file at every fleet size, so the\nruns of one seed are paired. A stochastic strategy takes the same seed\nfor its own choices. --orders N runs the first N orders of each file;\na generated file's first N orders are exactly what generating N would\ngive.\n\n    python3 src/simulation_env/scripts/run_experiment.py --name main \\\n        --robots 10 30 50 70 100 --seeds $(seq 1 30)\n\n--workloads reference runs the committed order file instead, as every\nexperiment did before paired seeds: a deterministic strategy once, with\nthe first seed, and only a stochastic one over every seed.\n\nIntegrity (E1). runs/\u003cname>/experiment.json records the grid, the\nworkload settings and the git state; compare_paired.py refuses an\nexperiment whose runs do not match that grid or do not share one map\nand simulator setting (summary.csv carries each run's\nsettings_sha256). An existing runs/\u003cname> is never overwritten:\n\n    --resume   run only what is missing or failed; the grid and the\n               workload files must match what experiment.json recorded\n    --force    start again; the old directory is kept, renamed to\n               runs/\u003cname>.replaced-\u003cUTC time>\n\nThen plot it with plot_experiment.py and compare strategies with\ncompare_paired.py."},{"path":"src/simulation_env/scripts/run_workload.py","size":13551,"symbols":[{"name":"main","line":44,"kind":"function","doc":""},{"name":"announce","line":233,"kind":"function","doc":""},{"name":"progress","line":243,"kind":"function","doc":""},{"name":"perf","line":248,"kind":"function","doc":""}],"imports":["argparse","dataclasses: replace","pathlib: Path","time","mrta_core.order_queue: OrderQueue","mrta_core.orders: describe_order_selection, load_orders_csv, select_orders","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.battery_ledger: battery_report_lines","simulation_env.dataset: RunRecorder, build_manifest","simulation_env.fleet: build_fleet, home_stations","simulation_env.workload_executor: PerfBudget, WorkloadExecutor, battery_event_line, charging_report_lines, decision_report_lines, eligibility_report_lines","task_management.allocation_strategy: get_batch_strategy","simulation_env.run_metrics: run_metrics, write_metrics","simulation_env.dataset_export: write_csv, write_prolog"],"summary":"Run a warehouse workload headless: FIFO -> allocator -> fleet.\n\nNo ROS and no Gazebo: this is the execution path on its own, so a run\ncan be checked without a display or a live node.\n\n    python3 src/simulation_env/scripts/run_workload.py\n    python3 src/simulation_env/scripts/run_workload.py --orders 18\n    python3 src/simulation_env/scripts/run_workload.py --robots 6 --speed 1.0\n    python3 src/simulation_env/scripts/run_workload.py         --dataset runs/nearest_astar --export\n\nProgress is printed as it happens, so a long run shows what it is doing\nrather than going silent."},{"path":"src/simulation_env/scripts/validate_directional_highways.py","size":9066,"symbols":[{"name":"traversable","line":57,"kind":"function","doc":""},{"name":"geometric_neighbors","line":63,"kind":"function","doc":""},{"name":"move_allowed","line":76,"kind":"function","doc":"Whether one directed grid edge is permitted."},{"name":"reachable","line":116,"kind":"function","doc":""}],"imports":["argparse","collections: Counter, deque","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: BIDIRECTIONAL_CONNECTORS, EASTBOUND_ROWS, NON_TRANSIT_TYPES, NORTHBOUND_COLS, SHELF_BLOCK_RUNG_DX, SHELF_BLOCK_ROWS, SHELF_COLS, SOUTHBOUND_COLS, WESTBOUND_ROWS, directional_blocked_edges, non_transit_cells"],"summary":"Validate the directed warehouse traffic topology.\n\nThis script deliberately imports the production lane policy instead of\nrestating it. It used to carry its own copy of the rules, which drifted\nfrom ``mrta_core.warehouse_routing`` and reported PASS for a graph the\nplanner never actually used.\n\nWhat is checked, against the exact ``blocked_edges`` set A* consumes:\n\n  * every core transit edge is one-way\n  * the core is strongly connected\n  * every terminal cell -- shelf, dropoff, Stage Zone, charger and\n    charge-queue holding cell -- can be entered from the core and left\n    back to it"},{"path":"src/simulation_env/setup.cfg","size":97,"symbols":[],"imports":[]},{"path":"src/simulation_env/setup.py","size":1161,"symbols":[],"imports":["os","glob: glob","setuptools: find_packages, setup"],"summary":""},{"path":"src/simulation_env/simulation_env/__init__.py","size":0,"symbols":[],"imports":[],"summary":""},{"path":"src/simulation_env/simulation_env/battery_ledger.py","size":17125,"symbols":[{"name":"_Account","line":60,"kind":"class","doc":""},{"name":"BatterySnapshot","line":95,"kind":"class","doc":"One robot's battery account at one instant. Percentages of SOC."},{"name":"BatteryLedger","line":129,"kind":"class","doc":"Per-robot SOC, booked from fleet engine events."},{"name":"fleet_summary","line":362,"kind":"function","doc":"Fleet-level battery figures at the snapshots' instant."},{"name":"cross_check","line":383,"kind":"function","doc":"|ledger SOC - SOC re-derived from the robot's own float counters|.\n\nGridRobot keeps distance, travel time, service time, waiting time\nand charging time as floats, booked by the engine independently of\nthis ledger. SOC rebuilt from those, with idle as the remainder of\nelapsed time, must agree with the ledger to float precision. A real\ndisagreement means an event was booked into one account and not the\nother.\n\nCharging time is taken out of the stationary remainder and added\nback as a gain, because the configured rate is net: a charging robot\nis charging, not idling."},{"name":"battery_report_lines","line":415,"kind":"function","doc":"The end-of-workload battery section, for any front end.\n\n``robots`` is robot_id -> GridRobot, for the independent cross\ncheck against the engine's own counters."},{"name":"total_energy_consumed","line":119,"kind":"function","doc":"Everything the robot spent. Charging is a gain, not a cost."},{"name":"__init__","line":132,"kind":"function","doc":""},{"name":"register","line":146,"kind":"function","doc":""},{"name":"book_move","line":159,"kind":"function","doc":""},{"name":"book_service","line":166,"kind":"function","doc":""},{"name":"book_wait","line":174,"kind":"function","doc":""},{"name":"begin_charge","line":182,"kind":"function","doc":"Open a charge session. Returns the SOC it starts from.\n\nLatches the running minimum before the SOC starts to rise, so\n``minimum_soc`` keeps reporting the deepest SOC the robot ever\nreached rather than being erased by the charge.\n\nNothing is booked here: the session is booked as one interval\nwhen it completes. Until then ``soc()`` reads it as rising, so a\nlive read mid-charge is exact rather than reading as idle."},{"name":"book_charge","line":214,"kind":"function","doc":"Close a charge session of ``duration``. Returns the SOC gained.\n\nThe charging interval is booked as its own category, so it is\nexcluded from the idle remainder: a charging robot is charging,\nnot idling, and the configured rate is the net gain\n(docs/DECISIONS.md, \"Charging Rate\")."},{"name":"robot_ids","line":245,"kind":"function","doc":""},{"name":"snapshot","line":248,"kind":"function","doc":""},{"name":"soc","line":317,"kind":"function","doc":"Live SOC; the same value ``snapshot().current_soc`` returns."},{"name":"snapshots","line":353,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","fractions: Fraction","mrta_core.battery: FULL_SOC_PERCENT, BatteryConfig, charge_energy, service_energy, stationary_energy, travel_energy"],"summary":"The one authoritative record of every robot's state of charge.\n\nBattery V1. The ledger is written by the fleet engine only. Since B2\nthe executor reads SOC from it for eligibility, CHARGE_DUE and\nCHARGE_NEEDED; since B3 a REQUEST robot drives to a charger; since B4 a\nrobot on a charger charges to 100% and rejoins the fleet.\n\nIt is booked from the engine's own events, at the very call sites that\nalready book the float travel / service / waiting counters on\nGridRobot, with the same ``Fraction`` durations the clock used:\n\n    a completed one-cell move    travel    any kind: aisle move, service\n                                           retreat, yield side step, rejoin\n    a completed pick or drop     service\n    a closed traffic wait        waiting\n    a completed charge session   charge    the only term that raises SOC\n\nIdle is never booked. It is the remainder: every simulated second a\nrobot exists it is moving, serving, traffic-waiting, charging or idle,\nso\n\n    idle_s = (now - registered_at)\n             - moving_s - service_s - waiting_s - charging_s\n\nCharging is in that subtraction deliberately: the configured rate is\nthe NET gain (docs/DECISIONS.md, \"Charging Rate\"), so a charging robot\nmust not also be billed idle drain.\n\nwhich is why this is a ledger over the engine's clock and not a second\nclock of its own. A negative remainder can only mean some interval was\nbooked twice, and is raised rather than hidden.\n\nBetween events the split is provisional: a move, service or wait still\nin progress reads as idle until it completes and is booked. The drain\nrates for waiting and idle are equal, so a live SOC read mid-wait is\nexact; mid-move or mid-service it lags by at most one move's or one\nservice's worth of drain. At the end of a run nothing is in progress,\nso every category is exact.\n\nCharging is the exception: a session can run for up to 100 simulated\nseconds, and reading it as idle would show SOC falling while it is\nreally rising. So an open session is tracked (``charging_since``) and\nboth ``soc()`` and ``snapshot()`` account for it exactly at any instant."},{"path":"src/simulation_env/simulation_env/charging.py","size":18706,"symbols":[{"name":"ResourceState","line":81,"kind":"class","doc":""},{"name":"ChargeState","line":88,"kind":"class","doc":"Where a robot is in the charging workflow."},{"name":"ResourceError","line":188,"kind":"class","doc":"An illegal terminal-resource transition. Always a bug."},{"name":"ChargingSaturationError","line":192,"kind":"class","doc":"No charger, holding cell or Stage Zone left for a REQUEST robot.\n\nRaised rather than leaving the robot standing in an aisle."},{"name":"TerminalSlot","line":200,"kind":"class","doc":""},{"name":"ChargeRecord","line":224,"kind":"class","doc":"One robot's trip through the charging workflow."},{"name":"TerminalBank","line":288,"kind":"class","doc":"Slots of one terminal type -- chargers, or holding cells."},{"name":"__init__","line":291,"kind":"function","doc":""},{"name":"held_by","line":312,"kind":"function","doc":""},{"name":"free","line":315,"kind":"function","doc":"FREE slots nobody is standing on or promised, in zone_id order."},{"name":"promised","line":326,"kind":"function","doc":"The slot promised to this robot for its next occupancy, if any."},{"name":"count","line":335,"kind":"function","doc":""},{"name":"_slot","line":340,"kind":"function","doc":""},{"name":"promise","line":358,"kind":"function","doc":"Assign an occupied slot to its next holder, before it is free.\n\nThe slot keeps its current holder and its current state; it is\nsimply no longer on offer to anybody else."},{"name":"cancel_promise","line":384,"kind":"function","doc":"Put a promised slot back on offer."},{"name":"reserve","line":392,"kind":"function","doc":"FREE -> RESERVED, before the robot starts to move."},{"name":"occupy","line":423,"kind":"function","doc":"RESERVED -> OCCUPIED, with the robot physically on the cell."},{"name":"vacate","line":436,"kind":"function","doc":"OCCUPIED -> VACATING: leaving, still unavailable."},{"name":"cleared","line":442,"kind":"function","doc":"VACATING -> FREE, once the robot has crossed the access edge."},{"name":"route_cost","line":457,"kind":"function","doc":"Directed A* cost from a cell to a slot, or None if unreachable.\n\nThe production router over the same non-transit view the\nexecutor drives, so the cost that chooses the slot is the cost\nof the route the robot then follows."},{"name":"assign","line":476,"kind":"function","doc":"Reserve the cheapest FREE slot for each robot, without duplicates.\n\n``robot_cells`` is robot_id -> the cell it stands on. Returns\nrobot_id -> (zone_id, route cost) for every robot that got a\nslot; a robot with none is absent and the caller decides."}],"imports":["dataclasses: dataclass","enum: Enum","fractions: Fraction","mrta_core.warehouse_routing: best_path_to_zone, non_transit_cells"],"summary":"Charger and holding terminals: who holds each cell, and in what state.\n\nBattery V1, increments B3, B4 and B5. A robot in charge REQUEST is\ntaken off the transit network: it reserves a dedicated non-transit\nterminal and drives there by the production directed A* route (B3). On a\ncharger it then charges to 100%, reverses into the access aisle cell and\nrejoins the fleet (B4).\n\nA robot that reached a *holding* cell, or a Stage Zone under\nsaturation, is a waiting robot. When a charger becomes FREE the waiting\nrobot first in the queue is promoted onto it (B5), and a CHARGE_DUE\nrobot that finds every charger occupied may preempt the highest-SOC\ncharging robot (B5). Both are frozen policy; see docs/DECISIONS.md,\n\"Charger Saturation and Preemption\", \"Charger Queue Discipline\",\n\"Stage Zone Promotion\" and \"Preempted Robot\".\n\nResource states\n---------------\nEvery charging cell and every holding cell is one slot::\n\n    FREE -> RESERVED -> OCCUPIED -> VACATING -> FREE\n\n``reserve``   the slot is claimed before the robot starts to move\n``occupy``    the robot is physically on the terminal cell\n``vacate``    the robot has started to leave (B4+)\n``cleared``   the robot has crossed the access edge back into the aisle\n\nA slot is offered to a new robot only while FREE. It stays unavailable\nthrough RESERVED, OCCUPIED and VACATING, so a robot can never be routed\ninto a terminal that another robot owns, stands on, or is backing out\nof. Every illegal transition raises :class:`ResourceError`; none is\never repaired silently.\n\nTerminal-access safety\n----------------------\nCharger and holding cells are one-cell-deep banks entered from the aisle\ncell directly outside them and left by reversing into that cell, so the\naccess edge is two-way. A head-on swap on it needs one robot entering\nwhile another leaves the same terminal. The slot rule above excludes\nthat: the only robot that may enter a terminal is its reservation\nholder, and the slot is not FREE again until any robot leaving it has\ncleared the edge. See docs/CURRENT_PHASE.md, \"B3 traffic-safety\nargument\".\n\nThat rule is what makes B4's departure safe. A full robot goes\nOCCUPIED -> VACATING *before* it moves, and the slot becomes FREE only\nonce the robot physically stands on the aisle cell. So no robot can be\nentering while another is leaving, and the access edge never carries an\nopposite-direction swap.\n\nSelection\n---------\nAmong FREE slots, by directed A* route cost from the robot's cell --\nnever Manhattan. Simultaneous requesters are paired greedily over\n\n    (route cost, zone_id, robot_id)\n\nexactly like Stage Zone parking. Cost is the only scientific quantity;\n``zone_id`` separates an exact cost tie between cells and ``robot_id``\nonly breaks a tie both earlier keys left equal.\n\nThis is fixed infrastructure shared by every MRTA strategy. It never\ntouches order ownership."},{"path":"src/simulation_env/simulation_env/dataset.py","size":15039,"symbols":[{"name":"exact","line":58,"kind":"function","doc":"An exact rational as ``\"numerator/denominator\"``.\n\nRound-trips through ``Fraction(text)`` without loss, which float64\ndoes not."},{"name":"_float","line":71,"kind":"function","doc":""},{"name":"sha256_of","line":75,"kind":"function","doc":"Content hash of an input file, so a run names its real inputs."},{"name":"git_state","line":92,"kind":"function","doc":"HEAD and whether the tree was dirty when the run was made.\n\nA result measured on an uncommitted tree is still useful, but it must\nsay so: ``dirty`` is the difference between a reproducible run and an\nanecdote."},{"name":"_schema","line":132,"kind":"function","doc":""},{"name":"_decision_schema","line":200,"kind":"function","doc":"The pyarrow schema. Column order comes from DECISION_COLUMNS."},{"name":"_outcome_schema","line":245,"kind":"function","doc":"The pyarrow schema. Column order comes from OUTCOME_COLUMNS."},{"name":"RunRecorder","line":252,"kind":"class","doc":"Accumulates one run's rows, then writes the dataset.\n\nRows are finalized as they are handed over and never revisited, so\nbuffering them until the end of the run cannot introduce leakage:\nwhat is written is what was true when the row was built."},{"name":"build_manifest","line":353,"kind":"function","doc":"Everything needed to say what a dataset is a measurement of.\n\nThe run's effective conditions are passed in, never read back from\nthe config: a command-line seed, speed, dispatch quantum or order\nlimit overrides the YAML, and the manifest must record what was\nactually run. They are keyword-only and required, so a caller\ncannot silently fall back to the config's value. ``orders`` is the\nexecuted order sequence."},{"name":"git","line":100,"kind":"function","doc":""},{"name":"decision","line":267,"kind":"function","doc":""},{"name":"launched","line":270,"kind":"function","doc":""},{"name":"snapshot_of","line":273,"kind":"function","doc":""},{"name":"outcome","line":276,"kind":"function","doc":""},{"name":"write","line":281,"kind":"function","doc":"Write both tables and the manifest. Returns the directory.\n\nParquet when pyarrow is available, CSV when it is not. Both are\nlossless: the exact columns are already strings, so the rational\nclock and the SOC ledger survive either way. The manifest records\nwhich format was used, so a reader never has to guess."},{"name":"_tables","line":311,"kind":"function","doc":""},{"name":"_write_parquet","line":317,"kind":"function","doc":""},{"name":"_write_csv","line":331,"kind":"function","doc":""}],"imports":["dataclasses: dataclass, field","fractions: Fraction","hashlib: sha256","json: dumps","pathlib: Path","subprocess: run","pyarrow","pyarrow","pyarrow.parquet","csv: writer"],"summary":"Phase 8: the decision and outcome dataset.\n\nTwo tables and a manifest, one directory per run::\n\n    decisions.parquet   one row per scored (robot, order) candidate pair\n    outcomes.parquet    one row per order\n    run.json            provenance, without which the tables are not evidence\n\nThe point of the split is the causal structure the research rests on::\n\n    State_t -> Decision_t -> Outcome\n\nA decision row may contain only what was knowable at the instant of the\ndecision. Realized waiting, actual completion time, actual energy,\ncharging events and future congestion live in the outcome table and\nnowhere else. The boundary is enforced structurally -- a decision row is\nbuilt before any mission is planned and never touched again -- and the\ntruncation test in ``test/test_dataset.py`` is what proves it.\n\nDeliberately raw. Every feature is a number in its natural unit, never a\ndiscretized predicate: ``battery_high`` style thresholds are\nlearner-side choices that will be tuned repeatedly, and freezing them\ninto the dataset would mean re-running every experiment whenever one\nmoves. See docs/DECISIONS.md, \"Decision-Time Features\".\n\nThe clock and the SOC ledger are exact rationals and Parquet has no\nrational type, so where exactness matters a value is stored twice: a\nfloat64 column for analysis and an exact ``\"numerator/denominator\"``\nstring beside it, which is what makes a run reproducible rather than\nmerely plottable."},{"path":"src/simulation_env/simulation_env/dataset_export.py","size":10033,"symbols":[{"name":"read_run","line":83,"kind":"function","doc":"Both tables as lists of dicts, plus the manifest.\n\nReads whichever format the run was written in. The live ROS node\nruns on the system interpreter, where pyarrow may be absent, so a\nrun can legitimately be CSV; the manifest says which."},{"name":"_read_csv","line":111,"kind":"function","doc":"A CSV table back as typed rows.\n\nCSV has one type, so the declared column types are what restores\n``22`` to an int and ``true`` to a bool. Without that, every\ndownstream comparison would be against a string."},{"name":"write_csv","line":144,"kind":"function","doc":"Both tables beside the Parquet files, as ``*.csv``.\n\nA run already written as CSV is left alone: rewriting it in place\nwould read and truncate the same file."},{"name":"_columns","line":183,"kind":"function","doc":""},{"name":"_atom","line":189,"kind":"function","doc":"A Prolog atom. Identifiers are lowercased, not renumbered."},{"name":"_number","line":197,"kind":"function","doc":"A Prolog number, keeping an integer an integer.\n\nCounts, FIFO positions and cell counts are ``int32`` in the schema.\nWidening them to ``22.0`` would invite a learner to compare them as\nfloats, which is wrong for a count and reads as though a measurement\nwere involved."},{"name":"write_prolog","line":215,"kind":"function","doc":"The decision table as ground facts: ``bk.pl`` and ``exs.pl``.\n\nOne ``pos``/``neg`` example per *eligible* candidate pair. Pairs the\ninfrastructure refused -- unreachable route, battery-ineligible --\nare not negative examples: a learner asked to explain them would be\nlearning to reproduce the feasibility mask, which is fixed\ninfrastructure and not the research variable. They stay in the\nParquet table, which is the record of what was offered."},{"name":"cast","line":123,"kind":"function","doc":""}],"imports":["csv: writer","json: loads","pathlib: Path","simulation_env.dataset: DECISION_COLUMNS, DECISIONS_CSV, DECISIONS_FILE, MANIFEST_FILE, OUTCOME_COLUMNS, OUTCOMES_CSV, OUTCOMES_FILE","csv: DictReader","pyarrow.parquet"],"summary":"Phase 8: reading a run's dataset back out.\n\nParquet is the storage format because the clock and the SOC ledger are\nexact rationals and a run has to stay reproducible. It is not readable\nwith ``less``, so this module is the inspection counterpart:\n\n    csv       both tables as text, for grepping, diffing and plotting\n    prolog    the decision table as ground facts, for an ILP learner\n\nNothing here computes anything. An export that derived a new quantity\nwould be a second implementation of a feature that already exists in\n``dataset.py``, and the two would drift. Every value written is a value\nread from the Parquet file.\n\nWhat this module deliberately does not do\n-----------------------------------------\nIt does not discretize. ``soc(d12, robot_003, 88.5)`` is emitted, never\n``battery_high(d12, robot_003)``. Where the thresholds go is a learner\ndecision that will be tuned repeatedly, and baking one into the export\nwould mean re-exporting -- or worse, re-running -- every experiment each\ntime a threshold moves. See docs/DECISIONS.md, \"Decision-Time Features\".\n\nIt does not write mode or bias declarations. Which predicates a learner\nmay use, and with what arity and direction, is the hypothesis space:\nthat is the experiment, not the data, and it belongs to the ILP phase.\n\nIt does not emit facts *about* identifiers. ``robot_003`` and ``o0042``\nappear as the terms an example is about, because an example has to name\nsomething, but no fact asserts an ordering over them or exposes the\nnumeric part as a feature. Identifiers are traceability, not predicates."},{"path":"src/simulation_env/simulation_env/fleet.py","size":8336,"symbols":[{"name":"home_bank","line":26,"kind":"function","doc":"Home zones in deterministic id order: ``*_001`` first.\n\nA map is expected to label its bank with one home type. If it\ncarries both, COLLECTION wins and STAGING is ignored, so a\nhalf-migrated sheet fails loudly on the robot count rather than\nsilently deploying onto a mixture of the two."},{"name":"_banks","line":67,"kind":"function","doc":"Home stations grouped into banks of touching cells, in id order."},{"name":"_spread","line":101,"kind":"function","doc":"``count`` stations spaced evenly over every bank.\n\nRobots are shared out across banks in proportion to bank size\n(largest remainder, ties to the earlier bank), then each bank's\nshare is centred at even intervals along it. A full fleet gets\nevery cell. Returned in id order, so robot_001 takes the first."},{"name":"spawn_stations","line":133,"kind":"function","doc":"The home station each robot starts on, robot_001 first."},{"name":"build_fleet","line":145,"kind":"function","doc":"Create one GridRobot per configured robot, at its home cell.\n\nrobot_001 -> the first home station, robot_002 -> the second, and\nso on: staging_001.. on a V1 map, collection_001.. on a V2 map.\n\n``speed_mps`` overrides ``fleet.speed_mps`` for this fleet only,\nso a run can be re-timed from the command line without editing the\nconfig. Everything else still comes from the config."},{"name":"home_stations","line":252,"kind":"function","doc":"robot_id -> the home station it was deployed at."}],"imports":["mrta_core.sim_config: SimConfig","mrta_core.warehouse_map: WarehouseMap","mrta_core.warehouse_routing: HOME_TYPES","simulation_env.grid_robot: GridRobot, GridRobotStatus"],"summary":"Build a robot fleet from configuration.\n\nPure logic, no ROS, so the world generator and the fleet node build the\nsame fleet from the same config and cannot disagree about where a robot\nstarts.\n\nRobots are generated programmatically from ``fleet.robot_count``; the\ncount is never written out by hand.\n\nThe home bank is where robots are deployed and may idle. It is not an\norder pickup or drop-off point, and nothing here makes it a mandatory\nreturn destination.\n\nV1 maps label that bank STAGING; V2 renames it to COLLECTION. Both are\naccepted, so the same fleet code builds either map. \"Home\" is the\nstable concept and is what the helpers here are named after."},{"path":"src/simulation_env/simulation_env/fleet_engine.py","size":65491,"symbols":[{"name":"EventType","line":52,"kind":"class","doc":""},{"name":"Event","line":76,"kind":"class","doc":""},{"name":"_Assignment","line":89,"kind":"class","doc":"Where a robot is within its mission."},{"name":"_YieldState","line":102,"kind":"class","doc":"Temporary state while a robot leaves and rejoins its route."},{"name":"DeadlockError","line":121,"kind":"class","doc":"Every remaining robot is waiting for another. Nothing can move.\n\nReservations prevent collisions; they do not resolve deadlock.\nDetecting it loudly beats silently ending a run early."},{"name":"FleetSimulationEngine","line":129,"kind":"class","doc":"Advances a fleet through missions on one shared clock."},{"name":"sim_time","line":84,"kind":"function","doc":""},{"name":"__init__","line":132,"kind":"function","doc":""},{"name":"sim_time","line":227,"kind":"function","doc":"Authoritative warehouse time, as a float for reporting."},{"name":"_move_duration","line":231,"kind":"function","doc":""},{"name":"_schedule","line":235,"kind":"function","doc":""},{"name":"schedule_timer","line":262,"kind":"function","doc":"Ask to be ticked again in ``delay`` simulated seconds.\n\nA neutral wake-up: it moves the clock, books the interval the\nway any other advance does (idle robots drain at the idle rate,\nwhich is exactly what they are doing), produces a tick, and\nchanges nothing else. The executor uses it for the dispatch\nquantum."},{"name":"add_robot","line":276,"kind":"function","doc":""},{"name":"_book_travel","line":291,"kind":"function","doc":"One completed one-cell move, whatever kind of move it was."},{"name":"_book_wait","line":299,"kind":"function","doc":"One closed stationary traffic wait."},{"name":"_book_service","line":307,"kind":"function","doc":"One completed pick or drop."},{"name":"_book_charge","line":320,"kind":"function","doc":"One completed charge session. The only booking that adds SOC."},{"name":"begin_charge","line":337,"kind":"function","doc":"Hold ``robot_id`` on its cell, charging, for ``duration``.\n\nThe robot must be standing still with no mission in flight: a\ncharge is only ever started once it has arrived on its reserved\ncharger. Returns the scheduled CHARGE_COMPLETE event."},{"name":"end_charge_early","line":378,"kind":"function","doc":"Close an open charge session now and return the interval booked.\n\nPreemption (B5). The *policy* -- who may be preempted, and by\nwhom -- stays in the executor; this only cuts the dwell short,\nbooks exactly the time that really elapsed, and hands the robot\nback IDLE on its charger cell, the same way a completed session\ndoes. The scheduled completion is dropped, because a completion\nwithout an open session is a bug the handler refuses."},{"name":"_prepare_mission_start","line":418,"kind":"function","doc":"Prepare the first movement request for one raw mission.\n\nNo move is claimed here. This lets several newly assigned\nrobots enter local traffic arbitration together."},{"name":"assign_missions_batch","line":458,"kind":"function","doc":"Assign several raw missions at one simulation instant.\n\nInitial movement intentions are resolved together by the\nLocalTrafficController."},{"name":"assign_mission","line":525,"kind":"function","doc":"Assign one raw mission through the same local traffic path."},{"name":"_begin_segment","line":538,"kind":"function","doc":""},{"name":"_arrive","line":558,"kind":"function","doc":"Robot reached this segment's target station."},{"name":"_traffic_busy","line":596,"kind":"function","doc":"Whether the robot is doing productive order work.\n\nNormal order missions have right-of-way over parking missions.\nRobot ID is only the final deterministic tie breaker."},{"name":"_remaining_to_destination","line":610,"kind":"function","doc":"Grid edges remaining to the current destination."},{"name":"_service_protected_move","line":620,"kind":"function","doc":"Classify movement that needs exclusive service clearance.\n\nReturns:\n    \"entry\"\n        Final aisle -> shelf/dropoff move.\n\n    \"retreat\"\n        Shelf/dropoff -> protected aisle exit.\n\n    None\n        Ordinary traffic movement."},{"name":"_try_moves_batch","line":677,"kind":"function","doc":"Resolve simultaneous one-cell movement requests.\n\nOrdinary safe moves are committed atomically.\n\nFor a direct head-on conflict, the lower right-of-way robot\nmoves one orthogonal cell aside when a safe local yield cell\nexists. The winner waits until that side step finishes."},{"name":"_try_move","line":1149,"kind":"function","doc":"Schedule one move if the reservation table allows it.\n\nReturns False if the robot must wait. A waiting robot keeps\nits cell, so it goes on blocking others, which is what makes\nthe guarantees hold."},{"name":"_retry_waiting","line":1199,"kind":"function","doc":"Retry all blocked movement requests as one batch."},{"name":"_handle","line":1220,"kind":"function","doc":""},{"name":"_continue_pending","line":1430,"kind":"function","doc":"Choose next actions after all same-time events finish.\n\nMission state transitions happen first.\n\nOrdinary movement requests, blocked robots, and eligible\nyield rejoins are then resolved in one simultaneous batch."},{"name":"_stamp_all","line":1620,"kind":"function","doc":"Every robot reports the one authoritative timestamp."},{"name":"step_once","line":1626,"kind":"function","doc":"Process every event at the next timestamp. One advance."},{"name":"_only_scheduled_charging","line":1673,"kind":"function","doc":"Can this interval be excluded from the mission watchdog?\n\nOnly charge-only intervals qualify. An unrelated unfinished\nmission or traffic wait keeps the watchdog running, even if\nanother robot has a valid future charge completion."},{"name":"run","line":1704,"kind":"function","doc":""},{"name":"completion_time","line":2017,"kind":"function","doc":"When the robot finished its mission, excluding parking."},{"name":"parked_time","line":2024,"kind":"function","doc":"When the robot reached its park zone, if it parked."},{"name":"blocked_by_others","line":2031,"kind":"function","doc":"Cells currently held by other robots."},{"name":"busy_robots","line":2035,"kind":"function","doc":""},{"name":"register_wait","line":867,"kind":"function","doc":""}],"imports":["dataclasses: dataclass","enum: Enum","fractions: Fraction","heapq: heapify, heappop, heappush","mrta_core.battery: BatteryConfig","mrta_core.warehouse_map: WarehouseMap, ZoneType","simulation_env.battery_ledger: BatteryLedger","simulation_env.grid_robot: GridRobot, GridRobotStatus","mrta_core.warehouse_routing: MissionPlan","simulation_env.reservations: EDGE, VERTEX, ReservationTable","simulation_env.local_traffic_controller: LocalTrafficController, MovementIntent, TrafficDecision","simulation_env.local_yield_selector: select_local_yield_cell"],"summary":"Event-driven fleet simulation with one authoritative clock.\n\nA robot must not own simulation time. With eighteen private clocks\n``robot_001.sim_time = 20`` and ``robot_002.sim_time = 12`` describe no\nwarehouse state at all. This engine owns the single warehouse clock;\nrobots carry a reported timestamp written by it.\n\nTime is kept as :class:`fractions.Fraction`, not float. One grid edge\nat 1.5 m/s is exactly 2/3 s, so two robots that both start moving at\nt=0 land on *identical* timestamps and are processed as one concurrent\nbatch. With floats they would differ in the last bits after enough\naccumulation and silently stop being concurrent.\n\nConcurrency rule: events sharing a timestamp advance the clock once.\nTwo 2/3 s moves starting together take the clock 0 -> 2/3, never 4/3.\n\nEvents sharing a timestamp are applied in two phases: every robot\nfirst releases what it is leaving, and only then does any robot claim\nwhat it is entering. Without that split, a robot whose event happens\nto be handled first sees a cell that a simultaneous robot is about to\nvacate as still occupied, and reports a conflict that does not exist.\n\nEvery move is gated by a ReservationTable. A robot that cannot move\nsafely becomes WAITING, keeps its cell, and is retried whenever the\noccupancy changes -- in sorted robot order, so arbitration between\nsimultaneous conflicts is reproducible.\n\nNothing here sleeps, publishes or talks to Gazebo. Callbacks let an\nowner observe; observation never advances the clock."},{"path":"src/simulation_env/simulation_env/fleet_node.py","size":41150,"symbols":[{"name":"FleetNode","line":88,"kind":"class","doc":""},{"name":"main","line":1146,"kind":"function","doc":""},{"name":"__init__","line":89,"kind":"function","doc":""},{"name":"summary","line":238,"kind":"function","doc":""},{"name":"checks","line":305,"kind":"function","doc":""},{"name":"place_in_gazebo","line":364,"kind":"function","doc":""},{"name":"to_msg","line":459,"kind":"function","doc":""},{"name":"_soc_percent","line":491,"kind":"function","doc":"Live SOC from the engine's battery ledger. Display only.\n\nBefore the workload engine exists every robot is at its\nconfigured initial SOC. With battery accounting disabled the\nconfigured initial value is shown and never changes."},{"name":"publish_fleet","line":506,"kind":"function","doc":""},{"name":"fleet_status","line":517,"kind":"function","doc":"The run at a glance, for /mrta/fleet_status. Reporting only."},{"name":"event","line":563,"kind":"function","doc":"One event: always on /mrta/events, on the terminal if verbose."},{"name":"load_workload","line":571,"kind":"function","doc":"Load the configured deterministic FIFO workload.\n\nThe OrderQueue is the authoritative workload state.\nEvery configured order is loaded PENDING in deterministic FIFO\nsequence."},{"name":"run_order_workload","line":625,"kind":"function","doc":"Execute the whole FIFO workload with a real MRTA allocator.\n\nFIFO decides which orders are eligible, ``task_management``\ndecides which robot takes which of them, and everything below\nis the existing execution stack unchanged."},{"name":"announce_perf","line":788,"kind":"function","doc":"Report a dispatch that stalled the loop. CPU time only."},{"name":"announce_progress","line":795,"kind":"function","doc":"One status line; the full block only when verbose."},{"name":"announce_dispatch","line":814,"kind":"function","doc":"One robot-order assignment, as it is dispatched."},{"name":"announce_order_status","line":825,"kind":"function","doc":"Report one order lifecycle transition."},{"name":"report_workload","line":833,"kind":"function","doc":"The full report to a file; a short summary on the terminal.\n\nThe file is the report this node always printed, per-robot\ntables included: in the dataset directory when one is recorded,\notherwise under $ROS_HOME/mrta/. verbose:=true prints it too."},{"name":"full_report_lines","line":894,"kind":"function","doc":"Everything about the run, per-robot tables included."},{"name":"on_advance","line":970,"kind":"function","doc":"Pace one global interval and render it at about 20 Hz."},{"name":"_render_interval","line":987,"kind":"function","doc":"Emit interpolated frames across one simulated interval.\n\nThe engine calls on_advance *before* it processes the events at\nthe end of the interval, so every move that spans this interval\nis still open in the reservation table. That is what makes a\nsmooth in-between pose possible without inventing motion."},{"name":"_live_poses","line":1028,"kind":"function","doc":"Where every robot is at ``sim_time``, read from the engine.\n\nA robot mid-move is interpolated along the edge it reserved.\nAnything else -- waiting, picking, dropping, parked -- sits\nexactly on its cell."},{"name":"_world_xy","line":1082,"kind":"function","doc":"Cell -> Gazebo XY, carrying the map origin.\n\nEvery pose the node emits goes through here, so Gazebo, the RMF\nnav graph and the generated world all place a cell at the same\nmetric point."},{"name":"_emit_gazebo_poses","line":1099,"kind":"function","doc":"Submit a visual frame; failures never feed into simulation state."},{"name":"on_tick","line":1115,"kind":"function","doc":"Observe the new state. Never advances the clock."},{"name":"destroy_node","line":1139,"kind":"function","doc":""},{"name":"get","line":147,"kind":"function","doc":""}],"imports":["dataclasses: replace","datetime: datetime","os","subprocess","math: ceil","pathlib: Path","time: perf_counter, sleep","rclpy","rclpy.node: Node","rclpy.qos: QoSDurabilityPolicy, QoSHistoryPolicy, QoSProfile, QoSReliabilityPolicy","robot_interfaces.msg: FleetStatus, RobotState, RobotStateArray","std_msgs.msg: String","mrta_core.order_queue: OrderQueue","mrta_core.orders: describe_order_selection, load_orders_csv, select_orders","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map: ZoneType","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","mrta_core.warehouse_routing: HOME_TYPES","simulation_env.battery_ledger: battery_report_lines","simulation_env.charging: ChargeState, ResourceState, WAITING_STATES","simulation_env.dataset: RunRecorder, build_manifest","simulation_env.run_metrics: run_metrics, write_metrics","simulation_env.fleet: build_fleet, home_stations","simulation_env.grid_robot: GridRobotStatus","simulation_env.workload_executor: WorkloadExecutor, battery_event_line, charging_report_lines, eligibility_report_lines","simulation_env.gazebo_bridge: DEFAULT_PLAYBACK_HZ, DEFAULT_ROBOT_Z, FleetPose, FleetPoseSink, create_robots, fleet_changes, provider_count, remove_robot, robot_models","simulation_env.gazebo_view: grid_to_gazebo","task_management.allocation_strategy: get_batch_strategy"],"summary":"ROS 2 node that deploys the fleet and publishes its state.\n\nBuilds every robot from configuration, places it on its staging\nstation, mirrors the poses into Gazebo once, and publishes the whole\nfleet on /mrta/robot_states at a configured rate.\n\nState is owned by GridRobot and is never read back from Gazebo.\nThe selected FIFO/MRTA workload is executed here.\n\nThe terminal stays short: a header, one status line every\nprogress_interval_s simulated seconds, warnings, and a summary at the\nend, with the full report written to a file. The detail is on topics:\n\n    /mrta/robot_states   every robot: cell, status, battery, current\n                         order, charging state\n    /mrta/fleet_status   order and robot counts, chargers, SOC, who is\n                         charging and who waits for a charger\n    /mrta/events         one line per assignment, completed order and\n                         battery event\n\nverbose:=true prints the full trace to the terminal as well."},{"path":"src/simulation_env/simulation_env/gazebo_bridge.py","size":13435,"symbols":[{"name":"FleetPose","line":24,"kind":"class","doc":"One robot's rendered position for a single visual frame."},{"name":"gz","line":43,"kind":"function","doc":""},{"name":"provider_count","line":52,"kind":"function","doc":"How many gz sim servers advertise a world pose service.\n\nMust be exactly one. Two servers running the same world both\nadvertise the service, and gz-transport hands each request to one\nof them, so pose updates get split and the robot appears to stall\npart way through the mission."},{"name":"FleetPoseSink","line":76,"kind":"class","doc":"Nonblocking Python front-end to one persistent transport process.\n\nThe child owns one ``gz::transport::Node`` and sends one ``Pose_V`` request\nper fleet frame.  A latest-only queue prevents a slow renderer from ever\nback-pressuring scientific execution; intermediate visual frames may be\ndropped, but the newest complete fleet frame is retained."},{"name":"read_robot_z","line":221,"kind":"function","doc":"Reuse whatever Z the world already gave the robot."},{"name":"set_pose","line":234,"kind":"function","doc":""},{"name":"robot_model_sdf","line":311,"kind":"function","doc":"The SDF of one robot, for run-time creation."},{"name":"robot_model","line":317,"kind":"function","doc":"One robot's \u003cmodel>: a small dark cylinder, drawn only.\n\nThe single definition, shared by the fleet world written at Gazebo\nstart and by run-time creation, so a robot looks the same however\nit entered the world. With a pose it is placed there, as a world\nfile needs; without one the creating request carries the pose."},{"name":"create_robots_request","line":347,"kind":"function","doc":"A gz.msgs.EntityFactory_V request creating robots at ``poses``.\n\n``poses`` are FleetPose values. Quotes inside the SDF are escaped for\nthe protobuf text format the gz CLI parses."},{"name":"robot_models","line":370,"kind":"function","doc":"Names of the robot models currently in ``world``."},{"name":"create_robots","line":397,"kind":"function","doc":"Create robot models at their start poses, in one request."},{"name":"remove_robot","line":427,"kind":"function","doc":"Remove one robot model left over from an earlier run."},{"name":"fleet_changes","line":457,"kind":"function","doc":"What to create and what to remove so Gazebo shows exactly the fleet.\n\n``wanted`` are FleetPose values for this run's robots. Returns the\nposes of robots to create and the names of robots to remove."},{"name":"__init__","line":85,"kind":"function","doc":""},{"name":"command","line":114,"kind":"function","doc":""},{"name":"send","line":117,"kind":"function","doc":"Queue one complete fleet frame without waiting for Gazebo."},{"name":"_frame_line","line":145,"kind":"function","doc":""},{"name":"_write_frames","line":168,"kind":"function","doc":""},{"name":"close","line":191,"kind":"function","doc":""},{"name":"__enter__","line":214,"kind":"function","doc":""},{"name":"__exit__","line":217,"kind":"function","doc":""}],"imports":["queue","re","subprocess","threading","dataclasses: dataclass"],"summary":"Gazebo transport helpers.\n\nGazebo is visualization only and is not a ROS system here, so poses go\nout over gz-transport. Shared by the fleet node and the mission\nexecutor so there is one implementation of the retry and\nmultiple-server checks."},{"path":"src/simulation_env/simulation_env/gazebo_view.py","size":1222,"symbols":[{"name":"grid_to_gazebo","line":24,"kind":"function","doc":"Grid cell -> Gazebo cell-centre XY."},{"name":"gazebo_to_grid","line":40,"kind":"function","doc":"Gazebo XY -> grid cell."}],"imports":["mrta_core.grid: Cell","mrta_core.world_view: grid_to_world, world_to_grid"],"summary":"Grid \u003c-> Gazebo view transform.\n\nGazebo is visualization only. The actual transform lives in\n``mrta_core.world_view`` because the RMF navigation graph has to place\nvertices at exactly the same points; this module is the thin\nGazebo-facing name for it.\n\n    gazebo_x = origin_x + grid_x * cell_size\n    gazebo_y = origin_y + grid_y * cell_size\n\nGrid cell (0, 0) therefore renders at (0, 0), and a pose read back out\nof Gazebo is the cell index itself."},{"path":"src/simulation_env/simulation_env/gazebo_world.py","size":8227,"symbols":[{"name":"world_name_of","line":47,"kind":"function","doc":"The Gazebo world name the config asks for."},{"name":"world_file_for","line":56,"kind":"function","doc":"The one world file for this config.\n\n``worlds/\u003cgazebo.world_name>.world`` next to the config first (the\nsource tree), then the installed copy, so a map rebuilt by\nbuild_scenario.py is used without a colcon rebuild."},{"name":"fleet_poses","line":76,"kind":"function","doc":"Each robot of the run on its start cell, as the fleet node places it.\n\n``robots`` is the run's fleet size; 0 keeps fleet.robot_count. The\ncells come from the same build_fleet the node uses, and the XY from\nthe same cell-to-Gazebo transform, so the robots load exactly where\nthe node's first frame will put them."},{"name":"with_fleet","line":103,"kind":"function","doc":"The world with one robot model per pose, added before \u003c/world>.\n\nEverything else in the world is left exactly as it was."},{"name":"model_names","line":122,"kind":"function","doc":"Names of the \u003cmodel> elements in a world file, in order."},{"name":"write_fleet_world","line":135,"kind":"function","doc":"Write the world plus the parked fleet to a temporary file.\n\nThe file keeps the world's own file name, so a later start\nrecognises the Gazebo running it, and lives in its own directory\nunder the temporary directory, rewritten on every start."},{"name":"is_gazebo_for","line":165,"kind":"function","doc":"Is this command line a ``gz sim`` running a world of this file name?\n\nGazebo's ruby front end rewrites its process title, so the command\nline can be one string (\"gz sim -r path\") rather than separate\narguments. A shell that merely mentions gz sim (``bash -c \"gz sim\n...\"``) is not Gazebo and is never matched."},{"name":"partition_of","line":185,"kind":"function","doc":"GZ_PARTITION from a /proc/\u003cpid>/environ blob ('' when unset)."},{"name":"gazebo_pids","line":195,"kind":"function","doc":"This user's gz sim processes running this world on this partition.\n\nAnother partition is another set of Gazebo servers that cannot see\nthis one, so it is left alone. ``proc`` is only ever changed by a\ntest."},{"name":"stop_gazebo","line":236,"kind":"function","doc":"Stop every Gazebo running this world here; returns the pids stopped."},{"name":"_alive","line":262,"kind":"function","doc":""}],"imports":["os","signal","tempfile","time","dataclasses: replace","pathlib: Path","yaml","mrta_core.sim_config: load_sim_config","mrta_core.warehouse_map_xlsx: load_warehouse_xlsx","simulation_env.fleet: build_fleet","simulation_env.gazebo_bridge: DEFAULT_ROBOT_Z, ROBOT_NAME_RE, FleetPose, robot_model","simulation_env.gazebo_view: grid_to_gazebo"],"summary":"Start Gazebo with the fleet already parked: the world, and nothing else.\n\nGazebo starts from the one world file, which holds the warehouse only.\nRobots created after Gazebo is up arrive late, and a window still\nloading the warehouse can miss them altogether. So starting Gazebo\nwrites a temporary copy of the world with every robot of the run on its\nstart cell, exactly where the fleet node will put it, and Gazebo loads\nthe warehouse and the fleet together. The fleet node then finds the\nrobots there and creates none.\n\nThe copy lives in the temporary directory and is rewritten on every\nstart. It is not a scenario world: the repo keeps one world per map.\n\nStarting also stops a Gazebo already running this world on this\nGZ_PARTITION, because two servers for one world split the pose stream\nbetween them and the fleet node then refuses to draw at all.\n\nVisualization only. Nothing here touches the simulation."},{"path":"src/simulation_env/simulation_env/grid_robot.py","size":7488,"symbols":[{"name":"GridRobotStatus","line":25,"kind":"class","doc":"Execution state of the deterministic grid robot.\n\nDeliberately separate from :class:`mrta_core.models.RobotStatus`,\nwhich is the coarser planning view (IDLE / BUSY / FAILED) consumed\nby the symbolic predicate layer. These are the finer states the\nexecutor drives."},{"name":"GridRobot","line":47,"kind":"class","doc":""},{"name":"move_duration","line":82,"kind":"function","doc":"Simulated seconds for one grid edge. Pure."},{"name":"set_sim_time","line":86,"kind":"function","doc":"Stamp the robot with the authoritative clock's time."},{"name":"book_travel","line":90,"kind":"function","doc":""},{"name":"book_wait","line":93,"kind":"function","doc":"Account for a stationary wait. No distance, no travel."},{"name":"book_charge","line":101,"kind":"function","doc":"Account for one completed charge session. No distance."},{"name":"book_service","line":109,"kind":"function","doc":"Account for a stationary service. No clock advance."},{"name":"move_to","line":122,"kind":"function","doc":"Move one grid edge to an explicit cell. No time.\n\nUsed when the traffic layer, rather than a stored path, says\nwhere the robot goes next."},{"name":"advance_cell","line":138,"kind":"function","doc":"Move one grid edge along the stored path. No time."},{"name":"assign_path","line":184,"kind":"function","doc":""},{"name":"goal_cell","line":204,"kind":"function","doc":""},{"name":"finished","line":212,"kind":"function","doc":""},{"name":"step","line":225,"kind":"function","doc":"Move one grid edge and advance this robot's own clock."},{"name":"serve","line":244,"kind":"function","doc":"Hold position and advance this robot's own clock."}],"imports":["dataclasses: dataclass, field","enum: Enum","mrta_core.grid: Cell"],"summary":"Lightweight deterministic grid robot.\n\nThis robot has no physics and no Nav2.\n\nIt moves cell by cell through a precomputed grid path and holds\nposition for deterministic service durations.\n\nThe robot does not own the simulation clock. ``advance_cell`` performs\nthe state transition and ``move_duration`` says how long it takes;\ndeciding *when* it completes belongs to whoever owns the clock, which\nfor a fleet is FleetSimulationEngine. ``sim_time`` here is a reported\ntimestamp, written by the clock owner, not a private counter.\n\n``step`` and ``serve`` remain as single-robot conveniences that do both\nat once, for the one-robot executor. They must not be used to drive a\nfleet: eighteen private clocks are not a warehouse time."},{"path":"src/simulation_env/simulation_env/local_traffic_controller.py","size":11303,"symbols":[{"name":"TrafficDecision","line":35,"kind":"class","doc":""},{"name":"MovementIntent","line":42,"kind":"class","doc":""},{"name":"MovementDecision","line":51,"kind":"class","doc":""},{"name":"LocalTrafficController","line":57,"kind":"class","doc":"Resolve one simultaneous batch of one-cell movement intentions."},{"name":"_robot_tie_key","line":61,"kind":"function","doc":""},{"name":"priority_key","line":70,"kind":"function","doc":"Smaller tuple has higher right-of-way."},{"name":"winner","line":80,"kind":"function","doc":""},{"name":"rotation_members","line":84,"kind":"function","doc":"Robots on a closed movement loop of three or more.\n\nRobot r points at robot h when h holds r's target and h is in\nthis batch moving out of exactly that cell. Each robot has one\ntarget, so each points at most once, and a loop is a set of\nrobots that can all move in the same instant: every target is\nvacated by its holder. Robots in ``excluded`` (a side step is\nrequired of them) cannot be part of one. A robot not in the\nbatch -- servicing, charging, mid-transit, stationary -- is never\npointed at, so no loop runs through it.\n\nA loop of two is a head-on swap and is never a rotation."},{"name":"resolve","line":138,"kind":"function","doc":""}],"imports":["__future__: annotations","dataclasses: dataclass","enum: Enum","re","mrta_core.grid: Cell"],"summary":"Local batch traffic arbitration for grid robots.\n\nThis controller does not allocate orders and does not plan missions.\n\nIt only decides which simultaneous one-cell movement intentions may\nproceed safely at the current simulation instant.\n\nTemporary right-of-way rule:\n\n1. Busy robot beats non-busy robot.\n2. Smaller remaining distance to current destination wins.\n3. Lower numeric robot ID breaks an exact tie.\n\nHead-on edge swaps are never approved directly. The lower-priority\nrobot must locally yield before the higher-priority robot may pass.\n\nRotations. Robots that each want the cell the next one is leaving,\nclosing a loop of three or more, can all move at once: every target is\nvacated in the same batch. Such a loop member wins the contention for\nthe cell it rotates into; the rule above decides every other\ncontention. Without this a robot outside a full ring could win a ring\ncell, stall the ring, and so wait forever for a cell the stalled ring\ncan never vacate (docs/DECISIONS.md, \"Rotation Right-of-Way\")."},{"path":"src/simulation_env/simulation_env/local_yield_selector.py","size":3798,"symbols":[{"name":"_neighbors","line":38,"kind":"function","doc":""},{"name":"_manhattan","line":45,"kind":"function","doc":""},{"name":"select_local_yield_cell","line":49,"kind":"function","doc":"Return one safe adjacent yield cell, or None.\n\nPreference:\n1. valid local cell\n2. minimum distance back toward the robot's intended target\n3. deterministic coordinate ordering"}],"imports":["__future__: annotations","mrta_core.grid: Cell","mrta_core.warehouse_map: WarehouseMap","mrta_core.warehouse_routing: NON_TRANSIT_TYPES, directional_blocked_edges"],"summary":"Select one nearby temporary yield cell for a local traffic conflict.\n\nThe selector performs no mission planning and no MRTA.\n\nA yield cell must:\n- be one Manhattan step from the robot\n- be inside the warehouse\n- be traversable\n- not be a shelf or dropoff service cell\n- not currently be occupied\n- not be reserved by another simultaneous movement\n- not be part of the immediate conflicting edge\n- be legal to enter AND to leave again under the directed lane\n  policy, because the rejoin is a single reverse step\n\nThe robot moves there temporarily, lets the higher right-of-way robot\npass, then returns to its route."},{"path":"src/simulation_env/simulation_env/paired.py","size":7678,"symbols":[{"name":"PairingError","line":78,"kind":"class","doc":"The runs cannot be compared as pairs: missing, mixed or mismatched."},{"name":"settings_signature","line":82,"kind":"function","doc":"Hash of a run.json with the per-run fields removed.\n\nTwo runs of one experiment have the same signature exactly when\nthey ran the same map and simulator settings from the same commit.\nThe tree's dirty flag is recorded in run.json but is not part of\nthe signature."},{"name":"check_complete","line":97,"kind":"function","doc":"Every expected (strategy, robots, seed) run is present, no other.\n\n``expected`` is the experiment's grid from experiment.json."},{"name":"check_settings","line":116,"kind":"function","doc":"Every run of the experiment shares one settings signature."},{"name":"interval","line":137,"kind":"function","doc":"(mean, low, high) of the paired differences; None bounds if n \u003c 2."},{"name":"_keyed","line":151,"kind":"function","doc":"(strategy, robots) -> seed -> row, refusing a duplicate run."},{"name":"_same_workload","line":168,"kind":"function","doc":""},{"name":"paired_differences","line":178,"kind":"function","doc":"One record per (strategy, robots, metric) against the baseline.\n\nEach record: strategy, robots, metric, n (paired seeds), baseline\nmean, mean difference, its 95% bounds, and the mean difference as a\npercentage of the baseline mean."}],"imports":["collections: defaultdict","hashlib: sha256","json: dumps","math: sqrt","statistics: mean, stdev","scipy.stats: t"],"summary":"Paired comparison of strategies over workload seeds.\n\ndocs/DECISIONS.md, \"Workload Seeds and Paired Comparison\": a seed\nselects a workload, every strategy runs the same workload at a given\nseed and fleet size, and strategies are compared by their per-seed\ndifferences with a 95% confidence interval, not by rankings.\n\nFor one strategy against the baseline, at one fleet size and on one\nmetric, the pairs are the seeds both ran. The difference is\n``strategy - baseline``, so a negative makespan difference means the\nstrategy finished earlier. The interval is the paired t-interval:\n\n    mean(d) +/- t(0.975, n - 1) * sd(d) / sqrt(n)\n\nBefore any difference is taken, the experiment's integrity is checked\n(E1): every expected strategy x fleet size x seed run is present\n(check_complete), every run shares one simulator setting\n(check_settings), and the two runs of a pair executed the same\nworkload at the same fleet size (paired_differences).\n\nRead only: rows are summary.csv rows from run_experiment.py."},{"path":"src/simulation_env/simulation_env/reservations.py","size":15353,"symbols":[{"name":"CellInterval","line":37,"kind":"class","doc":""},{"name":"EdgeInterval","line":45,"kind":"class","doc":""},{"name":"ReservationTable","line":54,"kind":"class","doc":""},{"name":"owner","line":68,"kind":"function","doc":""},{"name":"held_cells","line":71,"kind":"function","doc":""},{"name":"transits","line":76,"kind":"function","doc":"Every move currently in flight: robot -> (source, target, start, end).\n\nRead-only view for a visualiser that needs to know where a robot\nis *between* two cells. Nothing here influences the simulation;\nthe entry is created by ``begin_move`` and removed by\n``complete_move``."},{"name":
